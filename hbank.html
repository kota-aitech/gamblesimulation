<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">

<title>競馬場ガイド</title>
<style>
:root{
  --paper:#fbf8f1; --paper2:#f1ebdc; --band:#1a1512;
  --ink:#14100c; --sub:#6a6055; --faint:#9a9083;
  --rule:#2a2420; --rule2:#cfc6b4; --rule3:#e6dfd0;
  --red:#c0102a; --blue:#1b4f9c; --gold:#f0c24a; --green:#1d6b3f;
  --mincho:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP",serif;
  --gothic:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--gothic);font-size:12.5px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%;overflow-x:hidden}
a{color:inherit}button{font:inherit;color:inherit;cursor:pointer}
.masthead{background:var(--band);color:#fdf9f0;padding:8px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.masthead .logo{font-family:var(--mincho);font-size:20px;font-weight:700;letter-spacing:.12em}
.masthead .logo em{font-style:normal;color:var(--gold)}
.masthead nav{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.masthead nav a{color:#fdf9f0;text-decoration:none;border:1px solid #4a423a;border-radius:2px;padding:3px 8px;font-size:11px;white-space:nowrap}
.tabs{display:flex;border-bottom:2px solid var(--rule);background:var(--paper2)}
.tabs button{flex:1;max-width:240px;padding:9px 12px;border:0;border-right:1px solid var(--rule2);background:transparent;font-family:var(--mincho);font-size:15px;font-weight:700;color:var(--sub)}
.tabs button small{display:block;font-family:var(--gothic);font-weight:400;font-size:10.5px;color:var(--faint)}
.tabs button.on{background:var(--band);color:#fdf9f0}.tabs button.on small{color:#c8bfae}
.lead{padding:10px 14px;border-bottom:1px solid var(--rule2);font-size:12px;line-height:1.7}
.bar{display:flex;gap:6px 14px;align-items:center;padding:7px 14px;border-bottom:1px solid var(--rule2);flex-wrap:wrap;background:#fff}
.bar button{background:#fff;border:1px solid var(--rule2);border-radius:2px;padding:3px 9px;font-size:12px;color:var(--sub)}
.bar button.on{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:700}
.bar .lab{color:var(--faint);font-size:11px}
.wrap{padding:10px 14px 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:10px}
.card{border:1px solid var(--rule2);background:#fff;padding:9px 11px}
.card .hd{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--rule3);padding-bottom:4px;margin-bottom:6px}
.card .nm{font-family:var(--mincho);font-size:18px;font-weight:700}
.tag{display:inline-block;font-size:10.5px;padding:0 5px;border-radius:2px;color:#fff;background:#8b8578;white-space:nowrap}
.tag.r{background:var(--blue)}.tag.l{background:var(--red)}
.kv{display:grid;grid-template-columns:86px 1fr 90px;gap:2px 6px;align-items:center;font-size:11.5px}
.kv .k{color:var(--sub)}.kv .v{text-align:right;white-space:nowrap}
.bar2{height:8px;background:var(--rule3);position:relative}.bar2 i{position:absolute;left:0;top:0;bottom:0;background:var(--blue)}.bar2 i.r{background:var(--red)}
.sf{margin-top:6px;padding:5px 7px;border:1px solid var(--rule3);background:#fdfbf6}
.sf h4{margin:0 0 3px;font-family:var(--mincho);font-size:13px}
.sec{margin-top:6px;padding-top:5px;border-top:1px dotted var(--rule3)}.sec b.t{font-size:11px;color:var(--sub);font-weight:600}
ul.sum{margin:4px 0 0;padding-left:16px;font-size:12px}ul.sum li{margin:2px 0}
table.mini{border-collapse:collapse;font-size:11px;background:#fff;width:100%}
table.mini th,table.mini td{border:1px solid var(--rule2);padding:2px 5px;text-align:right}
table.mini th{background:var(--paper2);font-weight:600;text-align:center}table.mini td.l{text-align:left}
.note{font-size:11px;color:var(--sub);line-height:1.7}
.quote{font-size:11px;color:var(--sub);margin-top:4px;line-height:1.7}
details summary{cursor:pointer;font-size:11px;color:var(--blue)}
.go{margin-top:6px;font-size:11px}.go a{color:var(--blue)}
footer{border-top:2px solid var(--rule);background:var(--paper2);padding:10px 14px 30px;color:var(--sub);font-size:11px;line-height:1.7}
@media (max-width:640px){.grid{grid-template-columns:1fr}.wrap{padding:8px 8px 40px}.tabs button{font-size:14px;padding:8px 4px}}
</style>
</head>

const NKHG={"built":"2026-09-28T08:46:15.312Z","jra":[{"name":"札幌","code":"01","turn":"右","notes":["コースは右回り、芝、ダートともに特筆するほどの起伏は設けられておらず、「ほぼ平坦」なつくりの札幌競馬場には、ユニークな特徴を指摘できる。コースが全体的に“丸っこい”ことだ。","芝コースの1周距離は1640.9メートル（芝コースの距離についてはAコースの数値を用いる）と、ローカル場のなかでは標準以上の大きさを誇るのに、4コーナーからゴール板までの距離（266.1メートル）は、函館（262.1メートル＝A、Bコース使用時。全場のなかで最も短い）とほとんど変わらない。しかも直線の半ば過ぎにゴール板が設けられている函館と違い、札幌のゴール板は1コーナー寄りに設置されている。従って実質的なホームストレッチの長さ（4コーナーから1コーナーまでの距離）は、函館よりも短い計算になる。","札幌の場合、4つのコーナーはそれぞれ半径が大きく、“緩やかで大きなカーブ”で構成されている。コースの全長のなかでコーナー部分の占める割合が多く、そのかわりに、直線部分が短くなっているというわけだ。一般的な競馬場を楕円形とすれば、札幌は「円形に近い」競馬場なのである。","芝コースの内側に設けられているダートコースも、ほぼ同じようなレイアウト。1周距離は1487メートルと、ローカル場のダートコースのなかでは中京に次ぐ大きさを誇るが、直線の長さは264.3メートルしかない。ちなみに中京のダートコースは1周距離が1530メートル、直線の長さが410.7メートルである。2つの競馬場のサイズを比較すれば、札幌がいかに独特な形状をした競馬場なのかがお分かりいただけるだろう。"],"src":"https://www.jra.go.jp/facilities/race/sapporo/course/index.html","turf":{"len":1640.9,"straight":[266.1,269.1],"height":[0.7,0.7],"width":[25,27],"dists":[1000,1200,1500,1800,2000,2600],"races":594,"fav":0.349,"front":0.611,"back":0.101,"gateEdge":0.002,"heavy":0.237,"e3Med":25970,"man":0.212,"agari":35.3,"rank":{"straight":9,"height":10,"front":2,"back":10,"fav":2,"e3Med":5,"gateEdge":6},"summary":["芝の直線が短い（269.1m）","芝はほぼ平坦（高低差 0.7m）","芝は逃げ・先行が勝ちやすい（勝ち馬の4角が前1/4 61%）","芝は1番人気が強い（1着率 35%）"]},"dirt":{"len":1487,"straight":[264.3,264.3],"height":[0.9,0.9],"width":[20,20],"dists":[1000,1700,2400],"races":414,"fav":0.349,"front":0.766,"back":0.065,"gateEdge":-0.057,"heavy":0.297,"e3Med":24140,"man":0.179,"agari":37.5,"rank":{"straight":9,"height":9,"front":3,"back":7,"fav":4,"e3Med":7,"gateEdge":10},"summary":["ダートの直線が短い（264.3m）","ダートはほぼ平坦（高低差 0.9m）","ダートは逃げ・先行が勝ちやすい（勝ち馬の4角が前1/4 77%）","ダートは外枠の方が3着内に来ている（7-8枠が1-2枠より 5.7pt 上）"]}},{"name":"函館","code":"02","turn":"右","notes":["夏の北海道開催のオープニングを受け持つ函館は右回りの競馬場。芝コースの1周距離は1626.6メートル（芝コースの距離についてはAコースの数値を用いる）、ダートコースは1475.8メートルと札幌競馬場（芝は1640.9メートル、ダートは1487メートル）より少し短いが、勝負どころのカーブを滑らかに回れるよう、3、4コーナーにはスパイラルカーブが導入されている。","一方では、ゴール板から1コーナーまでの距離が長めにとられているレイアウトのため、直線の長さは芝コースが262.1メートル、ダートが260.3メートルと、全場のなかで最も短い。この数字を東京・芝コースの直線にあてはめると、“坂を上り終えた地点からゴール板までの距離（300メートル）”よりも短い。それほど短い直線を背景に、レースではやはり逃げ、先行タイプの活躍が目立つ。反対に後方一気の追い込みタイプはかなりの苦戦を余儀なくされている。","もっとも、ほぼ平坦な札幌とは違い、コース全体の高低差は芝、ダートとも3.5メートル。ローカル競馬場（札幌・函館・福島・新潟・中京・小倉）の中では最大（芝の3.5メートルは中京と同じ）の起伏がつけられていることは見逃せない。 もう少し詳細に書くと、ゴール板から2コーナーにかけてはゆるやかな下り勾配、その後は4コーナーまでだらだらとした上り勾配が続き、最後は直線に向けてなだらかに下るというレイアウト。つまり、3コーナーから4コーナーにかけて小高い丘が設けられているのだ。","従って、2コーナーポケットからスタートを切る芝1200メートル、また、ダート1000メートルの序盤の先行争いはほぼ丸々、上り勾配で繰り広げられる。一方、向正面半ばにスタート地点が設けられている芝2600メートルでは、スタートからゴールまでの間に上り勾配を2回走ることに。勾配自体はそれほど急ではないものの、見た目よりもかなりタフな設定のコースと言える。"],"src":"https://www.jra.go.jp/facilities/race/hakodate/course/index.html","turf":{"len":1626.6,"straight":[262.1,264.5],"height":[3.5,3.5],"width":[22,29],"dists":[1000,1200,1700,1800,2000,2600],"races":510,"fav":0.311,"front":0.602,"back":0.112,"gateEdge":0.062,"heavy":0.255,"e3Med":29750,"man":0.21,"agari":35.1,"rank":{"straight":10,"height":3,"front":3,"back":9,"fav":9,"e3Med":3,"gateEdge":2},"summary":["芝の直線が短い（264.5m）","芝の高低差が大きい（3.5m）","芝は逃げ・先行が勝ちやすい（勝ち馬の4角が前1/4 60%）","芝は内枠有利（1-2枠と7-8枠の3着内率の差 6.2pt）","芝は1番人気が勝ちにくい（31%）"]},"dirt":{"len":1475.8,"straight":[260.3,260.3],"height":[3.5,3.5],"width":[20,20],"dists":[1000,1700,2400],"races":354,"fav":0.385,"front":0.774,"back":0.059,"gateEdge":0.019,"heavy":0.367,"e3Med":19990,"man":0.178,"agari":37.2,"rank":{"straight":10,"height":2,"front":1,"back":8,"fav":1,"e3Med":10,"gateEdge":2},"summary":["ダートの直線が短い（260.3m）","ダートの高低差が大きい（3.5m）","ダートは逃げ・先行が勝ちやすい（勝ち馬の4角が前1/4 77%）","ダートは内枠有利（1-2枠と7-8枠の3着内率の差 1.9pt）","ダートは1番人気が強い（1着率 39%）"]}},{"name":"福島","code":"03","turn":"右","notes":["コースは右回り、芝の1周距離は1600メートル（芝コースの距離についてはAコースの数値を用いる）、ダートは1444.6メートルという福島は、JRA全場のなかで最もコンパクト（＝1周距離が短い）な競馬場だ。とはいえ、コースには独特な起伏がつけられ、3、4コーナーにはスパイラルカーブを採用。スリリングかつスピーディーなレースが楽しめるよう、工夫が凝らされている。","独特な起伏について、芝コースを例に見てみよう。ゴール板を過ぎてから2コーナーにかけてなだらかな下り勾配（高低差1.7メートル）が続き、向正面には一転、同1.3メートルの上り勾配が設けられている。その後、平坦部分を挟み、4コーナーから直線（残り170メートル付近まで）にかけて再び緩やかな下り勾配に。そして残り170メートル付近から残り50メートル付近までは高低差1.2メートルの上り勾配を駆け上がってゴールに至る。全体の高低差は1.9メートル（ダートコースは2.1メートル）と、特筆するほどの数字ではなく、ゴール前の上りをはじめ、勾配自体も決してキツくはないが、コースを1周する間にアップダウンを2回繰り返す（ダートコースの起伏構成も芝コースとほぼ同じ）のはかなりユニーク。実はでこぼこした競馬場なのである。","292メートルという芝コースの直線の長さ（Aコース使用時）は、ローカル場としては標準的な数字だが、差しもまずまず決まる。小回りコースのイメージにはあまりとらわれすぎないようにしたい。ただし注目度が高い初夏の開催は梅雨とまともに重なるため、雨の影響を受けやすい。ひと昔前に比べると排水性は格段に良化、馬場も傷みにくくなった近年だが、開催が進むにつれて“外差し”が決まるケースが増えるのは変わらない傾向。一方のダートコースでは「水準以上に逃げ馬の活躍が目立つ」ことも頭に入れておこう。","そのダートのうち、1150メートルのレースだけは芝からスタートする。また、障害レースは固定障害の専用コースと置き障害の本馬場で争われる設定。内馬場のタスキコース、バンケット障害の側面に浮かぶ「FKC」（福島競馬倶楽部の略称）というツツジの植栽文字は、1935年に障害専用コースが新設された際につくられたもので、競馬場のシンボルのひとつとして現在に引き継がれている。"],"src":"https://www.jra.go.jp/facilities/race/fukushima/course/index.html","turf":{"len":1600,"straight":[292,299.7],"height":[1.9,1.9],"width":[23,27],"dists":[1000,1200,1700,1800,2000,2600],"races":674,"fav":0.301,"front":0.613,"back":0.113,"gateEdge":0.03,"heavy":0.123,"e3Med":37060,"man":0.237,"agari":35.3,"rank":{"straight":7,"height":9,"front":1,"back":8,"fav":10,"e3Med":1,"gateEdge":5},"summary":["芝は逃げ・先行が勝ちやすい（勝ち馬の4角が前1/4 61%）","芝は1番人気が勝ちにくい（30%）","芝は荒れやすい（3連単の中央値 37,060円）"]},"dirt":{"len":1444.6,"straight":[295.7,295.7],"height":[2.1,2.1],"width":[25,25],"dists":[1000,1150,1700,2400],"races":507,"fav":0.286,"front":0.763,"back":0.055,"gateEdge":-0.011,"heavy":0.231,"e3Med":32700,"man":0.272,"agari":37.5,"rank":{"straight":7,"height":7,"front":4,"back":9,"fav":10,"e3Med":1,"gateEdge":3},"summary":["ダートは1番人気が勝ちにくい（29%）","ダートは荒れやすい（3連単の中央値 32,700円）"]}},{"name":"新潟","code":"04","turn":"左","notes":["国内初となる直線コース（芝1000メートル）を新設したうえに、従来の右回りを左回りに作り変えるという大掛かりなコース改造工事が竣工した2001年夏以降、新潟は多彩な顔を持つ競馬場に生まれ変わった。まずは、日本最大のスケールを誇る芝・外回りコース。2223メートル（芝コースの距離についてはAコースの数値を用いる）という1周距離は日本最長、658.7メートルという直線も、東京のそれより130メートル余りも長い。","この長い長い直線を騎手たちも意識するため、外回りコースのレースでは序盤から中盤にかけてはゆったりとしたペースで流れ、直線の末脚比べに持ち込まれるケースが多い。3コーナーと4コーナーにはスパイラルカーブ（内回りコース、ダートコースも同じ）。外回りコースではここに高低差1.6メートルほどの緩やかな下り勾配も設けられているので、馬たちは自然と勢いがついて直線に向く。このため、レースの上がりタイムは速くなるのが常。しっかりとした決め手を持つ馬でなければ、なかなか勝利には手が届かない。","一方の芝・内回りコースも水準以上の大きさを誇る。Aコース使用時の1周距離は1623メートルと標準サイズだが、直線（358.7メートル）は中山（310メートル）よりもかなり長いのだ。ダートコースの直線の長さ（353.9メートル）も全国で3番目。ダートでは逃げ、先行タイプが優勢ながら、芝の内回りコースでは差し馬が水準以上の成績を残している。「内回り（及びダートコース）の直線も決して短くはない」こと、水はけの良さには定評があり、雨の影響を受けにくいこと、また、新潟のみが一年中「オール野芝」で開催が行われていることも頭に入れておこう。","ダートの1200メートルは芝スタート。置き障害によって争われる障害レースでは、飛越力だけではなく、スピードも問われる。また、“直千”の愛称で親しまれている新潟名物の直線競馬では、「外枠優勢」の傾向がみえる。"],"src":"https://www.jra.go.jp/facilities/race/niigata/course/index.html","turf":{"len":1623,"straight":[358.7,658.7],"height":[0.8,2.2],"width":[21,25],"dists":[1000,1200,1400,1600,1800,2000,2200,2400,3000,3200],"races":1065,"fav":0.314,"front":0.486,"back":0.202,"gateEdge":-0.05,"heavy":0.223,"e3Med":29740,"man":0.251,"agari":34.2,"rank":{"straight":1,"height":8,"front":7,"back":4,"fav":6,"e3Med":4,"gateEdge":10},"summary":["芝の直線が長い（658.7m、10場で 1位）","芝は外枠の方が3着内に来ている（7-8枠が1-2枠より 5.0pt 上）"]},"dirt":{"len":1472.5,"straight":[353.9,353.9],"height":[0.6,0.6],"width":[20,20],"dists":[1000,1200,1700,1800,2500],"races":815,"fav":0.352,"front":0.667,"back":0.092,"gateEdge":-0.047,"heavy":0.335,"e3Med":29970,"man":0.227,"agari":37.6,"rank":{"straight":3,"height":10,"front":6,"back":5,"fav":2,"e3Med":3,"gateEdge":8},"summary":["ダートの直線が長い（353.9m、10場で 3位）","ダートはほぼ平坦（高低差 0.6m）","ダートは1番人気が強い（1着率 35%）"]}},{"name":"東京","code":"05","turn":"左","notes":["日本ダービーやジャパンカップをはじめ、数々のビッグレースが行われる東京競馬場は、日本競馬の「顔」と呼ぶにふさわしいスケールの大きな競馬場だ。コースは左回りで、芝の1周距離は2083.1メートル（芝コースの距離についてはAコースの数値を用いる）、直線の長さは525.9メートル。幅員も最大41メートルと非常に広い。","起伏の構成もチャンピオンの座を争うコースにふさわしいハードなもの。ゴールを起点に追っていくと、1コーナーから向正面半ばにかけて高低差1.9メートルの長い下り坂が続き、その直後、3コーナーの手前には、高低差1.5メートルの上り坂が待ち受ける。 最初の坂を上りきった後は短い平坦部分を挟んで下り勾配が続き、4コーナーの手前からは再び若干の上り勾配に。そして直線、残り460メートル地点から300メートル地点にかけては2つめの上り坂が設けられている。中山や阪神に比べると勾配自体はなだらかでも、高低差は2メートルに及ぶこの坂を上り切った後も、300メートル（函館・芝コースの直線の長さとほぼ同じ）走ってようやくゴールにたどり着く。コースを1周する間に“2つの坂”を上り下りするレイアウトは福島も同じだが、スケールは段違いなのだ。","新潟などのローカル場と違い、カーブの半径がゆったりしているため、コーナーでゴチャつく可能性も低い。さらに広々とした幅員をいかし、4つ（A、B、C、D）のコースを使い分けることによって、馬場の傷みの分散化が図られている。様々な面から“紛れ”の介在する余地が小さいわけで、馬の能力がストレートに反映されやすいコースと言える。","一方のダートコースは1周距離が1899メートル、直線の長さが501.6メートルと、正真正銘、日本一のスケールを誇る。バックストレッチとホームストレッチに2つの坂が設けられている起伏構成は芝コースと同じだが、直線の上り坂の高低差は2.4メートルと芝コースを上回る。こちらも非常にタフでハードなコースなのである。"],"src":"https://www.jra.go.jp/facilities/race/tokyo/course/index.html","turf":{"len":2083.1,"straight":[525.9,525.9],"height":[2.7,2.7],"width":[32,41],"dists":[1400,1600,1800,2000,2300,2400,2500,2600,3400],"races":1436,"fav":0.377,"front":0.425,"back":0.264,"gateEdge":-0.011,"heavy":0.095,"e3Med":15780,"man":0.161,"agari":33.9,"rank":{"straight":2,"height":6,"front":10,"back":1,"fav":1,"e3Med":10,"gateEdge":7},"summary":["芝の直線が長い（525.9m、10場で 2位）","芝は差し・追込が届く（勝ち馬の4角が後ろ半分 26%）","芝は1番人気が強い（1着率 38%）"]},"dirt":{"len":1899,"straight":[501.6,501.6],"height":[2.5,2.5],"width":[25,25],"dists":[1200,1300,1400,1600,2100,2400],"races":1498,"fav":0.336,"front":0.575,"back":0.147,"gateEdge":-0.033,"heavy":0.346,"e3Med":26740,"man":0.223,"agari":36.6,"rank":{"straight":1,"height":6,"front":10,"back":1,"fav":8,"e3Med":5,"gateEdge":6},"summary":["ダートの直線が長い（501.6m、10場で 1位）","ダートは差し・追込が届く（勝ち馬の4角が後ろ半分 15%）"]}},{"name":"中山","code":"06","turn":"右","notes":["中山競馬場の芝コースには「内回り」と「外回り」の設定がある。2つのコースは2コーナーで分岐し、3コーナーで再び合流。もともとは3コーナーから向正面奥にかけて新設された芝1200メートル用の走路を、その後、さらに延伸して2コーナーにつなげ、現在のレイアウトになった。ちなみに、有馬記念が行われる芝2500メートル戦は内回りが舞台だが、スタート後、まっすぐにコーナーへ進入できるよう、発走地点は外回りコース上に設けられている。","外回りコースに比べ、2コーナーと3コーナーのカーブがかなりタイトな内回りコースは、見た目通りの「小回り」コース。実際、内回りコースの1周距離（1667.1メートル。芝コースの距離についてはAコースの数値を用いる）は札幌競馬場（1640.9メートル）と大差なく、310メートルという直線の長さも、いわゆる4大場（東京、中山、京都、阪神）の中ではもっとも短い。1周距離が1839.7メートルという外回りコースはともかく、内回りコースのサイズは「少し大きめのローカル場」と表現するのが当たっている。","とはいえ、コース全体の高低差は内回り、外回りとも5.3メートル。JRA全10場の中でも最大（次位は京都競馬場・外回りの4.3メートル）で、2階建ての建物に相当するこの高低差が、中山のレースに独特のアクセントを加えている。","全体の起伏を見ていくと、ゴール地点から1コーナーにかけて上り勾配が続き、2コーナーの手前で最高到達点を迎える。内回り、外回りとも、そこからは下り勾配に転じ、間に平坦部分を挟みながらホームストレッチ半ばの最深部まで延々と長い下り坂が続く。そして、ゴール前に待ち受けるのが中山名物の急坂。残り180メートルから残り70メートル地点にかけて設けられている上り坂の高低差は2.2メートル、最大勾配の2.24%も10場最大で、馬たちにとっては文字通り、“最後の難関”と言える。"],"src":"https://www.jra.go.jp/facilities/race/nakayama/course/index.html","turf":{"len":1667.1,"straight":[310,310],"height":[5.3,5.3],"width":[26,32],"dists":[1200,1600,1800,2000,2200,2500,2600,3200,3600,4000],"races":1231,"fav":0.312,"front":0.601,"back":0.138,"gateEdge":0.046,"heavy":0.219,"e3Med":25450,"man":0.21,"agari":34.9,"rank":{"straight":6,"height":1,"front":4,"back":6,"fav":7,"e3Med":6,"gateEdge":4},"summary":["芝の高低差が大きい（5.3m）"]},"dirt":{"len":1493,"straight":[308,308],"height":[4.5,4.5],"width":[25,25],"dists":[1000,1200,1700,1800,2400,2500],"races":1589,"fav":0.351,"front":0.741,"back":0.069,"gateEdge":-0.047,"heavy":0.369,"e3Med":26070,"man":0.213,"agari":37.8,"rank":{"straight":6,"height":1,"front":5,"back":6,"fav":3,"e3Med":6,"gateEdge":9},"summary":["ダートの高低差が大きい（4.5m）","ダートは外枠の方が3着内に来ている（7-8枠が1-2枠より 4.7pt 上）"]}},{"name":"中京","code":"07","turn":"左","notes":["高松宮記念、チャンピオンズCと2つのG&#8544;が組まれている中京は左回りの競馬場。かつてはローカル場らしい形状（ほぼ平坦、小回り、直線も短い）をしていたが、敷地を拡張して大規模なコース改修工事が行われた結果、芝コースの1周距離は1600メートルから1705.9メートル（芝コースの距離についてはAコースの数値を用いる）に、直線の長さは313.8メートルから412.5メートルにそれぞれ延伸、直線には後述するような“坂”も新設され、2012年3月のリニューアルオープン以降は従来のイメージを一新するユニークな競馬場に生まれ変わった。","ちなみに芝コースの1周距離は阪神や中山の内回りよりも長く、直線の長さは京都の外回りよりも長い。一方、ダートコースの1周距離も1530メートルと、東京、京都に次いで全場3位、直線の長さは410.7メートルと東京に次いで長い。“標準以上にサイズが大きい競馬場”なのである。","芝コースの高低差3.5メートル（ダートコースは3.4メートル）も中山、京都に次いで全場3位。起伏の構成に目を向けると、ゴール地点からなだらかな上り勾配が続き、向正面の半ばあたりで最高点に達する。そこからは直線の入口にかけてなだらかに下り（3、4コーナーは芝、ダートともにスパイラルカーブ）、新設された急坂に差し掛かる。直線に向いてすぐの地点に設けられているこの上り坂の勾配は約2%（高低差は約2メートル）。日本一の急坂である中山の最大勾配（2.24%）には及ばないものの、“阪神や東京より急な坂”を駆け上がってなお、ゴールまでは200メートル余りあるのだから、かなりタフな設定といえる。そんなレイアウトを反映して、芝、ダートともに“差し、追い込み馬が水準以上に活躍”していることも見逃せない。","そんな背景もあり、7月開催の芝コースはどうしても馬場の傷みが進行しやすく、これと歩調をあわせてパワータイプの馬が目立つようになる。ただでさえ、タフな設定のコースのこと。走破時計のかかり具合、好走した馬のコース取りなどを手掛かりに、馬場コンディションの“変化”には目を光らせておこう。"],"src":"https://www.jra.go.jp/facilities/race/chukyo/course/index.html","turf":{"len":1705.9,"straight":[412.5,412.5],"height":[3.5,3.5],"width":[27,30],"dists":[1200,1300,1400,1600,2000,2200,3000],"races":1071,"fav":0.318,"front":0.469,"back":0.204,"gateEdge":0.071,"heavy":0.183,"e3Med":23450,"man":0.202,"agari":34.5,"rank":{"straight":4,"height":4,"front":8,"back":3,"fav":5,"e3Med":7,"gateEdge":1},"summary":["芝は差し・追込が届く（勝ち馬の4角が後ろ半分 20%）","芝は内枠有利（1-2枠と7-8枠の3着内率の差 7.1pt）"]},"dirt":{"len":1530,"straight":[410.7,410.7],"height":[3.4,3.4],"width":[25,25],"dists":[1200,1400,1800,1900,2500],"races":1312,"fav":0.337,"front":0.629,"back":0.146,"gateEdge":-0.016,"heavy":0.303,"e3Med":28730,"man":0.211,"agari":37.4,"rank":{"straight":2,"height":3,"front":9,"back":2,"fav":7,"e3Med":4,"gateEdge":4},"summary":["ダートの直線が長い（410.7m、10場で 2位）","ダートの高低差が大きい（3.4m）","ダートは差し・追込が届く（勝ち馬の4角が後ろ半分 15%）"]}},{"name":"京都","code":"08","turn":"右","notes":["京都競馬場の芝コースは、阪神や中山と同様、内回りと外回りから成る。この2つのコースは3コーナーで分岐し、4コーナーで合流するレイアウト。一方で2コーナーの奥にはバックストレッチに連なる長い引き込み線が設けられており、外回りの芝1600メートルと芝1800メートル、内回りの芝1600メートルは、向正面左手の奥深い地点からスタートを切ることになる。","そんな京都競馬場の“名物”といえるのが3コーナーの坂だ。外回りコースの場合、コースの高低差は4.3メートル（内回りコースは3.1メートル）にも及び、向正面の半ばから3コーナーにかけて上り、4コーナーにかけて一気に下るレイアウト。勾配がつけられているのは3コーナー付近だけ、それ以外はほぼ平坦という起伏の構成も非常にユニークで、要は「3コーナーに小高い丘が設けられている競馬場」とイメージすれば分かりやすいだろう。","かつては「ゆっくり上り、ゆっくり下るのが鉄則」とされたこの坂だが、近年は坂の下りで惰性をつけて平坦な直線に向く戦法がすっかり浸透。坂の頂上付近にあたる残り800メートル地点からペースが上がるレースが多い。ただし3000メートル級の長距離戦では、自然に勢いがついてしまう1周目の坂の下り→スタンドからの大歓声を浴びるホームストレッチと続く場面で、折り合いを乱さずスタミナを温存できるかが重要なポイントとなる。","さて、1周距離（外回り1894.3メートル、内回り1782.8メートル。芝コースの距離についてはAコースの数値を用いる）、直線の長さ（外回り403.7メートル、内回り328.4メートル）とも、外回りよりコンパクトな造りの内回りでは、やはり逃げ、先行タイプが優勢。3、4コーナーのカーブもタイトなため、小回りを苦にせず器用に立ち回れるタイプが有利となる。"],"src":"https://www.jra.go.jp/facilities/race/kyoto/course/index.html","turf":{"len":1782.8,"straight":[323.4,403.7],"height":[3.1,4.3],"width":[29,38],"dists":[1100,1200,1400,1600,1800,2000,2200,2400,3000,3200],"races":848,"fav":0.327,"front":0.519,"back":0.191,"gateEdge":-0.012,"heavy":0.151,"e3Med":22320,"man":0.206,"agari":34.4,"rank":{"straight":5,"height":2,"front":6,"back":5,"fav":4,"e3Med":8,"gateEdge":8},"summary":["芝の高低差が大きい（4.3m）"]},"dirt":{"len":1607.6,"straight":[329.1,329.1],"height":[3,3],"width":[25,25],"dists":[1000,1100,1200,1400,1800,1900,2600],"races":975,"fav":0.346,"front":0.646,"back":0.114,"gateEdge":-0.028,"heavy":0.206,"e3Med":23990,"man":0.206,"agari":37.3,"rank":{"straight":5,"height":4,"front":8,"back":3,"fav":6,"e3Med":8,"gateEdge":5},"summary":["ダートは差し・追込が届く（勝ち馬の4角が後ろ半分 11%）"]}},{"name":"阪神","code":"09","turn":"右","notes":["昭和の時代は「オムスビ型の競馬場」として親しまれていた阪神競馬場だが、平成に入って装いを一新。「従来の3、4コーナーの外側に、外回りコースを新設」という大規模な改修をへて、日本屈指のスケールを誇る競馬場に生まれ変わった。内回りコースの1周距離は1689メートル（芝コースの距離についてはAコースの数値を用いる）と標準的なサイズながら、新設された外回りコースの1周距離は実に2089メートル。右回りの競馬場の中では日本最長で、東京競馬場（2083.1メートル）をも上回る。","そんな外回りコースの特徴はバックストレッチが非常に長く、3、4コーナーのカーブもゆったりしていること。内回りコースと分岐した後もしばらくまっすぐ走り、広々とした3、4コーナーを回って直線に向く。ちなみに内回りの芝1200メートルと外回りの芝1600メートルは発走地点が同じ、また、2コーナー付近に発走地点が設けられている東京の芝1600メートルに対し、阪神の芝1600メートルは向正面半ばからスタートを切る。これらを重ね合わせれば、バックストレッチの長さと3、4コーナーの大きさをイメージしていただけるはずだ。","さらに外回りコースの直線は473.6メートルと右回り最長（新潟、東京に次いで全場3位）。ゴール前には急坂も設けられている。サイズは標準的で決して小さいわけではない内回りコース（直線の長さは356.5メートル）だが、外回りはより“紛れ”が生じにくい、馬の実力がストレートに反映されるコースといえるだろう。","ただし幅員はそれほど広くなく、コースの設定はA、Bのみ。4つのコース（A、B、C、D）を使い分けられる京都に比べると、馬場の傷みは進行しやすい。梅雨と重なる6月の開催は特に、タフなコンディションになりやすいことは頭に入れておこう。"],"src":"https://www.jra.go.jp/facilities/race/hanshin/course/index.html","turf":{"len":1689,"straight":[356.5,476.3],"height":[1.9,2.4],"width":[25,29],"dists":[1200,1400,1600,1800,2000,2200,2400,2600,3000,3200],"races":1239,"fav":0.341,"front":0.456,"back":0.232,"gateEdge":0.058,"heavy":0.185,"e3Med":18880,"man":0.177,"agari":34.3,"rank":{"straight":3,"height":7,"front":9,"back":2,"fav":3,"e3Med":9,"gateEdge":3},"summary":["芝の直線が長い（476.3m、10場で 3位）","芝は差し・追込が届く（勝ち馬の4角が後ろ半分 23%）"]},"dirt":{"len":1517.6,"straight":[352.7,352.7],"height":[1.6,1.6],"width":[25,25],"dists":[1200,1400,1800,2000,2600],"races":1569,"fav":0.349,"front":0.649,"back":0.104,"gateEdge":-0.044,"heavy":0.293,"e3Med":22870,"man":0.194,"agari":37.4,"rank":{"straight":4,"height":8,"front":7,"back":4,"fav":5,"e3Med":9,"gateEdge":7},"summary":[]}},{"name":"小倉","code":"10","turn":"右","notes":["1615.1メートルという芝コースの1周距離（芝コースの距離についてはAコースの数値を用いる）は、福島競馬場に次ぐ小ささ。標準的な長さと言える直線（293メートル）に坂は設けられていない。小倉競馬場は「平坦、小回り」を地でいく、いかにもローカル場らしい競馬場と言える。そんな小倉には2つの特徴を指摘できる。ひとつは2コーナーに小高い丘が設けられていること。先に「平坦」と書いたけれど、それはあくまでも最後の直線に限った話で、芝コースの高低差は3メートルに及ぶ。競馬場全体がフラットな造りになっているわけではないのだ。","芝コースの起伏構成について詳細に見ていくと、ゴールラインから2コーナーにかけて緩やかな上りが続き、ここで上ったぶんを2コーナーから向正面、さらに3コーナーから4コーナーにかけて下るレイアウト（3コーナー手前にはわずかな上り勾配がつけられている）。その3、4コーナーにはスパイラルカーブが導入されており、直線は平たん。2コーナー奥のポケット地点からスタートした後、ゴールまで上り勾配を走る局面がほとんどない芝1200メートルでは特に“スピードの絶対値”が問われる。","実際、芝のレースでは逃げ、先行タイプが明らかに優勢を誇り、極端な追い込みはあまり決まっていない。ただし中長距離戦では2コーナーでペースが緩みがちなこと、そのためもあってか、まくった馬の活躍が水準以上に目立つことも頭に入れておきたい。","一方のダートコースは1周距離が1445.4メートル、直線の長さは291.3メートルで、福島（1周距離1444.6メートル、直線295.7メートル）とほぼ同じサイズ。全体の高低差は2.9メートル、2コーナーの丘から4コーナーにかけて下り、残り400メートル地点から直線にかけて緩やかな上り勾配（高低差0.6メートル）が続く。このように起伏の構成は微妙に異なるものの、芝コースと同様、極端な追い込みはあまり決まっていない。サイズから浮かぶイメージ通り、逃げ、先行タイプが優勢、差し馬なら中団程度にはつけられる馬を狙いたい。"],"src":"https://www.jra.go.jp/facilities/race/kokura/course/index.html","turf":{"len":1615.1,"straight":[293,293],"height":[3,3],"width":[24,30],"dists":[1000,1200,1700,1800,2000,2600],"races":990,"fav":0.312,"front":0.587,"back":0.13,"gateEdge":-0.014,"heavy":0.276,"e3Med":35060,"man":0.245,"agari":35.2,"rank":{"straight":8,"height":5,"front":5,"back":7,"fav":8,"e3Med":2,"gateEdge":9},"summary":["芝の直線が短い（293m）","芝は外枠の方が3着内に来ている（7-8枠が1-2枠より 1.4pt 上）","芝は荒れやすい（3連単の中央値 35,060円）"]},"dirt":{"len":1445.4,"straight":[291.3,291.3],"height":[2.9,2.9],"width":[24,24],"dists":[1000,1700,2400],"races":595,"fav":0.306,"front":0.768,"back":0.042,"gateEdge":0.027,"heavy":0.454,"e3Med":32350,"man":0.244,"agari":37.2,"rank":{"straight":8,"height":5,"front":2,"back":10,"fav":9,"e3Med":2,"gateEdge":1},"summary":["ダートの直線が短い（291.3m）","ダートは逃げ・先行が勝ちやすい（勝ち馬の4角が前1/4 77%）","ダートは内枠有利（1-2枠と7-8枠の3着内率の差 2.7pt）","ダートは1番人気が勝ちにくい（31%）","ダートは荒れやすい（3連単の中央値 32,350円）"]}}],"nankan":[{"key":"urawa","name":"浦和","code":"18","courses":[{"inout":null,"surface":"ダート","turn":"左回り","len":1200,"width":"16～21.5"}],"straight":220,"straights":[{"course":null,"full":300,"goal":220}],"height":"平坦","narIntro":"１周1200ｍの左回りコースです。小回りで、直線も220m短いため、タイトなレースが展開されます。騎手の仕掛けどこ     $('grid').innerHTML=xs.map(jCard).join('');
  }else{
    $('lead').innerHTML=`ばんえい競馬（帯広）は直線200mの1コースだけなので、馬場水分（含水率）の帯と馬番の得失が場の性格になる。数字は地方競馬情報サイトの成績から集計。`;
    $('grid').innerHTML=bnCard(NKHG.banei);
  }
  $('foot').innerHTML=`データ時点 ${NKHG.built?new Date(NKHG.built).toLocaleString('ja-JP',{hour12:false}):''}。コースの形と紹介文は各主催者の公式ページ、特徴は成績の実測から。`;
}
render();
</script>
</body>
</html>
