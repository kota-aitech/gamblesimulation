<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>南関東競馬 出馬表（馬柱）— 大井・川崎・船橋・浦和</title>
<style>
:root{
  --paper:#fbf8f1; --paper2:#f1ebdc; --band:#1a1512;
  --ink:#14100c; --sub:#6a6055; --faint:#9a9083;
  --rule:#2a2420; --rule2:#cfc6b4; --rule3:#e6dfd0;
  --red:#c0102a; --blue:#1b4f9c; --green:#1d6b3f;
  --mincho:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP","Times New Roman",serif;
  --gothic:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--gothic);
  font-size:13px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--red);outline-offset:2px}

/* ---- 題字・ナビ ---- */
.masthead{background:var(--band);color:#fdf9f0;padding:5px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.masthead .logo{font-family:var(--mincho);font-size:19px;font-weight:700;letter-spacing:.14em;line-height:1.1}
.masthead .logo em{font-style:normal;color:#f0c24a}
.masthead .tag{font-size:11px;color:#c8bfae;letter-spacing:.04em}
.masthead nav{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.masthead nav a{color:#fdf9f0;text-decoration:none;border:1px solid #4a423a;border-radius:2px;padding:2px 9px;font-size:11px;white-space:nowrap}
.masthead nav a:hover{background:#2e2721}
.jo{display:flex;gap:0;border:1px solid #4a423a}
.jo button{background:transparent;color:#c8bfae;border:0;border-right:1px solid #4a423a;padding:3px 13px;font-size:12px;font-family:var(--mincho);font-weight:700}
.jo button:last-child{border-right:0}
.jo button.on{background:#f0c24a;color:#1a1512}

/* ---- 開催日・R ---- */
.pick{background:var(--paper2);border-bottom:2px solid var(--rule);padding:5px 12px}
.days{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.days button{background:transparent;border:1px solid var(--rule2);border-radius:2px;padding:3px 12px;font-size:12px;color:var(--sub)}
.days button.on{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:700}
.rs{display:flex;gap:3px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.rs button{flex:0 0 auto;min-width:52px;padding:3px 5px;border:1px solid var(--rule2);background:#fff;border-radius:2px;
  font-size:12px;line-height:1.2;text-align:center;color:var(--sub)}
.rs button b{display:block;font-size:13px;color:var(--ink);font-family:var(--mincho)}
.rs button small{display:block;font-size:9px;color:var(--faint)}
.rs button.on{border-color:var(--red);border-width:2px;background:#fff6f2}
.rs button.on b{color:var(--red)}
.rs button.done{opacity:.5}

/* ---- レース見出し ---- */
.rhead{padding:6px 12px 4px;border-bottom:1px solid var(--rule2)}
.rhead .n{display:inline-block;background:var(--red);color:#fff;font-family:var(--mincho);font-weight:700;
  font-size:16px;padding:1px 10px;margin-right:8px;vertical-align:2px}
.rhead .t{font-family:var(--mincho);font-size:19px;font-weight:700;letter-spacing:.02em}
.rhead .m{color:var(--sub);font-size:12px;margin-top:2px}
.rhead .m b{color:var(--ink)}
.honshi{margin-top:4px;padding:4px 9px;background:var(--paper2);border-left:4px solid var(--red);font-size:13px}
.honshi span{margin-right:12px;white-space:nowrap}
.honshi i{font-style:normal;font-weight:700;font-size:14px;margin-right:2px}

/* ---- 表示切替 ---- */
.opts{display:flex;gap:6px;align-items:center;padding:5px 12px;border-bottom:2px solid var(--rule);flex-wrap:wrap}
.opts button{background:#fff;border:1px solid var(--rule2);border-radius:2px;padding:3px 11px;font-size:12px;color:var(--sub)}
.opts button.on{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:700}
.opts .sp{margin-left:auto;color:var(--faint);font-size:11px}

/* ---- 馬柱 ---- */
#board{overflow-x:auto;-webkit-overflow-scrolling:touch}
.thead,.uma{display:grid;grid-template-columns:30px 46px minmax(230px,1.1fr) 124px minmax(720px,1.5fr);align-items:stretch}
.m-top{display:contents}
.thead{background:var(--band);color:#efe7d8;font-size:10.5px;letter-spacing:.08em}
.thead>div{padding:3px 6px;border-right:1px solid #453d34}
.thead .runsH{display:grid;grid-template-columns:repeat(5,1fr);border-right:0}
.thead .runsH span{padding:0 6px;border-right:1px solid #453d34}
.thead .runsH span:last-child{border-right:0}
.uma{border-bottom:1px solid var(--rule);background:var(--paper)}
.uma:nth-child(even){background:#f7f2e6}
.uma.scr{opacity:.42}
.uma>div{border-right:1px solid var(--rule3);padding:6px 6px}
.uma>div:last-child{border-right:0}

.c-mark{display:flex;align-items:flex-start;justify-content:center;padding-top:8px!important}
.mk{font-family:var(--mincho);font-size:19px;font-weight:700;line-height:1}
.mk.m1{color:var(--red)}.mk.m2{color:var(--blue)}.mk.m3{color:var(--ink)}.mk.m4{color:var(--sub);font-size:16px}

.c-no{text-align:center}
.waku{display:block;width:26px;height:22px;margin:1px auto 3px;border:1px solid var(--rule);line-height:20px;
  font-weight:700;font-size:13px;font-family:var(--gothic)}
.uno{display:block;font-family:var(--mincho);font-size:17px;font-weight:700;line-height:1.1}

.c-prof{min-width:0}
.p-sire,.p-dam{font-size:10.5px;color:var(--sub);line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-name{font-family:var(--mincho);font-size:17px;font-weight:700;line-height:1.22;letter-spacing:.01em;margin:1px 0}
.p-name .sex{font-family:var(--gothic);font-size:11px;font-weight:400;color:var(--sub);margin-left:6px;letter-spacing:0}
.p-name .kg{font-family:var(--gothic);font-size:12px;font-weight:700;color:var(--ink);margin-left:4px}
.p-line{font-size:11.5px;line-height:1.45;margin-top:2px}
.p-line b{font-weight:700}
.p-line .kis{font-size:13px;font-weight:700;font-family:var(--mincho)}
.p-line .lbl{color:var(--faint);font-size:10px;margin-right:2px}
.p-owner{font-size:10.5px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tagstyle{display:inline-block;padding:0 6px;border:1px solid var(--rule);font-size:10.5px;font-weight:700;margin-right:5px;vertical-align:1px}

.c-idx{font-size:11px}
.pct{font-family:var(--mincho);font-size:19px;font-weight:700;line-height:1;color:var(--red)}
.pct.zero{color:var(--faint)}
.pct small{font-size:10px;font-family:var(--gothic);color:var(--sub);font-weight:400;margin-left:2px}
.sub2{color:var(--sub);font-size:10.5px;margin:2px 0 4px}
.chips{display:flex;flex-wrap:wrap;gap:2px 4px}
.chip{font-size:10px;border:1px solid var(--rule2);background:#fff;padding:0 4px;white-space:nowrap}
.chip b{font-weight:700}
.chip.up{border-color:var(--red);color:var(--red)}
.chip.dn{border-color:var(--blue);color:var(--blue)}

.c-runs{padding:0!important;border-right:0!important}
.runs{display:grid;grid-template-columns:repeat(5,1fr);height:100%}
.run{border-right:1px solid var(--rule3);padding:5px 6px;font-size:10.5px;line-height:1.4;min-width:0}
.run:last-child{border-right:0}
.run.none{color:var(--faint);display:flex;align-items:center;justify-content:center}
.run .r1{display:flex;align-items:baseline;gap:5px}
.run .ord{font-family:var(--mincho);font-size:20px;font-weight:700;line-height:1;min-width:20px;text-align:right}
.run .ord.w{color:var(--red)}.run .ord.p{color:var(--blue)}
.run .plc{font-size:9px;color:var(--sub);margin-left:-3px}
.run .wh{color:var(--sub);font-size:10px}
.run .nm{font-family:var(--mincho);font-size:11.5px;font-weight:700;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.run .cor{letter-spacing:.06em;font-weight:700}
.run .pop1{color:var(--red);font-weight:700}
.run em{font-style:normal;color:var(--red);font-weight:700;margin-left:1px}

/* ---- 寸評 ---- */
.memo{grid-column:1/-1;border-top:1px dotted var(--rule2);padding:5px 8px 6px;font-size:11.5px;
  color:var(--ink);background:#fffdf7;display:grid;grid-template-columns:auto 1fr;gap:1px 7px;align-items:baseline}
.memo .k{font-size:10px;font-weight:700;letter-spacing:.04em;color:var(--paper);background:var(--band);
  padding:1px 5px;text-align:center;white-space:nowrap;align-self:start;margin-top:1px}
.memo .v{color:var(--ink);line-height:1.5}
.memo .v b{color:var(--ink)}

/* ================= 縦型（競馬新聞の組み方）=================
   1頭＝1本の柱。柱を右から左に並べるのが新聞の作法だが、
   web は左→右のほうが読み違えが少ないので左から並べる。
   馬名は縦書き（writing-mode）。前5走は柱の中に上から積む。        */
#board.tate{overflow-x:auto;-webkit-overflow-scrolling:touch;padding:0 0 6px}
/* 幅は JS で決める（下の fitPillars）。
   justify-content:flex-end を使うと、あふれた分が左に出てスクロールで拾えなくなる。
   常に左詰め＋width:max-content にしておき、収まるときだけ柱を広げて画面を埋める。 */
.tate .pillars{display:flex;gap:0;align-items:stretch;width:max-content}
.tate .pil{flex:0 0 var(--pw,118px);border-right:1px solid var(--rule);background:var(--paper);
  display:flex;flex-direction:column;min-width:0}
.tate .pil:last-child{border-left:1px solid var(--rule)}
.tate .pil:nth-child(even){background:#f7f2e6}
.tate .pil.scr{opacity:.42}
.tate .p-head{border-bottom:1px solid var(--rule);padding:3px 4px 4px;text-align:center}
.tate .p-mk{font-family:var(--mincho);font-size:19px;font-weight:700;line-height:1.1;min-height:22px}
.tate .p-waku{display:inline-block;width:24px;height:19px;line-height:17px;border:1px solid var(--rule);
  font-weight:700;font-size:12px;margin-right:3px;vertical-align:middle}
.tate .p-uno{font-family:var(--mincho);font-size:17px;font-weight:700;vertical-align:middle}
.tate .p-sire{font-size:9.5px;color:var(--sub);line-height:1.25;min-height:2.4em;overflow:hidden;padding:1px 3px 0;text-align:center}
.tate .p-namebox{display:flex;justify-content:center;padding:2px 0 3px;border-bottom:1px dotted var(--rule2)}
.tate .p-namebox{height:150px;align-items:flex-start}
.tate .p-name{writing-mode:vertical-rl;text-orientation:upright;font-family:var(--mincho);
  font-weight:700;letter-spacing:.04em;line-height:1.04;white-space:nowrap;
  font-size:17px}
.tate .p-name.l9{font-size:15px;letter-spacing:.01em}
.tate .p-name.l11{font-size:13px;letter-spacing:0}
.tate .p-name.l13{font-size:11.5px;letter-spacing:-.02em;line-height:1}
.tate .p-sub{font-size:10px;color:var(--sub);text-align:center;padding:2px 3px;line-height:1.35}
.tate .p-kis{font-family:var(--mincho);font-size:13px;font-weight:700;color:var(--ink)}
.tate .p-style{display:inline-block;padding:0 4px;border:1px solid var(--rule);font-size:10px;font-weight:700}
.tate .p-idx{border-top:1px solid var(--rule2);padding:3px;text-align:center}
.tate .p-pct{font-family:var(--mincho);font-size:17px;font-weight:700;color:var(--red);line-height:1.1}
.tate .p-pct small{font-size:9px;font-family:var(--gothic);color:var(--sub);font-weight:400}
.tate .p-chips{display:flex;flex-wrap:wrap;gap:1px 2px;justify-content:center;padding:0 2px 3px}
.tate .p-chips .chip{font-size:9px;padding:0 3px}
.tate .p-runs{border-top:1px solid var(--rule);flex:1}
.tate .p-run{border-bottom:1px dotted var(--rule2);padding:3px 4px;font-size:9.5px;line-height:1.35}
.tate .p-run:last-child{border-bottom:0}
.tate .p-run .o{font-family:var(--mincho);font-size:15px;font-weight:700;margin-right:2px}
.tate .p-run .o.w{color:var(--red)}.tate .p-run .o.p{color:var(--blue)}
.tate .p-run .c{letter-spacing:.04em;font-weight:700}
.tate .p-run.none{color:var(--faint);text-align:center;padding:8px 0}
.tate .p-memo{border-top:1px solid var(--rule2);padding:3px 4px;font-size:10px;color:var(--ink);line-height:1.4;text-align:center}
body.no-runs .tate .p-runs{display:none}
body.no-idx .tate .p-idx,body.no-idx .tate .p-chips{display:none}
body.no-memo .tate .p-memo{display:none}

/* ---- 展開予想 ---- */
.tenkai{margin:5px 12px 0;border:1px solid var(--rule2);background:#fff}
.tenkai__h{display:flex;align-items:center;gap:8px;padding:4px 9px;background:var(--paper2);border-bottom:1px solid var(--rule2);font-size:11px;color:var(--sub)}
.tenkai__h b{font-family:var(--mincho);font-size:13px;color:var(--ink)}
.tenkai__h .pace{display:inline-block;padding:0 7px;font-weight:700;color:#fff;font-size:11px}
.tenkai__b{display:flex;align-items:stretch;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tk-grp{flex:1 1 0;min-width:118px;padding:4px 8px 5px;border-right:1px dotted var(--rule2)}
.tk-grp:last-child{border-right:0}
.tk-grp .lab{font-size:10px;color:var(--faint);letter-spacing:.06em;margin-bottom:3px;white-space:nowrap}
.tk-grp .lab i{font-style:normal;font-weight:700;color:var(--ink);font-family:var(--mincho);font-size:12px;margin-right:4px}
.tk-nos{display:flex;flex-wrap:wrap;gap:4px 5px}
.tk-cell{display:flex;flex-direction:column;align-items:center;line-height:1}
.tk-cell .m{height:12px;font-family:var(--mincho);font-size:11px;font-weight:700;color:var(--sub)}
.tk-cell .m.m1{color:var(--red)}.tk-cell .m.m2{color:var(--blue)}
.tk-no{display:inline-block;min-width:22px;height:20px;line-height:18px;text-align:center;
  border:1px solid var(--rule);font-weight:700;font-size:12px}
.tenkai .note{padding:3px 9px 6px;font-size:10.5px;color:var(--sub);border-top:1px dotted var(--rule2)}
@media (max-width:840px){ .tenkai{margin:6px 10px 0} .tk-grp{min-width:104px} }

/* ---- AIのおすすめ（買い目・期待値・自信度）---- */
.aibox{margin:5px 12px 6px;border:1px solid var(--rule2);background:#fffdf7}
.aibox__h{display:flex;align-items:center;gap:8px;padding:5px 9px;background:var(--paper2);border-bottom:1px solid var(--rule2)}
.aibox__h .g{display:inline-block;min-width:24px;text-align:center;font-family:var(--mincho);font-weight:700;
  font-size:15px;padding:0 5px;color:#fff;background:var(--faint)}
.aibox__h .g.gS{background:var(--red)}.aibox__h .g.gA{background:#d99a2b}
.aibox__h .g.gB{background:var(--blue)}.aibox__h .g.gC{background:#8b8578}
.aibox__h .t{font-family:var(--mincho);font-weight:700}
.aibox__h .n{margin-left:auto;font-size:11px;color:var(--sub)}
.aibox__b{padding:5px 9px 7px;font-size:12px}
.aibox .row2{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:4px}
.aibox .row2 span{color:var(--faint);font-size:11px}
.aibox .row2 b{color:var(--ink);font-size:13px}
.aibox .meter{display:inline-block;width:64px;height:6px;background:var(--rule3);vertical-align:middle;margin-left:5px;overflow:hidden}
.aibox .meter i{display:block;height:100%;background:var(--red)}
.aibox .lbl{font-size:10.5px;color:var(--faint);margin:4px 0 2px}
.aibox .bet{display:inline-block;border:1px solid var(--rule2);background:#fff;padding:1px 6px;margin:0 4px 3px 0;font-size:11.5px}
.aibox .bet b{font-family:var(--mincho);font-size:12.5px}
.aibox .bet i{font-style:normal;color:var(--red);font-weight:700;margin-left:4px}
.aibox .bet .o{color:var(--sub);margin-left:3px;font-size:10.5px}
.aibox .note{color:var(--sub);font-size:10.5px;margin-top:5px;line-height:1.6}
.aibox .rec{margin-left:8px;font-size:10px;color:var(--sub);font-weight:400}
.aibox .boxline{font-size:12.5px;margin:1px 0 5px}
.aibox .boxline b{font-family:var(--mincho);font-size:14px}
.aibox .boxline .o{color:var(--sub);font-size:11px;margin-left:6px}

/* ---- 脚注 ---- */
footer{border-top:2px solid var(--rule);background:var(--paper2);padding:10px 12px 26px;color:var(--sub);font-size:11px;line-height:1.6}
footer b{color:var(--ink)}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px;font-size:11px}
.legend span{white-space:nowrap}

/* ---- 非表示切替 ---- */
body.no-runs .c-runs,body.no-runs .runsH{display:none}
body.no-runs .thead,body.no-runs .uma{grid-template-columns:30px 46px minmax(230px,1fr) 124px}
body.no-idx .c-idx,body.no-idx .idxH{display:none}
body.no-idx .thead,body.no-idx .uma{grid-template-columns:30px 46px minmax(230px,1fr) minmax(720px,1.5fr)}
body.no-idx.no-runs .thead,body.no-idx.no-runs .uma{grid-template-columns:30px 46px 1fr}
body.no-memo .memo{display:none}

/* ================= スマホ ================= */
@media (max-width:840px){
  .masthead{padding:6px 10px;gap:8px}
  .masthead .logo{font-size:16px}
  .masthead .tag{display:none}
  .masthead nav a{padding:2px 7px}
  .rhead{padding:8px 10px 5px}
  .rhead .t{font-size:16px}
  .opts{padding:6px 10px}
  #board{overflow-x:visible}
  .thead{display:none}
  .uma{display:block;border-bottom:2px solid var(--rule);padding:7px 10px 0;background:var(--paper)!important}
  .uma>div{border-right:0;padding:0}
  .uma.scr{background:#f2eee4!important}
  .m-top{display:grid;grid-template-columns:26px 34px minmax(0,1fr);gap:0 8px;align-items:start}
  .c-mark{padding:0!important;justify-content:center;grid-column:1}
  .mk{font-size:20px}
  .c-no{grid-column:2}
  .waku{width:26px;height:20px;line-height:18px;margin:0 auto 2px}
  .uno{font-size:15px}
  .c-prof{grid-column:3;min-width:0}
  .c-prof .p-name{font-size:17px;white-space:normal}
  /* 指数は次の行に全幅で置く。上の段に混ぜると馬名が潰れて縦書きになる */
  .c-idx{grid-column:1/-1;display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 10px;
    margin-top:6px;padding-top:5px!important;border-top:1px dotted var(--rule2)}
  .pct{font-size:18px}
  .c-idx .sub2{margin:0}
  .c-idx .chips{flex:1 1 100%;justify-content:flex-start;margin-top:2px}
  .c-runs{margin:6px -10px 0!important;padding:0!important}
  .runs{display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;scroll-snap-type:x mandatory;
    border-top:1px solid var(--rule3);background:#fffdf7}
  .run{flex:0 0 172px;scroll-snap-align:start;border-right:1px solid var(--rule3);padding:6px 8px}
  .run:first-child{padding-left:10px}
  .memo{margin:0 -10px;padding:4px 10px 6px}
  body.no-runs .uma,body.no-idx .uma,body.no-idx.no-runs .uma{display:block}
  .swipe{font-size:10px;color:var(--faint);padding:2px 10px 0}
  .tate .pil{flex:0 0 var(--pw,104px)}
  .tate .p-namebox{height:140px}
  .tate .p-name{font-size:16px}
  .tate .p-name.l9{font-size:14px}
  .tate .p-name.l11{font-size:12px}
  .tate .p-name.l13{font-size:10.5px}
  .aibox{margin:8px 10px 0}
}
@media (max-width:400px){
  .m-top{grid-template-columns:24px 28px 1fr auto;gap:5px}
  .c-prof .p-name{font-size:16px}
  .run{flex-basis:158px}
}
@media print{

const WAKU=[['#fff','#14100c'],['#ffffff','#14100c'],['#1b1b1b','#ffffff'],['#d0202f','#ffffff'],['#2f5fc0','#ffffff'],
            ['#f2d33c','#14100c'],['#2e8b4f','#ffffff'],['#e8802a','#ffffff'],['#ef9bb8','#14100c']];
const STY={'逃げ':'#c0102a','先行':'#c9761a','差し':'#1b4f9c','追込':'#5b3a8e'};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* オッズを取った時刻と、それが何分前か（古さの目安。ボートと同じ） */
const oddsAgo=r=>{if(!r.oddsAt)return r.oddsUpd?`（${esc(r.oddsUpd)} 時点）`:'';const t=new Date(r.oddsAt);if(isNaN(t))return '';const m=Math.round((Date.now()-t)/60000);const hm=t.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});return `（取得 ${hm}・<b style="${m>=30?'color:var(--red)':''}">${m<1?'いま':m<60?m+'分前':Math.floor(m/60)+'時間'+(m%60)+'分前'}</b>）`;};
const sgn=(v,d=2)=>v==null?'—':(v>0?'+':'')+v.toFixed(d);
const MARKC={'◎':'m1','○':'m2','▲':'m3','△':'m4','☆':'m4'};
const MARU='①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳';
const maru=n=>(n>=1&&n<=20)?MARU[n-1]:`(${n})`;
/* 縦組みの馬名は長さで字を詰めて、必ず柱に収める */
const nameCls=n=>{const L=[...String(n||'')].length;return L>=13?'l13':L>=11?'l11':L>=9?'l9':'';};

const TKEY=(()=>{const k=new URLSearchParams(location.search).get('track')||'oi';return NKR[k]&&NKR[k].days?k:(Object.keys(NKR).find(x=>NKR[x]&&NKR[x].days)||'oi');})();
const D=NKR[TKEY]||{days:{},entries:{}};
let day=Object.keys(D.days)[0]||'',ridx=0;
/* top.html から ?day=…&r=… で直接開けるようにする */
(()=>{const q=new URLSearchParams(location.search);
  const d=q.get('day'),r=q.get('r');
  if(d&&D.days[d])day=d;
  if(r){const i=(D.days[day]||[]).findIndex(x=>String(x.r)===String(r));if(i>=0)ridx=i;}})();
const show={runs:true,idx:true,memo:true};

$('jo').innerHTML=Object.keys(NKR).filter(k=>NKR[k]&&NKR[k].days)
  .map(k=>`<button data-k="${k}" class="${k===TKEY?'on':''}">${NKR[k].track}</button>`).join('');
document.querySelectorAll('#jo button').forEach(b=>b.onclick=()=>{if(b.dataset.k!==TKEY)location.search='?track='+b.dataset.k;});
document.querySelectorAll('.opts button').forEach(b=>b.onclick=()=>{
  const k=b.dataset.k;show[k]=!show[k];b.classList.toggle('on',show[k]);
  document.body.className=Object.keys(show).filter(x=>!show[x]).map(x=>'no-'+x).join(' ');});

function pickBar(){
  $('days').innerHTML=Object.keys(D.days).map(k=>`<button data-k="${esc(k)}" class="${k===day?'on':''}">${esc(k)}</button>`).join('');
  document.querySelectorAll('#days button').forEach(b=>b.onclick=()=>{day=b.dataset.k;ridx=0;render();});
  $('rs').innerHTML=(D.days[day]||[]).map((r,i)=>`<button data-i="${i}" class="${i===ridx?'on':''} ${isPast(r)?'done':''}" title="${esc(r.cls)}${isPast(r)?'（発走済み）':''}">
    <b>${r.r}R</b><small>${isPast(r)?'発走済み':`${r.dist}m ${r.n}頭`}</small></button>`).join('');
  document.querySelectorAll('#rs button').forEach(b=>b.onclick=()=>{ridx=+b.dataset.i;render();
    document.getElementById('rhead').scrollIntoView({block:'start',behavior:'smooth'});});
}

/* 展開予想。シミュレータが出した3角の平均位置で並べ、4つの集団に分ける。
   競馬新聞の「予想隊列」と同じ読み方ができるようにする。               */
function tenkai(r,hs){
  const live=hs.filter(h=>!h.scratch&&h.c3!=null);
  if(live.length<4){$('tenkai').innerHTML='';return;}
  const sorted=live.slice().sort((a,b)=>a.c3-b.c3);
  const n=sorted.length;
  /* 逃げ＝3角2番手以内、以降は頭数を3等分して 先行／中団／後方 */
  const nige=sorted.filter(h=>h.c3<=2.5);
  const rest=sorted.filter(h=>h.c3>2.5);
  const cut=Math.ceil(rest.length/3);
  const grp=[
    ['逃げ','ハナ',nige],
    ['先行','前々',rest.slice(0,cut)],
    ['中団','中',rest.slice(cut,cut*2)],
    ['後方','後ろ',rest.slice(cut*2)],
  ].filter(g=>g[2].length);
  const PC={H:['ハイ','#c0102a'],M:['平均','#c9761a'],S:['スロー','#1b4f9c']}[r.pace]||['—','#8b8578'];
  const cell=h=>{const w=WAKU[h.gate]||WAKU[0];
    return `<span class="tk-cell" title="${esc(h.name)}／3角${h.c3.toFixed(1)}番手">
      <span class="m ${MARKC[h.mark]||''}">${h.mark||''}</span>
      <span class="tk-no" style="background:${w[0]};color:${w[1]}">${h.no}</span></span>`;};
  const nN=live.filter(h=>h.style==='逃げ').length;
  $('tenkai').innerHTML=`<div class="tenkai">
    <div class="tenkai__h"><b>展開予想</b>
      <span>想定ペース</span><span class="pace" style="background:${PC[1]}">${PC[0]}</span>
      <span>逃げ${nN}頭・先行${live.filter(h=>h.style==='先行').length}頭</span></div>
    <div class="tenkai__b">${grp.map(([g,sub,list])=>`<div class="tk-grp">
      <div class="lab"><i>${g}</i>${sub}</div>
      <div class="tk-nos">${list.map(cell).join('')}</div></div>`).join('')}</div>
    <div class="note">3角での位置取りをシミュレータで${(NKR.meta&&NKR.meta.marks&&NKR.meta.marks.trials)||600}回試行した平均。左ほど前。
      ${nN===0?'明確な逃げ馬がおらず、誰が行くかで結果が変わりやすい。':nN>=3?'逃げ候補が3頭以上。前が競り合うと差しが届きやすい。':''}
      ${r.cond?`馬場 ${esc(r.cond.baba)}／前残り度 ${r.cond.front>0?'+':''}${r.cond.front}`:''}</div>
  </div>`;
}

/* AIのおすすめ（買い目・期待値・自信度）
   主役は「本命BOX」。過去230レースの実測で、期待値1.0超だけを買うやり方（0〜52%）より
   BOX（75〜112%）のほうが明確に良かったため。期待値は参考として併記する。 */
/* ---- 開催の結果（?view=results）。ボートの「節間の結果」と同じ：着順・払戻・締切時点の印・的中 ---- */
const RES=(NKR.results&&NKR.results[TKEY])||null;
let view=(new URLSearchParams(location.search).get('view')==='results'&&RES)?'results':'card';
let resMeet=null,resDay=null;
const wk=(no,gate)=>{const c=WAKU[gate]||WAKU[0];return `<span class="wk" style="background:${c[0]};color:${c[1]}">${no}</span>`;};
const finTxt=fin=>fin.length?fin.slice(0,3).map(([no,g])=>wk(no,g)).join('<span class="arw">→</span>'):'<span class="sub">結果待ち</span>';
const hitChip=(ok,label)=>`<span class="hit ${ok?'y':'n'}">${label}</span>`;
function renderResults(){
  const box=$('reslog');
  if(!RES||!RES.meets.length){box.innerHTML='<p style="padding:14px">この場の結果はまだありません。</p>';return;}
  if(resMeet==null)resMeet=RES.meets.length-1;
  const M=RES.meets[resMeet];
  if(resDay==null||!M.days[resDay]){const done=M.days.map((d,i)=>[d,i]).filter(([d])=>d.sum.races>0);resDay=done.length?done.at(-1)[1]:M.days.length-1;}
  const D=M.days[resDay],S=D.sum;
  const pct=(a,b)=>b?Math.round(a/b*100)+'%':'—';
  const roi=(ret,cost)=>cost?Math.round(ret/cost*100)+'%':'—';
  const meetTabs=RES.meets.length>1?`<div class="rtabs">${RES.meets.map((m,i)=>`<button data-m="${i}" class="${i===resMeet?'on':''}">${m.days[0].dk.replace(/ 第\d+日/,'')}〜 の開催（${m.days.length}日）</button>`).join('')}</div>`:'';
  const dayTabs=`<div class="rtabs">${M.days.map((d,i)=>`<button data-d="${i}" class="${i===resDay?'on':''}">${d.dk}<small>${d.sum.races}/${d.rows.length}R</small></button>`).join('')}</div>`;
  const sum=`<div class="rsum"><span><small>確定</small><b>${S.races}</b>/${D.rows.length}R</span><span><small>◎1着</small><b>${S.win}</b>/${S.races}（${pct(S.win,S.races)}）</span><span><small>上位3頭に勝ち馬</small><b>${S.top3}</b>/${S.races}</span>`+
    (S.b3?`<span><small>3頭BOX 馬連</small><b>${roi(S.b3.uRet,S.b3.uCost)}</b>（${S.b3.uHit}本）</span><span><small>3頭BOX 三連複</small><b>${roi(S.b3.sRet,S.b3.sCost)}</b>（${S.b3.sHit}本）</span>`:'')+
    (S.b4?`<span><small>4頭BOX 馬連</small><b>${roi(S.b4.uRet,S.b4.uCost)}</b>（${S.b4.uHit}本）</span><span><small>4頭BOX 三連複</small><b>${roi(S.b4.sRet,S.b4.sCost)}</b>（${S.b4.sHit}本）</span>`:'')+`</div>`;
  const rows=D.rows.map(x=>{const pend=x.fin.length<3;
    const [tanY,sanpY,santY,santPop]=x.pay;const hitWin=x.hit[0],hitTop3=x.hit[1];const b3=x.box[3]||[0,0],b4=x.box[4]||[0,0];
    const mk=x.marks.length?x.marks.slice(0,4).map(([no,g,m,w])=>`<span class="mk"><i class="${MARKC[m]||''}" style="color:${m==='◎'?'var(--red)':m==='○'?'var(--blue)':'inherit'}">${m}</i>${wk(no,g)}</span>`).join(' '):'<span class="sub">記録なし</span>';
    const p1=x.marks[0]?Math.round(x.marks[0][3]*100)+'%':'';
    return `<tr class="${hitWin?'hit1':''} ${pend?'pend':''}"><td><b>${x.r}R</b></td><td class="cls">${esc(x.cls||'')}<div class="sub">${x.dist}m・${x.n}頭${x.baba?'・'+esc(x.baba):''}</div></td><td>${finTxt(x.fin)}${x.also&&x.also.length?`<div class="sub">4着以下 ${x.also.join('-')}</div>`:''}</td>`+
      `<td class="r">${santY?`<b>${santY.toLocaleString()}円</b>${santPop?`<div class="sub">${santPop}番人気</div>`:''}`:''}${sanpY?`<div class="sub">三連複 ${sanpY.toLocaleString()}円</div>`:''}</td>`+
      `<td>${mk}${p1?`<div class="sub">◎の勝率 ${p1}${x.src?'・'+esc(x.src):''}</div>`:''}</td>`+
      `<td>${pend||!x.marks.length?'':hitChip(hitWin,'◎1着')+hitChip(hitTop3,'上位3頭')+hitChip(!!b3[0],'3頭馬連')+hitChip(!!b3[1],'3頭三連複')+hitChip(!!b4[1],'4頭三連複')}</td></tr>`;}).join('');
  box.innerHTML=`<div class="rhead"><div><span class="n">開催の結果</span><span class="t">${esc(D.dk)}</span></div><div class="m">${esc(RES.track)}　着順・払戻と、<b>締切時点の予想印</b>がどう当たったか（本命BOXは1点100円）</div></div>`+meetTabs+dayTabs+sum+
    `<div class="reswrap"><table class="res"><thead><tr><th>R</th><th>レース</th><th>着順（1→2→3）</th><th class="r">三連単</th><th>締切時点の印</th><th>的中</th></tr></thead><tbody>${rows}</tbody></table></div>`+
    `<p class="sub" style="padding:8px 14px;line-height:1.7">予想は締切時点のオッズ（「締切前」＝実運用、「最終」＝レース後の確定オッズで再現＝実戦より有利）で出したもの。的中の赤は当たり、灰は外れ。日別の合計は TOP の「日別の成績」と同じ買い方。</p>`;
  box.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{resMeet=+b.dataset.m;resDay=null;renderResults();});
  box.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{resDay=+b.dataset.d;renderResults();});
}
function setView(v){
  view=v;document.querySelectorAll('#view button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  const card=v==='card';
  for(const id of ['days','rs','rhead','tenkai','ai','board'])$(id).hidden=!card;
  document.querySelector('.opts').hidden=!card;
  $('reslog').hidden=card;
  try{const q=new URLSearchParams(location.search);if(card)q.delete('view');else q.set('view','results');history.replaceState(null,'','?'+q.toString());}catch(e){}
  if(!card)renderResults();
}
document.querySelectorAll('#view button').forEach(b=>b.onclick=()=>setView(b.dataset.v));
const REC=(NKR.record)||null;
function recRoi(kind){
  if(!REC)return null;
  let cost=0,ret=0,races=0,hits=0;
  for(const s of Object.values(REC)){const e=s.tally&&s.tally[kind];if(!e)continue;cost+=e.cost;ret+=e.ret;races+=e.races;hits+=e.hits;}
  return cost?{roi:ret/cost,races,hitRate:hits/races}:null;
}
/* 発走時刻を過ぎたか。オッズが無い理由を画面で言い分けるため */
function isPast(r){
  if(!r.date||!r.time)return false;
  const [h,m]=r.time.split(':').map(Number);
  const d=new Date(r.date+'T00:00:00');d.setHours(h,m,0,0);
  return Date.now()>d.getTime();
}
function aiBox(r){
  if(!r.box&&r.conf==null){$('ai').innerHTML='';return;}
  const g=r.grade||'—';
  const conf=r.conf||0;
  const boxRow=(k,t,ja,kind)=>{
    const b=r.box&&r.box[k];
    if(!b||!b[t])return '';
    const rec=recRoi(kind);
    return `<div class="lbl">${ja} 上位${k}頭BOX（${b[t].length}点）${rec?`<span class="rec">直近${rec.races}Rの実績 回収率 ${(rec.roi*100).toFixed(0)}%・的中 ${(rec.hitRate*100).toFixed(0)}%</span>`:''}</div>
      <div class="boxline"><b>${b.sel.join('・')}</b> の${ja}BOX　<span class="o">${b[t].slice(0,10).join('　')}${b[t].length>10?' …':''}</span></div>`;
  };
  const evChips=(list,lab)=>list&&list.length
    ? `<div class="lbl">${lab}<span class="rec">直近230Rの実績 回収率 0〜52%（当たっていません）</span></div>`
      +list.map(b=>`<span class="bet"><b>${b.c.join('-')}</b><i>×${b.ev.toFixed(2)}</i><span class="o">想定${b.odds}倍</span></span>`).join('')
    : '';
  $('ai').innerHTML=`<div class="aibox">
    <div class="aibox__h"><span class="g g${g}" title="期待値による段位">${g}</span>
      <span class="t">AIのおすすめ</span>
      <span class="n">${r.oddsSrc?'オッズ '+esc(r.oddsSrc)+oddsAgo(r):(isPast(r)?'発走済み（結果は結果ページへ）':'オッズ未発売（発売後に自動で更新）')}</span></div>
    <div class="aibox__b">
      <div class="row2">
        <div><span>レースの自信度</span> <b>${(conf*100).toFixed(0)}</b><span class="meter"><i style="width:${Math.min(100,conf*260)}%"></i></span></div>
        <div><span>1位の確率</span> <b>${r.pTop!=null?(r.pTop*100).toFixed(0)+'%':'—'}</b></div>
        <div><span>期待値</span> 馬連 <b>${r.ev?'×'+r.ev.umaren.toFixed(2):'—'}</b>　三連複 <b>${r.ev?'×'+r.ev.sanpuku.toFixed(2):'—'}</b></div>
      </div>
      ${boxRow(3,'sanpuku','三連複','box3_sanpuku')}
      ${boxRow(4,'sanpuku','三連複','box4_sanpuku')}
      ${boxRow(4,'umaren','馬連','box4_umaren')}
      ${r.bets?evChips(r.bets.umaren,'参考：期待値1.0超の馬連'):''}
      <div class="note">期待値は「単勝オッズから推定した市場価格に対して本紙の確率が何倍あるか」。1.00 が損益トントン。
        <b>どの買い方も回収率100%を安定して超えてはいません。</b>実測は上の各行に出しています。
        買う・見送るを機械的に決める根拠には足りないので、金額の強弱をつける参考にしてください。</div>
    </div></div>`;
}

/* 柱の幅を決める。
   収まるとき  … 画面幅を頭数で割って広げる（左に余白を作らず、1番が右端に来る）
   あふれるとき … 既定幅のままにして、右端（1番）までスクロールする         */
function fitPillars(){
  const bd=$('board');
  if(!bd||!bd.classList.contains('tate'))return;
  const ps=bd.querySelector('.pillars');
  if(!ps)return;
  const n=ps.children.length;
  if(!n)return;
  const base=window.matchMedia('(max-width:840px)').matches?104:118;
  const w=bd.clientWidth;
  ps.style.setProperty('--pw', n*base<w ? Math.floor(w/n)+'px' : base+'px');
  bd.scrollLeft=bd.scrollWidth;          // 右端＝1番から見せる
}
window.addEventListener('resize',fitPillars);

let layout='yoko';
try{layout=localStorage.getItem('nkLayout')||'yoko';}catch(e){}
function applyLayout(){
  $('board').className=layout==='tate'?'tate':'';
  $('layoutBtn').textContent=layout==='tate'?'横型に戻す':'縦型（競馬新聞）';
  $('layoutBtn').classList.toggle('on',layout==='tate');
}
$('layoutBtn').onclick=()=>{layout=layout==='tate'?'yoko':'tate';
  try{localStorage.setItem('nkLayout',layout);}catch(e){}
  applyLayout();render();};

function render(){
  pickBar();
  const r=(D.days[day]||[])[ridx];
  if(!r){$('board').innerHTML='<p style="padding:14px">レースがありません。</p>';return;}
  const hs=(D.entries[day+'|'+r.r]||[]).slice().sort((a,b)=>a.no-b.no);
  const top=hs.filter(h=>h.mark).sort((a,b)=>b.win-a.win);
  const PACE={H:'ハイ',M:'平均',S:'スロー'}[r.pace]||'—';
  $('rhead').innerHTML=`<div><span class="n">${r.r}R</span><span class="t">${esc(r.cls)}</span></div>
    <div class="m">ダート <b>${r.dist}m</b>　<b>${r.n}頭</b>${r.time?`　発走 <b>${r.time}</b>`:''}
      　${esc(day)}　想定ペース <b>${PACE}</b>${r.cond?`　馬場 ${esc(r.cond.baba)}／前残り度 ${sgn(r.cond.front)}・内外 ${sgn(r.cond.out)}`:''}</div>
    ${top.length?`<div class="honshi">${top.map(h=>`<span><i class="${MARKC[h.mark]||''}" style="color:${h.mark==='◎'?'var(--red)':h.mark==='○'?'var(--blue)':'inherit'}">${h.mark}</i>${h.no} ${esc(h.name)}</span>`).join('')}</div>`:''}`;
  $('sp').textContent=hs.some(h=>h.scratch)?`取消 ${hs.filter(h=>h.scratch).length}頭を含む`:'';
  tenkai(r,hs);
  aiBox(r);
  applyLayout();
  if(layout==='tate'){
    /* 競馬新聞と同じく右から1番。配列を逆順にして並べ、描画後に右端へスクロールする */
    $('board').innerHTML=`<div class="pillars">${hs.slice().reverse().map(pillar).join('')}</div>`
      +'<div class="swipe">競馬新聞と同じく<b>右から1番</b>の並びです。← 横にスクロールできます →</div>';
    requestAnimationFrame(fitPillars);
  }else{
    $('board').innerHTML=`<div class="thead">
        <div>印</div><div>枠馬番</div><div>馬名・騎手・厩舎</div><div class="idxH">本紙指数</div>
        <div class="runsH"><span>前走</span><span>2走前</span><span>3走前</span><span>4走前</span><span>5走前</span></div>
      </div>`+hs.map(umaRow).join('')
      +'<div class="swipe">← 前5走は横にスクロールできます →</div>';
  }
  $('simLink').href='sim.html?track='+TKEY;
}

const m=NKR.meta||{},w=m.window||{},p=m.pop||{};
$('tag').textContent=`${D.track||''}｜nankankeiba の出馬表から自動生成`;
$('foot').innerHTML=`<div class="legend">
    <span><b>◎○▲△</b> 本紙予想印</span><span><b>能</b> 能力</span><span><b>上</b> 上がり3F</span>
    <span><b>距</b> 今回距離の実績</span><span><b>悪</b> 道悪</span><span><b>人</b> 騎手・厩舎・コンビ・馬主の総合</span>
    <span><b>血</b> 父と母の父</span></div>
  印と勝率は <b>sim.html と同じモデル</b>（モンテカルロ ${m.marks?m.marks.trials:0} 回）を、馬場・天候の既定値と傾向からの自動バイアスで回した結果。
  能・上・距・悪 は前5走のコーナー通過順／着順／上がり3F／馬場から機械的に算出した 0〜1 の推定値。
  人・血の指数は「南関東の平均に対する勝率の対数オッズ差」で、0が平均、+0.7 でおよそ勝率2倍
  （母集団は南関東4場 ${w.leading||''} の全出走 ${(p.runs||0).toLocaleString()}走・平均勝率 ${((p.P0||0)*100).toFixed(1)}%）。
  出典 nankankeiba.com（出馬表／リーディング情報）。生成 ${(m.builtAt||'').slice(0,16).replace('T',' ')}`;
render();
if(!RES)$('view').hidden=true;else if(view==='results')setView('results');
</script>
