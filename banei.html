<style>
:root{

  --rule:#2a2420; --rule2:#cfc6b4; --rule3:#e6dfd0;

*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--gothic);font-size:12.5px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
.masthead{background:var(--band);color:#fdf9f0;padding:8px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.masthead .logo{font-family:var(--mincho);font-size:20px;font-weight:700;letter-spacing:.12em}
.masthead .logo em{font-style:normal;color:var(--gold)}
.masthead .tag{font-size:11px;color:#c8bfae}
.masthead nav{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.masthead nav a{color:#fdf9f0;text-decoration:none;border:1px solid #4a423a;border-radius:2px;padding:3px 10px;font-size:11px;white-space:nowrap}
.bar{display:flex;gap:6px;align-items:center;padding:6px 14px;border-bottom:1px solid var(--rule2);flex-wrap:wrap;background:var(--paper2)}
.bar button{background:#fff;border:1px solid var(--rule2);border-radius:2px;padding:4px 10px;font-size:12px;color:var(--sub)}
.bar button.on{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:700}
.bar .lab{color:var(--faint);font-size:11px;margin-right:2px}
.bar .moist{margin-left:auto;font-size:12px;color:var(--sub)}
.bar .moist b{font-family:var(--mincho);font-size:15px;color:var(--blue)}
#races{display:flex;gap:4px;flex-wrap:wrap;padding:6px 14px;border-bottom:2px solid var(--rule)}
.rbtn{border:1px solid var(--rule2);background:#fff;border-radius:2px;padding:3px 7px;font-size:11.5px;line-height:1.2;text-align:center;min-width:52px}
.rbtn small{display:block;color:var(--faint);font-size:10px}
.rbtn.on{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.rbtn.on small{color:#c8bfae}
.wrap{padding:10px 14px 40px}
.rhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--rule);padding-bottom:6px;margin-bottom:8px}
.rhead .rno{font-family:var(--mincho);font-size:22px;font-weight:700}
.rhead .rname{font-family:var(--mincho);font-size:18px;font-weight:700}
.rhead .grade{display:inline-block;background:var(--red);color:#fff;font-size:11px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.rhead .cond{color:var(--sub);font-size:12px}
.rhead .lvl{display:inline-block;padding:0 6px;font-size:10px;font-weight:700;color:#fff;background:#8b8578}
.rhead .lvl.joint{background:var(--green)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px;align-items:start}
.board{overflow-x:auto}
table.uma{border-collapse:collapse;width:100%;min-width:1150px;font-size:11.5px}
table.uma th{background:var(--band);color:#efe7d8;font-weight:600;font-size:10.5px;padding:3px 4px;border:1px solid #000;white-space:nowrap}
table.uma td{border:1px solid var(--rule2);padding:3px 4px;vertical-align:top}
table.uma tr.h{background:#fff}
table.uma tr.h:nth-child(even){background:#fdfbf6}
td.mk{font-family:var(--mincho);font-size:18px;font-weight:700;text-align:center;width:28px}
td.mk.m1{color:var(--red)}td.mk.m2{color:var(--blue)}
td.wk{text-align:center;width:34px;font-weight:700}
.num{display:inline-block;min-width:20px;padding:0 4px;text-align:center;font-weight:700;font-size:11px;border:1px solid var(--rule)}
td.hn{min-width:200px;max-width:240px}
.sire{font-size:10.5px;color:var(--sub)}
.hname{font-family:var(--mincho);font-size:14.5px;font-weight:700;white-space:nowrap}
.hsub{font-size:10.5px;color:var(--sub)}
.dam{font-size:10.5px;color:var(--sub)}
.jk{font-size:11.5px}
.jk b{font-family:var(--mincho)}
td.ld{width:88px;text-align:right;white-space:nowrap;font-size:11.5px}
td.ld b{font-family:var(--mincho);font-size:14px}
td.ld .s{color:var(--sub);font-size:10.5px}
td.pr{width:84px;text-align:right;white-space:nowrap}
.pw{font-family:var(--mincho);font-size:15px;font-weight:700;color:var(--red)}
.p3{font-size:11px;color:var(--sub)}
.od{font-size:10.5px;color:var(--faint)}
td.run{width:150px;font-size:10.5px;line-height:1.3;color:var(--ink)}
td.run .l1{display:flex;justify-content:space-between}
td.run .pos{font-family:var(--mincho);font-size:15px;font-weight:700}
td.run .pos.p1{color:var(--red)}td.run .pos.p23{color:var(--blue)}
td.run .rn{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:140px}
td.run .s{color:var(--sub)}
.ms{display:inline-block;padding:0 4px;border-radius:2px;font-size:9.5px;color:#fff;background:#8b8578}
.ms.wet{background:var(--blue)}.ms.dry{background:#8a5a2b}
td.run.none{color:var(--faint);text-align:center;vertical-align:middle}
.side h2{font-family:var(--mincho);font-size:14px;margin:12px 0 6px;border-left:5px solid var(--red);padding-left:8px}
.side h2:first-child{margin-top:0}
.rec{border:1px solid var(--rule2);background:#fff;padding:7px 10px;margin:4px 0;font-size:12px}
.rec b{font-family:var(--mincho);font-size:13.5px}
.rec .s{color:var(--sub);font-size:11px}
.chip{display:inline-block;border:1px solid var(--rule2);background:#fff;padding:1px 7px;margin:2px 3px 2px 0;font-size:11.5px}
.chip b{font-family:var(--mincho)}
.chip i{font-style:normal;color:var(--sub);margin-left:4px;font-size:10.5px}
.warn{margin:6px 0;padding:6px 10px;background:#fff4f2;border-left:4px solid var(--red);font-size:11px;line-height:1.6}
ul.points{margin:4px 0 0;padding-left:18px;font-size:12px}
ul.points li{margin:3px 0}
.memo{padding:5px 0;border-bottom:1px dotted var(--rule3);font-size:11px;color:var(--sub)}
.memo b{color:var(--ink);font-family:var(--mincho)}
.cb{display:grid;grid-template-columns:34px 1fr 40px;gap:6px;align-items:center;font-size:10.5px;margin:1px 0}
.cb .b2{height:7px;background:var(--rule3);position:relative;overflow:hidden}
.cb .b2 i{position:absolute;top:0;bottom:0;background:var(--red)}
.cb .b2 i.neg{background:var(--blue)}
.cb .v{text-align:right;color:var(--sub)}
.src{color:var(--faint);font-size:10.5px;margin-top:10px;line-height:1.6}
table.mini{border-collapse:collapse;font-size:11px;width:100%;background:#fff}
table.mini th,table.mini td{border:1px solid var(--rule2);padding:2px 5px;text-align:right}
table.mini th{background:var(--paper2);font-weight:600;text-align:center}
table.mini td.l{text-align:left}
footer{border-top:2px solid var(--rule);background:var(--paper2);padding:10px 14px 30px;color:var(--sub);font-size:11px;line-height:1.7}
@media (max-width:900px){
  .cols{grid-template-columns:1fr}

  .wrap{padding:8px 8px 40px}
  .bar .moist{margin-left:0;width:100%}

/* 段位（南関と同じ S/A/B/C）：最良の買い目の期待値を、検証期間の分布で決めた閾値に当てる */
const rkBadge=(g,big)=>g?`<span class="rk g${g}${big?' big':''}" title="期待値による段位（上位1割 S／1/4 A／半分 B）">${g}</span>`:'';
function rankBox(r){const I=NKBANEI.meta.rankInfo;const g=r.rank,b=r.best;
  const T=I&&I.byGrade||{};const keys=['期待値最良の単勝1点','◎単勝','3頭BOX三連複'];
  return `<div class="rec">${g?rkBadge(g,true):'<span class="s">段位なし（オッズ前）</span>'} ${b?`期待値 <b>${b.ev.toFixed(2)}</b>　${esc(b.kind)} <b>${esc(b.k)}</b> <span class="s">（確率${(b.p*100).toFixed(1)}%×${b.o}倍）</span>`:''}
    ${I&&I.thresholds?`<div class="s">閾値：S ${I.thresholds.p10}以上・A ${I.thresholds.p25}・B ${I.thresholds.p50}（検証 ${I.thresholds.n.toLocaleString()}R の${esc(I.kind||'')}の期待値の分布）</div>`:''}
    ${Object.keys(T).length?`<table class="rkt"><tr><th>段位</th><th>R</th>${keys.map(k=>`<th>${esc(k.replace('期待値最良の','最良の'))}</th>`).join('')}</tr>${['S','A','B','C'].filter(x=>T[x]).map(x=>`<tr class="${x===g?'on':''}"><td class="l">${rkBadge(x)}</td><td>${T[x].races}</td>${keys.map(k=>{const v=T[x].bets[k];return `<td>${v?(v.roi*100).toFixed(0)+'%':'—'}</td>`;}).join('')}</tr>`).join('')}</table><div class="s">検証期間の段位ごとの回収率（1点100円・確定オッズ）。レース数が少なく数本の高配当で動くので、段位は買う・見送るの機械的な根拠にはしない。</div>`:''}</div>`;}

const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const WAKU=[['#fff','#14100c'],['#ffffff','#14100c'],['#1b1b1b','#ffffff'],['#d0202f','#ffffff'],['#2f5fc0','#ffffff'],['#f2d33c','#14100c'],['#2e8b4f','#ffffff'],['#e8802a','#ffffff'],['#ef9bb8','#14100c']];
const MARKC={'◎':'m1','○':'m2'};
const pct=(v,d=1)=>v==null?'—':(v*100).toFixed(d)+'%';
const fmtD=d=>d?`${+d.slice(4,6)}/${+d.slice(6,8)}`:'';                      /* ばんえいの日付は YYYYMMDD */
const fmtPD=(d,base)=>d?(d.slice(0,4)===(base||'').slice(0,4)?fmtD(d):`${d.slice(2,4)}.${fmtD(d)}`):'';
const isMobile=()=>window.matchMedia('(max-width:900px)').matches;
const fmtT=t=>{if(t==null)return '';const m=Math.floor(t/60),s=t-m*60;return (m?m+':':'')+s.toFixed(1).padStart(m?4:1,'0');};
const moistCls=m=>m==null?'':m>=2?'wet':m<1?'dry':'';
const moistWord=m=>m==null?'':m<1?'乾いて重い馬場':m<2?'やや重い馬場':m<3?'軽めの馬場':'水分が多く軽い馬場';
const state={di:0,ri:0};
function pick(){const q=new URLSearchParams(location.search);const days=NKBANEI.days;if(!days.length)return;
  let di=Math.max(0,days.findIndex(d=>d.date===q.get('date')));
  let ri=q.get('r')?days[di].races.findIndex(r=>r.r===+q.get('r')):0;if(ri<0)ri=0;
  /* 指定が無ければ「これから発走するレース」 */
  if(!q.get('r')){const now=new Date();const today=`${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}`;
    if(days[di].date===today){const hm=now.getHours()*60+now.getMinutes();const i=days[di].races.findIndex(r=>r.start&&(+r.start.split(':')[0]*60+ +r.start.split(':')[1])>=hm-3);if(i>=0)ri=i;}}
  Object.assign(state,{di,ri});}
function load(di,ri){Object.assign(state,{di,ri});render();try{history.replaceState(null,'',`?date=${NKBANEI.days[di].date}&r=${NKBANEI.days[di].races[ri].r}`);}catch(e){}}
function runInner(p,base){const pc=p.pos===1?'p1':p.pos<=3?'p23':'';
  return `<div class="l1"><span><span class="pos ${pc}">${p.pos}</span>着 <span class="s">${fmtPD(p.date,base)}</span></span><span class="s">${p.n||''}頭${p.no?' '+p.no+'番':''}</span></div>
    <div class="rn" title="${esc(p.name||'')}">${esc(p.name||'')}</div>
    <div>${p.moist!=null?`<span class="ms ${moistCls(p.moist)}" title="馬場水分">水分${p.moist}</span> `:''}${fmtT(p.time)}${p.diff!=null&&p.pos>1?` <span class="s">${p.diff.toFixed(1)}秒差</span>`:''}${p.pop?` <span class="s">${p.pop}人気</span>`:''}</div>
    <div class="s">${esc((p.jockey||'').replace(/\s/g,''))}${p.load?`　積載${p.load}`:''}${p.bw?`　${p.bw}kg`:''}</div>`;}
const runCell=(p,base)=>p?`<td class="run">${runInner(p,base)}</td>`:'<td class="run none">—</td>';
const runDiv=(p,base)=>p?`<div class="run">${runInner(p,base)}</div>`:'<div class="run none">—</div>';
function render(){const day=NKBANEI.days[state.di];if(!day){$('rhead').innerHTML='出馬表のデータがありません（次の開催日の出馬表が出ると自動で入ります）';return;}
  const r=day.races[state.ri];
  $('dayTabs').innerHTML=NKBANEI.days.map((d,i)=>`<button class="${i===state.di?'on':''}" data-i="${i}">${fmtD(d.date)}</button>`).join('');
  $('moist').innerHTML=r.moist!=null?`馬場水分 <b>${r.moist}%</b>（${moistWord(r.moist)}）${r.weather?`　天候 ${esc(r.weather)}`:''}`:'';
  $('races').innerHTML=day.races.map((x,i)=>`<button class="rbtn ${i===state.ri?'on':''}" data-i="${i}">${rkBadge(x.rank)}${x.r}R<small>${x.start||''} ${esc((x.cls&&x.cls.key)||'')}</small></button>`).join('');
  document.querySelectorAll('#dayTabs button').forEach(b=>b.onclick=()=>load(+b.dataset.i,0));
  document.querySelectorAll('#races .rbtn').forEach(b=>b.onclick=()=>load(state.di,+b.dataset.i));
  $('rhead').innerHTML=`${rkBadge(r.rank,true)}<span class="rno">${r.r}R</span><span class="rname">${esc(r.name)}${r.kind?`<span class="grade">${esc(r.kind)}</span>`:''}</span><span class="cond">${fmtD(day.date)} 帯広　直線${r.dist||200}m　${r.start?r.start+'発走　':''}${esc(r.cond||'').replace(/＊.*$/,'')}　${r.n}頭</span><span class="lvl ${r.level}">${r.level==='joint'?'市場＋特徴量':'基礎モデル'}</span>${(r.changes||[]).map(c=>`<span class="lvl" style="background:var(--red)">${c.no} ${esc(c.name)} ${esc(c.kind)}</span>`).join('')}`;
  const hs=r.horses.slice().sort((a,b)=>a.no-b.no);
  const nameBlock=h=>`<div class="sire">${esc(h.sire||'')}</div><div class="hname">${esc(h.name)}</div><div class="hsub">${esc(h.sexAge||'')} ${esc(h.color||'')}${h.rec?`　通算 ${h.rec.join('-')}`:''}</div><div class="dam">${esc(h.dam||'')}${h.damsire?`（${esc(h.damsire)}）`:''}</div><div class="jk"><b>${esc((h.apprentice||'')+(h.jockey||''))}</b>　${esc(h.trainer||'')}</div><div class="dam">${esc(h.owner||'')}</div>`;
  const loadBlock=h=>`<div><b>${h.load||'—'}</b><span class="s">kg</span></div><div>${h.bw?`<b style="font-size:13px">${h.bw}</b><span class="s">(${h.bwDiff>0?'+':''}${h.bwDiff??''})</span>`:'<span class="s">未発表</span>'}</div>${h.bwPast?`<div class="s" title="近走の平均と幅">普段${h.bwPast}</div>`:''}${h.moistFitN>=2?`<div class="s" title="水分2.0以上と1.2以下での相対着順の差">${h.moistFit>=0.15?'軽い馬場◎':h.moistFit<=-0.15?'重い馬場◎':'水分不問'}</div>`:''}`;
  const priceBlock=h=>`<div class="pw">${pct(h.p1,1)}</div><div class="p3">3着内 ${pct(h.top3,0)}</div>${h.odds?`<div class="od">${h.odds}倍 ${h.pop}人気</div>`:''}`;
  if(isMobile()){
    $('ubody').innerHTML=hs.map(h=>{const w=WAKU[h.waku]||WAKU[0];
      return `<tr class="h"><td class="mob" colspan="11"><div class="mtop"><div class="mk ${MARKC[h.mark]||''}">${h.mark||'　'}</div><div><span class="num" style="background:${w[0]};color:${w[1]}">${h.waku||''}</span><div style="text-align:center;font-weight:700">${h.no}</div></div><div>${nameBlock(h)}<div class="hsub">積載 <b>${h.load||'—'}kg</b>${h.bw?`　馬体重 <b>${h.bw}</b>(${h.bwDiff>0?'+':''}${h.bwDiff??''})`:''}${h.moistFitN>=2?`　${h.moistFit>=0.15?'軽い馬場◎':h.moistFit<=-0.15?'重い馬場◎':''}`:''}</div></div><div class="pr">${priceBlock(h)}</div></div><div class="runs">${[0,1,2,3,4].map(i=>runDiv(h.past[i],day.date)).join('')}</div></td></tr>`;}).join('');
  }else{
    $('ubody').innerHTML=hs.map(h=>{const w=WAKU[h.waku]||WAKU[0];
      return `<tr class="h"><td class="mk ${MARKC[h.mark]||''}">${h.mark}</td><td class="wk"><span class="num" style="background:${w[0]};color:${w[1]}">${h.waku||''}</span></td><td class="wk">${h.no}</td><td class="hn">${nameBlock(h)}</td><td class="ld">${loadBlock(h)}</td><td class="pr">${priceBlock(h)}</td>${[0,1,2,3,4].map(i=>runCell(h.past[i],day.date)).join('')}</tr>`;}).join('');
  }
  const bt=NKBANEI.meta.backtest,T=bt?.table||{};
  const ref=n=>{const t=T[n];return t?`<div class="s">検証 ${bt.races.toLocaleString()}R：的中 ${t.hit}%・回収 <b>${t.roi}%</b></div>`:'<div class="s">検証データなし</div>';};
  const chips=(list,n)=>list.length?list.slice(0,n).map(x=>`<span class="chip"><b>${x.k}</b><i>${pct(x.p,1)}</i></span>`).join(''):'<span class="s">—</span>';
  $('ai').innerHTML=`<div class="rec"><div>馬連 確率上位</div>${chips(r.umaren,5)}${ref('AI 馬連 上位3点').replace('検証','上位3点 検証')}</div>
    <div class="rec"><div>三連複 確率上位</div>${chips(r.sanpuku,5)}${ref('AI 三連複 上位3点').replace('検証','上位3点 検証')}</div>
    <div class="rec"><div>三連単 確率上位</div>${chips(r.santan,6)}${ref('AI 三連単 上位5点').replace('検証','上位5点 検証')}</div>
    <div class="rec"><div>馬単・ワイド</div>${chips(r.umatan,3)}<span class="s">｜ワイド</span> ${chips(r.wide,3)}</div>`;
  const top=r.horses.slice().sort((a,b)=>b.p1-a.p1);
  $('rank').innerHTML=rankBox(r);
  $('box').innerHTML=`<div class="rec">◎ <b>${top[0].no} ${esc(top[0].name)}</b> 単勝${top[0].odds?` ${top[0].odds}倍`:''}${ref('◎単勝')}${ref('◎複勝').replace('検証','複勝 検証')}</div>
    <div class="rec">本命3頭BOX <b>${r.box3.join('-')}</b>${ref('3頭BOX三連複').replace('検証','三連複 検証')}${ref('3頭BOX馬連').replace('検証','馬連 検証')}</div>
    <div class="rec">本命4頭BOX <b>${r.box4.join('-')}</b>${ref('4頭BOX三連複').replace('検証','三連複 検証')}${ref('4頭BOX馬連').replace('検証','馬連 検証')}</div>
    <div class="rec">◎○ 馬連 <b>${[top[0].no,top[1].no].sort((a,b)=>a-b).join('-')}</b>${ref('◎○馬連')}</div>
    <div class="warn">${bt?`検証（${bt.from}〜${bt.to}）の実測。1番人気の単勝は ${T['［基準］1番人気の単勝']?.roi??'—'}%。${bt.note||''}`:'検証データがまだ無い。'} 買う・見送るの機械的な根拠にはせず、金額の強弱の参考まで。</div>`;
  $('points').innerHTML=r.points.map(p=>`<li>${esc(p)}</li>`).join('');
  const G=NKBANEI.meta.groups||[];
  $('memo').innerHTML=top.map(h=>`<div class="memo"><b>${h.mark||'　'} ${h.no} ${esc(h.name)}</b>（${pct(h.p1,1)}）　${h.note.map(esc).join('　')}<div style="margin-top:3px;max-width:520px">${G.map((g,i)=>[g,h.c[i]]).filter(([,v])=>Math.abs(v)>=0.03).map(([g,v])=>`<div class="cb"><span>${g}</span><div class="b2"><i class="${v<0?'neg':''}" style="left:${v<0?50-Math.min(50,Math.abs(v)/1.2*50):50}%;width:${Math.min(50,Math.abs(v)/1.2*50)}%"></i></div><span class="v">${v>=0?'+':''}${v.toFixed(2)}</span></div>`).join('')}</div></div>`).join('');
  const m=NKBANEI.meta,ix=m.index||{};
  const mo=ix.moist||{},ga=ix.gate||{};
  $('stats').innerHTML=`<table class="mini"><tr><th>馬場水分</th><th>レース</th><th>勝ち時計</th><th>1人気勝率</th><th>3連単平均</th></tr>${Object.entries(mo).map(([k,v])=>`<tr class="${k===moistBandOf(r.moist)?'on':''}"><td class="l">${k}%${k===moistBandOf(r.moist)?' ←今日':''}</td><td>${v.races}</td><td>${v.winTime!=null?v.winTime.toFixed(1)+'秒':'—'}</td><td>${v.favWin!=null?(v.favWin*100).toFixed(0)+'%':'—'}</td><td>${v.santanAvg!=null?v.santanAvg.toLocaleString()+'円':'—'}</td></tr>`).join('')}</table>
    <table class="mini" style="margin-top:6px"><tr><th>馬番</th>${Object.keys(ga).map(k=>`<th>${k}</th>`).join('')}</tr><tr><td class="l">得失</td>${Object.values(ga).map(v=>`<td style="color:${v.edge>=1.08?'var(--red)':v.edge<=0.92?'var(--blue)':'inherit'}">${v.edge.toFixed(2)}</td>`).join('')}</tr><tr><td class="l">勝率</td>${Object.values(ga).map(v=>`<td>${(v.win*100).toFixed(0)}%</td>`).join('')}</tr></table><div class="s" style="font-size:10.5px;color:var(--sub);margin-top:3px">得失＝3着内シェア÷出走シェア（1.00 が損得なし）。${ix.races?`${ix.from}〜${ix.to} の ${ix.races.toLocaleString()}レース`:''}</div>`;
  $('src').textContent=`出馬表・結果・払戻・馬場水分は地方競馬情報サイト（keiba.go.jp）の公開ページ。モデルは条件付きロジット（学習 ${m.model?.train?.toLocaleString()}R／検証 ${m.model?.test?.toLocaleString()}R、1着的中 ${m.model?.base?pct(m.model.base.hit1,1):'—'}、上位3頭に勝ち馬 ${m.model?.base?pct(m.model.base.in3,1):'—'}${m.model?.popOnly?`。人気だけなら ${pct(m.model.popOnly.hit1,1)}／${pct(m.model.popOnly.in3,1)}`:''}）。生成 ${m.built?new Date(m.built).toLocaleString('ja-JP',{hour12:false}):''}`;
  document.title=`ばんえい ${fmtD(day.date)} ${r.r}R ${r.name}`;
}
const moistBandOf=m=>m==null?null:m<1?'〜0.9':m<1.5?'1.0〜1.4':m<2?'1.5〜1.9':m<2.5?'2.0〜2.4':m<3?'2.5〜2.9':m<4?'3.0〜3.9':'4.0〜';
$('tag').textContent='地方競馬情報サイト（NAR）の公開ページから自動生成';
$('foot').innerHTML='予想は条件付きロジット（Plackett–Luce、温度較正つき）。単勝オッズが取れているレースは市場を特徴量に入れた joint モデル。馬場水分（含水率）は当日の発表値で、時計は水分でまるごと変わるので前走の時計は水分つきで見ること。';
pick();render();
let mob=isMobile();window.addEventListener('resize',()=>{if(isMobile()!==mob){mob=isMobile();render();}});
</script>
</body>
</html>
