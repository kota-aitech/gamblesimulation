# 締切前オッズを Mac と無関係に取る。
# Mac の launchd はフタを閉じると止まる（clamshell sleep）。結果や番組表は後から取り直せるが、
# **締切前のオッズはその時刻を過ぎたら二度と取れない**ので、ここだけクラウドへ出す。
#
#  - 記録は odds-cloud ブランチへ push する。main へ push すると Pages が毎回ビルドされ、
#    「1時間に10ビルド」の制限に当たるため
#  - cron は JST 8時から22時まで2時間おき。1本が2時間30分ループするので、次が始まるまで切れ目がない
#  - concurrency で前の実行を止めるため、同じ時間帯に2本走って二重に取ることはない
#  - 取りこぼしを恐れて短い間隔で cron を増やさないこと（GitHub の予約実行は混雑時に5〜20分ずれる。
#    長く走る1本のほうが確実）
name: odds
on:
  schedule:
    - cron: '0 23,1,3,5,7,9,11,13 * * *'      # UTC。JST では 8,10,12,14,16,18,20,22時
  workflow_dispatch:
    inputs:
      minutes:
        description: 'ループする分数'
        default: '150'
      lead:
        description: '締切の何分前を拾うか（試験用。ふだんは 8）'
        default: '8'
permissions:
  contents: write
jobs:
  odds:
    strategy:
      fail-fast: false
      matrix:
        sport: [nankan, boat, jra]
    runs-on: ubuntu-latest
    timeout-minutes: 175
    concurrency:
      group: odds-${{ matrix.sport }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4                 # コード（main）
      - uses: actions/checkout@v4                 # 記録の置き場（odds-cloud）
        with:
          ref: odds-cloud
          path: cloud
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: オッズを拾う
        env:
          CO_OUT_ROOT: ${{ github.workspace }}/cloud
          CO_MINUTES: ${{ github.event.inputs.minutes || '150' }}
          CO_LEAD: ${{ github.event.inputs.lead || '8' }}
          CO_PUSH_EVERY: '5'
        run: node tools/cloud_odds.mjs --sport=${{ matrix.sport }}
