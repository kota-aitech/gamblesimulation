# 締切前オッズを Mac と無関係に取る。
# Mac の launchd はフタを閉じると止まる（clamshell sleep）。結果や番組表は後から取り直せるが、
# **締切前のオッズはその時刻を過ぎたら二度と取れない**ので、ここだけクラウドへ出す。
#
#  - 記録は odds-cloud ブランチへ push する。main へ push すると Pages が毎回ビルドされ、
#    「1時間に10ビルド」の制限に当たるため
#  - **GitHub の予約実行は当てにならない。** 実測（2026-09-19〜23）では1日8回のうち実際に走ったのは3〜4回で、
#    しかも最大1時間近く遅れた。落ちた回のぶんは丸ごと穴になり、土曜は 12:32〜16:54 の4時間半が空いた。
#    対策は「cron を増やす」ではなく **1本を長く走らせる**こと（GitHub のジョブ上限は6時間）。
#    3時間おきに仕掛けて1本5時間30分回すので、半分が落ちても切れ目が出ない
#  - concurrency で前の実行を止めるため、同じ時間帯に2本走って二重に取ることはない
#  - 公開リポジトリなので実行時間の課金は無い
name: odds
on:
  schedule:
    - cron: '0 21,0,3,6,9,12,15,18 * * *'     # UTC。JST では 6,9,12,15,18,21,0,3時（3時間おき）
  workflow_dispatch:
    inputs:
      minutes:
        description: 'ループする分数'
        default: '330'
      lead:
        description: '締切の何分前を拾うか（試験用。ふだんは 8）'
        default: '8'
permissions:
  contents: write
jobs:
  odds:
    strategy:
      fail-fast: false
      matrix:
        sport: [nankan, boat, jra]
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: odds-${{ matrix.sport }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4                 # コード（main）
      - uses: actions/checkout@v4                 # 記録の置き場（odds-cloud）
        with:
          ref: odds-cloud
          path: cloud
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: オッズを拾う
        env:
          CO_OUT_ROOT: ${{ github.workspace }}/cloud
          CO_MINUTES: ${{ github.event.inputs.minutes || '330' }}
          CO_LEAD: ${{ github.event.inputs.lead || '8' }}
          CO_PUSH_EVERY: '5'
        run: node tools/cloud_odds.mjs --sport=${{ matrix.sport }}
