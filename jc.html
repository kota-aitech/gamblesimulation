11-27","cond":"天候：晴 馬場状態：芝 良 ダート 良","url":"https://www.jra.go.jp/news/202611/112707.html","name":"エシカルダイヤモンド","rider":"ポール・ロシュ厩務員","menu":"ダートコースにて左回りキャンター1-1／4周","who":"ポール・ロシュ厩務員","comment":"馬が機嫌良く過ごせるようにすることが一番ですので、今朝の調教もいつもどおりのキャンターを行いました。枠順（18番）について、W.マリンズ調教師と直接話はしていませんが、この馬は昨年のブリーダーズカップターフを外枠から勝っていますから、心配していません。"},{"date":"2026-11-26","cond":"天候：晴 馬場状態：芝 良 ダート 良","url":"https://www.jra.go.jp/news/202611/112608.html","name":"エシカルダイヤモンド","rider":"ポール・ロシュ厩務員","menu":"ダートコースにて左回りキャンター1-1／4周","who":"ポール・ロシュ厩務員","comment":"馬の状態はフレッシュで、非常に良好です。今朝は昨日と同じく、1-1／4マイルをキャンターさせました。動きも良く、状態は申し分ないです。明日もおそらく同じメニューを行う予定です。レース当日まではこのような一定のペースで軽めの運動を続けていきます。"},{"date":"2026-11-25","cond":"天候：晴 馬場状態：芝 良 ダート 良","url":"https://www.jra.go.jp/news/202611/112501.html","name":"エシカルダイヤモンド","rider":"ポール・ロシュ厩務員","menu":"ダートコースにて左回りキャンター1-1／4周","who":"ポール・ロシュ厩務員","comment":"今日はキャンターをさせましたが、状態は日に日に良くなっています。馬は環境にも慣れて、とても落ち着いていてリラックスしており、ここでの滞在を満喫しているようです。速い運動をする予定は現時点ではないと思いますが、調教師がどう判断するか次第です。"},{"date":"2026-11-24","cond":"天候：曇 馬場状態：ダート 良","url":"https://www.jra.go.jp/news/202611/112402.html","name":"エシカルダイヤモンド","rider":"ポール・ロシュ厩務員","menu":"ダートコースにて左回りキャンター1-1／2周、発走調教審査（合格）、キャンター1／2周","who":"ポール・ロシュ厩務員","comment":"昨日に比べて、今日はより速いペースで調教を行いました。馬の調子は良いですし、すべて順調に進んでいます。今年もドバイやアメリカ、そして今回は日本に遠征していますが、タフな馬で馬体も筋肉が落ちたりといったことは全くありません。"},{"date":"2026-11-23","cond":"天候：晴 馬場状態：良","url":"https://www.jra.go.jp/news/202611/112306.html","name":"エシカルダイヤモンド","rider":"ポール・ロシュ厩務員","menu":"ダートコースにて左回りキャンター1-1／4周","who":"ポール・ロシュ厩務員","comment":"今日は昨日と同じメニューの調教を行いましたが、昨日よりも少し速いペースで進めました。状態はとても良いですし、非常に満足しています。日本に来る前は、本国で調教用のコースで2マイル弱を走るという内容で、毎日同じメニューをこなしていました。明日はゲート試験がありますが、その後は今日とほぼ同じメニューをこなす予定です。"},{"date":"2026-11-22","cond":null,"url":"https://www.jra.go.jp/news/202611/112204.html","name":"エシカルダイヤモンド","rider":"ポール・ロシュ厩務員","menu":"ダートコースにて左回りキャンター1-1／8周","who":"ポール・ロシュ厩務員","comment":"今日はダートコースに出てキャンターをしました。馬はコースの様子をしっかり確認できていましたし、とても落ち着いていました。明日はおそらく今日と同じようなメニューになると思いますが、調教師と相談して、少し内容を増やすかもしれません。"},{"date":"2026 良 ダート 良","url":"https://www.jra.go.jp/news/202611/112608.html","name":"オンブズマン","rider":"ウィリアム・ビュイック騎手","menu":"芝コースにて帯同馬デビルズアドボケイトを前に左回りダク1／4周、帯同馬を後ろに左回りキャンターからギャロップ1周","who":"タデウス・ゴスデン調教師","comment":"3月にドバイへ遠征した経験があるため長距離輸送には慣れており、非常に順調でした。オンブズマンはもうベテランの域に達しており、非常に落ち着いていてプロフェッショナルな振る舞いを見せてくれます。今朝、芝コースを走らせてみましたが、非常にうまく対応していました。周囲には目新しいものがたくさんありますが、馬自身はもう何をするべきか完全に理解しています。すべてが極めて順調に進んでいます。"},{"date":"2026-11-25","cond":"天候：晴 馬場状態：芝 良 ダート 良","url":"https://www.jra.go.jp/news/202611/112501.html","name":"オンブズマン","rider":"ゲイリー・フォースター厩務員","menu":"ダートコースにて帯同馬デビルズアドボケイトを前に左回りダク1／4周、キャンター1周","who":"アンドリュー・ストリンガー調教助手","comment":"昨日と同じく、9ハロンの距離を一定のペースでしっかりと走らせました。明日はW.ビュイック騎手を背に芝コースで調教を行う予定です。充実したシーズンを過ごしていますが、非常に成熟していて、とてもプロフェッショナルな馬です。どんな状況にも動じず、落ち着いて対応できます。"},{"date":"2026-11-24","cond":"天候：曇 馬場状態：ダート 良","url":"https://www.jra.go.jp/news/202611/112402.html","name":"オンブズマン","rider":"ゲイリー・フォースター厩務員","menu":"ダートコースにて帯同馬デビルズアドボケイトを前に左回りダク1／4周、キャンター1周、発走調教審査（合格）、常歩1／2周","who":"タデウス・ゴスデン調教師","comment":"ゲート審査は何事もなく無事に終えました。輸送はすべてがスムーズに進み、非常に良い状態にあると思います。ドバイへの遠征も経験していますし、長距離移動に慣れていて、こちらの環境にもとてもうまく馴染んでいます。ジャパンカップは世界最高峰のレースの一つとして国際的に認められていますから、この馬を連れて来られたことは非常に幸運でした。追い切りは木曜か金曜か様子を見ながらになりますが、脚を伸ばす程度のものになると思います。"},{"date":"2026-11-23","cond":"天候：晴 馬場状態：良","url":"https://www.jra.go.jp/news/202611/112306.html","name":"オンブズマン","rider":"ゲイリー・フォースター厩務員","menu":"ダートコースにて帯同馬デビルズアドボケイトを前に左回りダク1／4周、キャンター1周","who":"アンドリュー・ストリンガー調教助手","comment":"今日は少し距離を延ばして運動を行ないましたが、すべて順調です。こちらの本馬場にもすっかり馴染んでいて、非常に良い状態に見えました。彼はチャンピオンステークスを制し、これ以上ないほどの馬ですが、何より重要なのは輸送を経て、新しい環境にしっかりと適応してくれたことです。ゲート試験がある明日も同じメニューをこなす予定ですが、タデウス・ゴスデン調教師も来場する予定です。"},{"date":"2026-11-22","cond":null,"url":"https://www.jra.go.jp/news/202611/112204.html","name":"オンブズマン","rider":"ゲイリー・フォースター厩務員","menu":"ダートコースにて帯同馬デビルズアドボケイトを前に左回り常歩1／8周、ダク1／4周、キャンター3／4周","who":"アンドリュー・ストリンガー調教助手","comment":"今朝初めて国際厩舎を出て、素晴らしいトラックを目にすることができたのは、馬にとって良い経験になったはずです。厩舎に戻ってきた時も馬はとても機嫌が良く、生き生きとしていました。明日も今朝と同じようなメニューをこなす予定です。ドバイ遠征時も、レースに向けてこれと似たような準備を行っていました。調教師が来日 ・グラファール調教師","comment":"カランダガンはここの環境をよく知っていますし、状態も非常に良いです。馬体重も安定していますし、飼葉もしっかり食べています。到着してからの状態には、本当に満足しています。今朝は馬が調教に集中できるよう、芝コースで軽めの調整を行いました。負荷をかけすぎないように配慮しましたが、レースに向けて精神的にも肉体的にも準備は整っていると思います。昨年のジャパンカップは本当に素晴らしい結果で、最高に嬉しかったです。昨年も非常に厳しいレースでしたが、今年もまた厳しいものになるでしょう。シーズンを通してとても良い状態を維持できていますし、タイトル防衛に向けて全力を尽くしてくれるはずです。今年もまたファンの皆さんの前で、ほとんど不可能とも思えるような連覇という偉業に挑む姿を見せられるのは、素晴らしいことだと思います。彼はチャンピオンですし、状態も非常に良いので、良い結果が出ることを祈っています。"},{"date":"2026-11-25","cond":"天候：晴 馬場状態：芝 良 ダート 良","url":"https://www.jra.go.jp/news/202611/112501.html","name":"カランダガン","rider":"ジェレミー・ロベル調教助手","menu":"ダートコースにて帯同馬エリマンを前に左回りキャンター1-1／4周","who":"ジェレミー・ロベル調教助手","comment":"今朝は昨日と同じく、軽めのキャンターと通常のキャンターを行いました。状態は非常に良好です。明日は追い切りを行う予定で、芝コースに入ります。M.バルザローナ騎手が騎乗し、馬の感触を確かめる機会になると思います。"},{"date":"2026-11-24","cond":"天候：曇 馬場状態：ダート 良","url":"https://www.jra.go.jp/news/202611/112402.html","name":"カランダガン","rider":"ジェレミー・ロベル調教助手","menu":"ダートコースにて帯同馬エリマンを前に左回りキャンター1-1／2周、発走調教審査（合格）、常歩1／2周","who":"ジェレミー・ロベル調教助手","comment":"ゲート審査は順調でした。馬の状態はフィジカル的にもメンタル的にも非常に良いです。今年は昨年ほどの成績ではありませんが、能力は落ちてはいません。（昨年に続いてのジャパンカップ参戦で）馬は東京競馬場を覚えていますし、去年より環境への適応が早いことも、成長している部分だと思います。追い切りは木曜日を予定しています。"},{"date":"2026-11-23","cond":"天候：晴 馬場状態：良","url":"https://www.jra.go.jp/news/202611/112306.html","name":"カランダガン","rider":"ジェレミー・ロベル調教助手","menu":"ダートコースにて帯同馬エリマンを前に左回りキャンター1-1／2周","who":"ジェレミー・ロベル調教助手","comment":"今日はゆっくりめのキャンターと通常のキャンターを行いました。調子はとても良く、元気に過ごしています。昨年と比べても、さらに落ち着いているように感じます。来日前にはしっかりと仕上げてきており、週1回のペースで強めの調教を行ってきました。明日も今日同様の運動を行って、ゲート試験を受ける予定です。（同じ厩舎の）エルデナリのレースはライブで観戦しました。（カランダガンにも騎乗予定の）M.バルザローナ騎手が勝利できたことを大変うれしく思います。"},{"date":"2026-11-22","cond":null,"url":"https://www.jra.go.jp/news/202611/112204.html","name":"カランダガン","rider":"ジェレミー・ロベル調教助手","menu":"ダートコースにて帯同馬エリマンを前に左回りキャンター1周","who":"ジェレミー・ロベル調教助手","comment":"今日初めてコースに出て、軽めのキャンターを行いました。運動中の様子も素晴らしかったです。まだ調教師と確認できていませんが、明日はおそらく通常のペースのキャンターをすることになると思います。調教師は火曜日の調教に来場予定で、追い切りは水曜日か木曜日になると思いますが、まだ決まっていません。"},{"date":"2026-11-21","cond":null,"url":"https://www.jra.go.jp/news/202611/112107.html" いるようです。装鞍所とパドックをスクーリングしましたが、一度経験している場所なので馬はリラックスしていました。枠順（17番）について、F.グラファール調教師は「もう少し内寄りが良かったが、与えられた枠でやるしかない」と言っていました。"},{"date":"2026-11-26","cond":"天候：晴 馬場状態：芝 良 ダート 良","url":"https://www.jra.go.jp/news/202611/112608.html","name":"ゴリアット","rider":"クリストフ・スミヨン騎手","menu":"芝コースにて帯同馬アームドールを追走し、左回りキャンターからギャロップ1-1／4周（ゴール前で追い抜く）","who":"フランシスアンリ・グラファール調教師","comment":"本国を出発する時点で非常に良い状態にあることは分かっていましたが、輸送中もゴリアットは非常に落ち着いて過ごせていたようですし、順調に来日できました。馬の状態については、これ以上ないほど満足しています。2年前のジャパンカップは、非常に駆け引きの多い、少し変わった展開のレースでしたが、本当に素晴らしい走りを見せてくれました。昨年はローテーションの都合で日本には遠征しませんでしたが、今年はドイツで良いレースをしてくれましたので、こうして再び日本へ戻ってくることができて良かったです。"},{"date":"2026-11-25","cond":"天候：晴 馬場状態：芝 良 ダート 良","url":"https://www.jra.go.jp/news/202611/112501.html","name":"ゴリアット","rider":"ディラン・ルペル調教助手","menu":"ダートコースにて帯同馬アームドールを後ろに左回りキャンター1-1／4周","who":"アントニ・ダヴィ厩務員","comment":"今日は少し強めのキャンターを行いました。馬の状態は素晴らしいです。明日は芝コースで追い切りを行う予定です。ジャパンカップ後も有馬記念に向けて日本に留まる予定ですが、ここでの環境にも慣れてきているので、素晴らしい滞在になると思います。"},{"date":"2026-11-24","cond":"天候：曇 馬場状態：ダート 良","url":"https://www.jra.go.jp/news/202611/112402.html","name":"ゴリアット","rider":"ディラン・ルペル調教助手","menu":"ダートコースにて帯同馬アームドールを後ろに左回りキャンター1-1／4周、発走調教審査（合格）、常歩1／2周","who":"アントニ・ダヴィ厩務員","comment":"今朝のゲート審査は非常にスムーズでした。輸送に慣れていますので、馬は落ち着いています。2年前のジャパンカップと比べて、世界中色々なところでレースの経験を積んで、心身両面で適応性が高くなっており、最高の状態です。追い切りは木曜日に行う予定です。"},{"date":"2026-11-23","cond":"天候：晴 馬場状態：良","url":"https://www.jra.go.jp/news/202611/112306.html","name":"ゴリアット","rider":"ディラン・ルペル調教助手","menu":"ダートコースにて帯同馬アームドールを後ろに左回りキャンター1-1／8周","who":"アントニ・ダヴィ厩務員","comment":"今日はキャンターを行いましたが、馬の様子はとても落ち着いており順調です。来日の3週間前から毎週月曜日に追い切りに近い強めの調教を2から3回行って、しっかりと仕上げてきました。明日も今日と同じくキャンターを行い、その後ゲート試験を受ける予定です。エルデナリのレースを見ていましたが、（マイルチャンピオンシップを）ヨーロッパ調教馬が勝利したことは初めてということで、とてもうれしく思います。ゴリアットにとっても良い刺激になると思います。"},{"date":"2026-11-22","cond":null,"url":"https://www.jra.go.jp/news/202611/112204.html","name":"ゴリアット","rider":"ディラン・ルペル調教助手","menu":"ダートコースにて帯同馬アームドールを後ろに左回りキャンター1周","who":"アントニ・ダヴィ厩務員","comment":"初めてコースに出ましたが、馬もとてもリラックスしていて、いい運動ができました。明日も今日と同じようにキャンターを一周する予定です。火曜日に調教師がこちらに来る予定ですが、追い切りはおそらく水曜日になると思います。"},{"date":"2026-11-21","cond":null,"url":"https://www.jra.go.jp/news/202611/112107.html","name":"ゴリアット","rider":"アントニ・ダヴィ厩務員","menu":"国際厩舎内追馬場にて運動","who":"アントニ・ダヴィ厩務員","comment":"今日はダクと軽いキャンターを行いました。素晴らしい動きで、特に問題はありませんでした。運動後もとても落ち着いていて、リラックスしていました。食欲も通常どおりで、馬体重も測定しましたが、減ってはいません。明日はコースに出てキャンターを行う予定です。"},{"date":"2026-11-20","cond":null,"url":"https://www.jra.go.jp/news/202611/112003.html","name":"ゴリアット","rider":null,"menu":"曳き運動のみ","who":"アントニ・ダヴィ厩務員","comment":"水曜日の朝にフランスの厩舎を出発し、ここまでの約30時間の輸送でしたが、非常に順調でした。今朝は約1時間、厩舎周りで曳き運動を行いました。輸送明けですが馬の状態は非常に良く、元気な様子でした。飼い葉もしっかり食べ、水も十分に飲んでいて、とても嬉しそうにしています。この場所についても、なんとなく覚えているようでリラックスしていました。馬体重は505kgで、出発時から全く減っていません。明日は国際厩舎内の追馬場で運動をする予定です。"}],"ped":{"sire":{"name":"Adlerflug","sire":{"horses":0,"turf":{"n":0,"w":0,"t3":0,"wr":null,"t3r":null},"long":{"n":0,"w":0,"t3":0,"wr":null,"t3r":null},"tokyo":{"n":0,"w":0,"t3":0,"wr":null,"t3r":null},"dirt":{"n":0,"w":0,"t3":0,"wr":null,"t3r":null},"winDistMed":null,"g1":[]},"damsire":{"horses":0,"turf":{"n":0,"w":0,"t3":0,"wr":null,"t3r":null},"long":{"n":0,"w":0,"t3":0,"wr":null,"t3r":null},"tokyo":{"n":0,"w":0,"t3":0,"wr":null,"t3r":null},"dirt":{"n":0,"w":0,"t3":0,"wr":null,"t3r":null},"winDistMed":null,"g1":[]}},"grandsire":{"name":"In The Wings","sire":{"horses":0,"turf":{"n":0,"w":0,"t3":0,"wr":null,"t3r":null},"long":{"n":0,"w":0,"t3":0,"wr":null,"t3r":null},"tokyo":{"n":0,"w":0,"t3":0,"wr":null,"t3r":null},"dirt":{"n":0,"w":0,"t3":0,"wr":null,"t3r":null},"winDistMed":null,"g1":[]},"damsire":{"horses":6,"turf":{"n":8,"w":0,"t3":1,"wr":0,"t3r":0.125},"long":{"n":0,"w":0,"t3":0,"wr":null,"t3r":null},"tokyo":{"n":1,"w":0,"t3":0,"wr":0,"t3r":0},"dirt":{"n":40,"w":6,"t3":17,"wr":0.15,"t3r":0.425},"winDistMed":null,"g1":[]}},"damsire":{"name":"Shamardal","sire":{"horses":4,"turf":{"n":34,"w":2,"t3":6,"wr":0.059,"t3r":0.176},"long":{"n":1,"w":0,"t3":0,"wr":0,"t3r":0},"tokyo":{"n":4,"w":0,"t3":2,"wr":0,"t3r":0.5},"dirt":{"n":15,"w":0,"t3":4,"wr":0,"t3r":0.267},  良 ダート 良","url":"https://www.jra.go.jp/news/202611/112608.html","name":"テアオ","rider":null,"menu":"本日は馬場入りしませんでした。","who":"ジョン・サドラー調教師","comment":"テアオは東京競馬場までの輸送を非常に順調にこなしました。昨日も素晴らしい調教を消化しており、馬の状態は非常に良さそうです。今回のジャパンカップ参戦は馬主の意向によるものです。南米のG1を制した後、カリフォルニアで調整を行ってきました。この馬は輸送に非常に強いタイプなので、今回の遠征に適していると考えました。私たちは馬主の期待に応えるべく、全力を尽くすつもりです。"},{"date":"2026-11-25","cond":"天候：晴 馬場状態：芝 良 ダート 良","url":"https://www.jra.go.jp/news/202611/112501.html","name":"テアオ","rider":"セラピオ・フィゲロア調教助手","menu":"芝コースにて左回りキャンターからギャロップ1-1／2周","who":"セラピオ・フィゲロア調教助手","comment":"今朝は800メートルを50秒ほどのペースで走らせ、レースに向けた感触を確認しました。馬の状態は非常に良く、馬場のコンディションも良好でした。非常に賢い馬で、こちらの要求にすべて応えてくれました。芝コースも、硬すぎず柔らかすぎず、非常に気に入っています。これだけ走った後でも息はまったく上がっておらず、疲労もキャンターを終えた程度です。馬の状態は100％に仕上がっていると思います。"},{"date":"2026-11-24","cond":"天候：曇 馬場状態：ダート 良","url":"https://www.jra.go.jp/news/202611/112402.html","name":"テアオ","rider":"セラピオ・フィゲロア調教助手","menu":"ダートコースにて左回りキャンター1-1／4周、発走調教審査（合格）、右回りダク1／2周","who":"セザール・アグイラール厩務員","comment":"輸送も問題なかったですし、調教もしっかりこなしていますので、馬の状態には満足しています。日本のレースへの適性は分かりませんが、馬は食欲もあり、日本の気候・環境にも適応しているので、私たちにできるのは100％の状態を維持していくことです。"},{"date":"2026-11-23","cond":"天候：晴 馬場状態：良","url":"https://www.jra.go.jp/news/202611/112306.html","name":"テアオ","rider":"セラピオ・フィゲロア調教助手","menu":"ダートコースにて左回りダク1／4周、キャンター1周","who":"セラピオ・フィゲロア調教助手","comment":"今朝のキャンターは完璧でしたし、馬の状態は非常に良いです。来日前にデルマー競馬場の芝コースで5ハロンと6ハロンの追い切りを行いましたが、非常に順調でした。馬がもっと走りたがるようなら、その分だけキャンターの距離を少し延ばすようにしています。今朝はL.トーレス騎手も来ていて、調教を見て「とても順調だ」と言っていました。彼が実際に騎乗するのは、レース当日のみとなります。"},{"date":"2026-11-22","cond":null,"url":"https://www.jra.go.jp/news/202611/112204.html","name":"テアオ","rider":"セラピオ・フィゲロア調教助手","menu":"ダートコースにて左回りダク1／4周、キャンター1／4周、ギャロップ3／4周","who":"セラピオ・フィゲロア調教助手","comment":"今朝はギャロップで走らせました。馬はとても機嫌が良く、馬場での感触も上々で、力強い走りを見せてくれました。戻ってきた時も上機嫌でしたし、飼い葉もすべてしっかりと完食していました。明日も同じようなメニューを行う予定です。基本的には馬の様子に合わせて進め、馬がもっとやりたそうにしていれば少し負荷を増やします。"},{"date":"2026-11-21","cond":null,"url":"https://www.jra.go.jp/news/202611/112107.html","name":"テアオ","rider":"セラピオ・フィゲロア調教助手","menu":"国際厩舎内追馬場にて運動","who":"セラピオ・フィゲロア調 ・リチャードソン厩務員","comment":"今朝の調教内容としてはいつもの日課どおりで、ダクから7ハロン半ほどしっかりとした強めのキャンターを行いました。本国同様に、レースに向けて徐々に負荷を上げています。明日も今日と似たようなメニューになるでしょう。枠順（10番）については満足しています。強力なライバルであるオンブズマンやカランダガンと並びになりましたが、この馬は発馬が非常に鋭く、そこから良いポジションを取れるはずですので期待しています。"},{"date":"2026-11-26","cond":"天候：晴 馬場状態：芝 良 ダート 良","url":"https://www.jra.go.jp/news/202611/112608.html","name":"ミニーホーク","rider":"レイチェル・リチャードソン厩務員","menu":"ダートコースにて左回りダク1／4周、キャンター1周","who":"レイチェル・リチャードソン厩務員","comment":"馬の状態は非常に良好です。昨日の芝コースでの調教後も元気いっぱいで、疲れもなく、順調に回復しています。今朝は7ハロンの距離を一定のペースでキャンターを行いました。明日以降の運動メニューについては、今晩調教師と相談して決める予定ですが、前半は落ち着いたペースで運動し、後半に少しペースを上げることになると思います。"},{"date":"2026-11-25","cond":"天候：晴 馬場状態：芝 良 ダート 良","url":"https://www.jra.go.jp/news/202611/112501.html","name":"ミニーホーク","rider":"レイチェル・リチャードソン厩務員","menu":"芝コースにて左回りダク1／2周、キャンター1周","who":"レイチェル・リチャードソン厩務員","comment":"今朝は馬に芝の感触を確かめさせるために、芝コースで運動させましたが、弾むような足取りでした。馬もフレッシュでエネルギーに満ち溢れていて、とても良い状態ですし、非常に満足しています。これ以上負荷のかかる運動は予定していないので、明日からはダートに戻して、いつものルーティンワークの予定です。"},{"date":"2026-11-24","cond":"天候：曇 馬場状態：ダート 良","url":"https://www.jra.go.jp/news/202611/112402.html","name":"ミニーホーク","rider":"レイチェル・リチャードソン厩務員","menu":"ダートコースにて左回りダク1／2周、キャンター1周、発走調教審査（合格）、常歩1／2周","who":"レイチェル・リチャードソン厩務員","comment":"今朝はゲート審査がありましたが、調教は非常に順調に進んでおり、馬の状態はすごく良さそうで足取りも軽快でした。この馬は距離や馬場状態、レース展開に柔軟に対応できる馬です。明日の調教メニューについては、今日の午後にトレーナーと話して決めますが、毎日少しずつ運動量を増やしているところです。"},{"date":"2026-11-23","cond":"天候：晴 馬場状態：良","url":"https://www.jra.go.jp/news/202611/112306.html","name":"ミニーホーク","rider":"レイチェル・リチャードソン厩務員","menu":"ダートコースにて左回りダク3／4周、キャンター3／4周","who":"レイチェル・リチャードソン厩務員","comment":"今朝の動きもとても良く、非常に順調です。明日の調教内容については、調教師と相談してから決めることになりますが、少し負荷を強めることになるはずです。おそらくダクとキャンターを7ハロンあるいは6ハロン半くらいずつになるでしょう。"},{"date":"2026-11-22","cond":null,"url":"https://www.jra.go.jp/news/202611/112204.html","name":"ミニーホーク","rider":"レイチェル・リチャードソン厩務員","menu":"ダートコースにて左回りダク3／4周、キャンター3／4周","who":"レイチェル・リチャードソン厩務員","comment":"今朝のダートコースの運動では、馬は非常に活気があり、動きも良く、とても楽しそうにしていました。明日以降のメニューについては、日々の様子を見ながら調教師と相談して決めるつもりです。馬体重も徐々に増えてきており、その点も非常に嬉しく思っています。"},{"   const b=m.big;out.push(['14頭以上のレース',rec(b),b.n<2?['u','標本少']:r3(b)>=.6?['g','こなす']:r3(b)>=.4?['m','ふつう']:['b','不安']]);
  const bt=m.best2400;const sec=bt?(+bt.time[0])*60+(+bt.time.slice(2)):null;
  out.push(['2400mの持ち時計（良）',bt?`${bt.time}（${esc(bt.venue)}・${bt.date.slice(0,4)}年 ${bt.pos}着）`:'なし',!bt?['u','なし']:sec<=143?['g','速い']:sec<=146.5?['m','ふつう']:['b','遅い']]);
  const j=m.japan;out.push(['日本での出走',j.length?j.map(x=>`${x.date.slice(0,4)}年 ${esc(x.name)} ${x.pos}着（${x.time}）`).join('／'):'初来日',!j.length?['u','初来日']:j.some(x=>x.pos<=3)?['g','好走あり']:['m','経験あり']]);
  const la=m.last;if(la)out.push(['前走からの間隔',`${la.days}日（${md(la.date)} ${esc(la.name)} ${la.pos}着）`,la.days>120?['b','休み明け']:la.days<35?['m','間隔が短い']:['g','標準']]);
  const w=h.bwNow?.bw;if(w){const bd=JC.bwBand.find(x=>{const m=x.band.match(/(\d+)?〜(\d+)?/);const lo=x.band.startsWith('〜')?0:+x.band.match(/^\d+/)[0];const hi=x.band.match(/〜(\d+)/)?+x.band.match(/〜(\d+)/)[1]:999;return w>=lo&&w<=hi;});
    out.push(['馬体重（調教後）',`${w}kg … 東京芝2400mの ${bd.band} は3着内率 ${pct(bd.t3r,1)}`,bd.t3r>=.26?['g','好走帯']:bd.t3r>=.23?['m','ふつう']:['b','軽い帯']]);}
  const sp=pedBest(h);out.push(['父系の日本での成績',sp?`${esc(sp.label)}：中央の芝 ${sp.turf.n}走・3着内率 ${pct(sp.turf.t3r,1)}（全体 ${pct(JC.base.turf.t3r,1)}）`:'中央で走った産駒がほぼいない',!sp?['u','標本なし']:sp.turf.n<30?['u','標本少']:sp.turf.t3r>=JC.base.turf.t3r+.05?['g','裏づけあり']:sp.turf.t3r>=JC.base.turf.t3r-.03?['m','ふつう']:['b','低い']]);
  return out;
}
function pedBest(h){const p=h.ped;const c=[[p.sire,'sire','父'],[p.grandsire,'sire','父の父'],[p.grandsire,'damsire','父の父（母の父として）']];
  for(const [x,role,lab] of c){const q=x&&x[role];if(q&&q.turf&&q.turf.n>=20)return {label:`${lab} ${x.name}`,...q};}
  for(const [x,role,lab] of c){const q=x&&x[role];if(q&&q.turf&&q.turf.n>0)return {label:`${lab} ${x.name}`,...q};}
  return null;}

   ${g.list.map(x=>`<tr><td>${esc(x.date)}</td><td class="num">${x.amt}mm</td><td>${eh(x.endHour)}</td><td>${x.nNotGood?`<b class="up">${esc(bb(x.first))}</b> → ${esc(bb(x.last))}`:'良'}</td><td class="num">${x.nNotGood}／${x.n}</td><td class="num">${x.moist??'—'}</td><td class="num">${x.cushion??'—'}</td></tr>`).join('')}</tbody></table></div>`).join(''):'';
  const G=P&&P.good;const sg=v=>(v>0?'+':'')+v.toFixed(2);
  const cmp=G&&G.dry.n&&G.wet.n?`<div class="scroll"><table class="mid"><thead><tr><th>良馬場の日</th><th class="num">日数・R</th><th class="num">勝ち時計</th><th class="num">最速上がり</th><th class="num">勝ち馬の4角</th><th class="num">含水率</th><th class="num">クッション値</th></tr></thead><tbody>
   <tr><td>3日以上降っていない</td><td class="num">${G.dry.days}日・${G.dry.n}R</td><td class="num">${sg(G.dry.dt)}秒</td><td class="num">${sg(G.dry.dag)}秒</td><td class="num">${G.dry.p4}</td><td class="num">${G.dry.moist??'—'}%</td><td class="num">${G.dry.cushion??'—'}</td></tr>
   <tr class="hit"><td><b>前日までに10mm以上降って良</b></td><td class="num">${G.wet.days}日・${G.wet.n}R</td><td class="num">${sg(G.wet.dt)}秒</td><td class="num">${sg(G.wet.dag)}秒</td><td class="num">${G.wet.p4}</td><td class="num">${G.wet.moist??'—'}%</td><td class="num">${G.wet.cushion??'—'}</td></tr></tbody></table></div>
   <p class="note">勝ち時計と最速上がりは、同じ距離・同じクラス帯の良馬場の平均との差（マイナスが速い）。4角は勝ち馬の4角の順位÷頭数（小さいほど前）。<b>雨上がりの良は、乾いた良と時計も決まり方もほぼ同じ</b>。</p>`:'';
  const ac=Object.entries(W.actual||{}).sort();
  const act=ac.length?`<p class="note"><b>今週の JRA の測定</b>：${ac.map(([d,a])=>`${md(d)} 芝の含水率 ${a.moist??'—'}%${a.cushion?`・クッション値 ${a.cushion}`:''}`).join('／')}</p>`:'';
  const hs=JC.foreign.slice().sort((a,b)=>(a.no||99)-(b.no||99));const rec=c=>c&&c.n?`${c.n}戦${c.w}勝<span class="sub">・3着内${c.t3}</span>`:'<span class="sub">なし</span>';
  const hv=`<div class="scroll"><table class="nar"><thead><tr><th>外国馬</th><th class="num">良馬場</th><th class="num">良以外</th></tr></thead><tbody>${hs.map(h=>`<tr><td>${h.no??''} <a href="#${h.key}">${esc(h.name)}</a></td><td class="num">${rec(h.my.good)}</td><td class="num">${rec(h.my.soft)}</td></tr>`).join('')}</tbody></table></div>`;
  const split=F&&new Set(kinds).size>1;
  $('weather').innerHTML=`<h3 class="sec">天気と馬場<small style="font-size:13px;font-family:var(--gothic);font-weight:400;margin-left:8px">雨のあと、日曜にどこまで戻るか</small></h3>
  <p class="note">${esc(W.place)}の予報（3つの予報モデル）と、過去の東京・芝で「前日までに雨が降って当日は降らなかった日」の馬場の発表を並べたもの。${F?`予報の取得 ${new Date(F.fetchedAt).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}（1時間おきに取り直す）。`:''}</p>
  ${V.head?`<p class="lead" style="margin-bottom:10px"><b>${esc(V.head)}</b></p>`:''}
  <div class="grid2">
   <div class="box"><h4>予報</h4>${fcT}${strip}${split?'<p class="note" style="margin-bottom:0"><b>予報モデルの間で形が割れている。</b>雨が上がる時刻しだいで下の表の当てはまる行が変わる。</p>':''}</div>
   <div class="box"><h4>過去の東京・芝はどこまで戻ったか</h4>${P?`<div class="scroll"><table class="nar"><thead><tr><th>前日までに10mm以上・当日は降らず</th><th class="num">日数</th><th class="num">朝から良</th><th class="num">稍重→良</th><th class="num">戻らず</th></tr></thead><tbody>${grp}</tbody></table></div>
    <p class="note" style="margin-bottom:0">${esc(P.from.slice(0,4))}〜${esc(P.to.slice(0,4))}年の東京の芝 ${P.days}開催日から。「戻らず」は最終の芝のレースも良でなかった日。ジャパンカップは最終レース（15:40）。</p>`:'<p class="note">過去の降水量が取れていない。</p>'}${act}</div>
  </div>
  ${cmp?`<h5>雨上がりの「良」は乾いた「良」と違うか</h5>${cmp}`:''}
  <div class="grid2" style="margin-top:14px">
   <div class="box"><h4>本紙の見立て<span class="tag">推定</span></h4><p style="margin:0 0 8px">${esc(V.text||'')}</p><p style="margin:0">${esc(V.if||'')}</p></div>
   <div class="box"><h4>外国馬の馬場状態別の成績</h4>${hv}<p class="note" style="margin-bottom:0">JRA 発表の全成績から数えたもの。海外の馬場の呼び名は日本の 良／稍重／重／不良 と同じ物差しではない。</p></div>
  </div>
  <details><summary>当てはまった過去の日の一覧</summary>${lst}</details>
  <p class="note">降水量は再解析（ERA5）の府中の格子の値で、競馬場の雨量計の値ではない。夕立のような局地的な雨は外すことがある。季節で乾き方は違い（晩秋は日が短く乾きにくい）、標本は各 ${P?P.groups.map(g=>g.days).join('・'):'—'}日しかない。<b>目安であって予測ではない</b>。当日は JRA の馬場発表を確かめてください。</p>`;}
function foot(){const d=new Date(JC.builtAt);
  $('foot').innerHTML=`<ul>
  <li>外国馬のプロフィール・全成績・調教状況・関係者コメント・調教後の馬体重：<a href="${esc(JC.sources.foreign)}" target="_blank" rel="noopener">JRA「ジャパンカップ（GⅠ）外国馬情報」</a>および JRA ニュース。各馬の欄にリンク。</li>
  <li>出馬表と本紙の確率：中央競馬の本番モデル（<a href="jra.html">jra.html</a>）。過去の結果と血統の集計は手元の中央競馬データ（${esc(JC.data.from)}〜${esc(JC.data.to)}）。</li>
  <li>「本紙の考察」「本紙の見立て」は推定。馬券の買う・見送るを機械的に決める根拠にはしないでください。</li>
  <li>作成 ${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}（JRA の資料の取得 ${esc((JC.fetchedAt||'').slice(0,10))}）</li></ul>`;}

init();
