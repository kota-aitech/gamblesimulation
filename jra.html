<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中央競馬 出馬表と予想</title>
<style>
:root{
  --paper:#fbf8f1; --paper2:#f1ebdc; --band:#1a1512;
  --ink:#14100c; --sub:#6a6055; --faint:#9a9083;
  --rule:#2a2420; --rule2:#cfc6b4; --rule3:#e6dfd0;
  --red:#c0102a; --blue:#1b4f9c; --gold:#f0c24a; --green:#1d6b3f;
  --mincho:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP",serif;
  --gothic:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--gothic);font-size:12.5px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
.masthead{background:var(--band);color:#fdf9f0;padding:8px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.masthead .logo{font-family:var(--mincho);font-size:20px;font-weight:700;letter-spacing:.12em}
.masthead .logo em{font-style:normal;color:var(--gold)}
.masthead .tag{font-size:11px;color:#c8bfae}
.masthead nav{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.masthead nav a{color:#fdf9f0;text-decoration:none;border:1px solid #4a423a;border-radius:2px;padding:3px 10px;font-size:11px;white-space:nowrap}
.bar{display:flex;gap:6px;align-items:center;padding:6px 14px;border-bottom:1px solid var(--rule2);flex-wrap:wrap;background:var(--paper2)}
.bar button{background:#fff;border:1px solid var(--rule2);border-radius:2px;padding:4px 10px;font-size:12px;color:var(--sub)}
.bar button.on{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:700}
.bar .lab{color:var(--faint);font-size:11px;margin-right:2px}
#races{display:flex;gap:4px;flex-wrap:wrap;padding:6px 14px;border-bottom:2px solid var(--rule)}
.rbtn{border:1px solid var(--rule2);background:#fff;border-radius:2px;padding:3px 7px;font-size:11.5px;line-height:1.2;text-align:center;min-width:52px}
.rbtn small{display:block;color:var(--faint);font-size:10px}
.rbtn.on{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.rbtn.on small{color:#c8bfae}
.wrap{padding:10px 14px 40px}
.rhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--rule);padding-bottom:6px;margin-bottom:8px}
.rhead .rno{font-family:var(--mincho);font-size:22px;font-weight:700}
.rhead .rname{font-family:var(--mincho);font-size:18px;font-weight:700}
.rhead .grade{display:inline-block;background:var(--red);color:#fff;font-size:11px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.rhead .cond{color:var(--sub);font-size:12px}
.rhead .lvl{display:inline-block;padding:0 6px;font-size:10px;font-weight:700;color:#fff;background:#8b8578}
.rhead .lvl.mix{background:var(--green)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px;align-items:start}
.board{overflow-x:auto}
table.uma{border-collapse:collapse;width:100%;min-width:1100px;font-size:11.5px}
table.uma th{background:var(--band);color:#efe7d8;font-weight:600;font-size:10.5px;padding:3px 4px;border:1px solid #000;white-space:nowrap}
table.uma td{border:1px solid var(--rule2);padding:3px 4px;vertical-align:top}
table.uma tr.h{background:#fff}
table.uma tr.h:nth-child(even){background:#fdfbf6}
td.mk{font-family:var(--mincho);font-size:18px;font-weight:700;text-align:center;width:28px}
td.mk.m1{color:var(--red)}td.mk.m2{color:var(--blue)}
td.wk{text-align:center;width:34px;font-weight:700}
.num{display:inline-block;min-width:20px;padding:0 4px;text-align:center;font-weight:700;font-size:11px;border:1px solid var(--rule)}
td.hn{min-width:190px;max-width:230px}
.sire{font-size:10.5px;color:var(--sub)}
.hname{font-family:var(--mincho);font-size:14.5px;font-weight:700;white-space:nowrap}
.hsub{font-size:10.5px;color:var(--sub)}
.dam{font-size:10.5px;color:var(--sub)}
.jk{font-size:11.5px}
.jk b{font-family:var(--mincho)}
td.pr{width:84px;text-align:right;white-space:nowrap}
.pw{font-family:var(--mincho);font-size:15px;font-weight:700;color:var(--red)}
.p3{font-size:11px;color:var(--sub)}
.od{font-size:10.5px;color:var(--faint)}
td.run{width:150px;font-size:10.5px;line-height:1.3;color:var(--ink)}
td.run .l1{display:flex;justify-content:space-between}
td.run .pos{font-family:var(--mincho);font-size:15px;font-weight:700}
td.run .pos.p1{color:var(--red)}td.run .pos.p23{color:var(--blue)}
td.run .rn{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:140px}
td.run .s{color:var(--sub)}
td.run.none{color:var(--faint);text-align:center;vertical-align:middle}
.side h2{font-family:var(--mincho);font-size:14px;margin:12px 0 6px;border-left:5px solid var(--red);padding-left:8px}
.side h2:first-child{margin-top:0}
.rec{border:1px solid var(--rule2);background:#fff;padding:7px 10px;margin:4px 0;font-size:12px}
.rec b{font-family:var(--mincho);font-size:13.5px}
.rec .s{color:var(--sub);font-size:11px}
.chip{display:inline-block;border:1px solid var(--rule2);background:#fff;padding:1px 7px;margin:2px 3px 2px 0;font-size:11.5px}
.chip b{font-family:var(--mincho)}
.chip i{font-style:normal;color:var(--sub);margin-left:4px;font-size:10.5px}
.warn{margin:6px 0;padding:6px 10px;background:#fff4f2;border-left:4px solid var(--red);font-size:11px;line-height:1.6}
ul.points{margin:4px 0 0;padding-left:18px;font-size:12px}
ul.points li{margin:3px 0}
.memo{padding:5px 0;border-bottom:1px dotted var(--rule3);font-size:11px;color:var(--sub)}
.memo b{color:var(--ink);font-family:var(--mincho)}
.cb{display:grid;grid-template-columns:34px 1fr 40px;gap:6px;align-items:center;font-size:10.5px;margin:1px 0}
.cb .b2{height:7px;background:var(--rule3);position:relative;overflow:hidden}
.cb .b2 i{position:absolute;top:0;bottom:0;background:var(--red)}
.cb .b2 i.neg{background:var(--blue)}
.cb .v{text-align:right;color:var(--sub)}
.src{color:var(--faint);font-size:10.5px;margin-top:10px;line-height:1.6}
footer{border-top:2px solid var(--rule);background:var(--paper2);padding:10px 14px 30px;color:var(--sub);font-size:11px;line-height:1.7}
@media (max-width:900px){
  .cols{grid-template-columns:1fr}
  .masthead .tag{display:none}
  /* スマホ：1頭＝1セル。上段に印・枠・馬番・馬名・本紙、下段に前5走を横スクロール */
  /* table-layout:fixed にしないと、横スクロールする前5走の幅ぶん表が広がって本紙の列が画面外に出る */
  table.uma{min-width:0;width:100%;table-layout:fixed}
  table.uma thead{display:none}
  td.mob{padding:4px 6px}
  .mtop{display:grid;grid-template-columns:26px 30px minmax(0,1fr) 78px;gap:4px 6px;align-items:start}
  .mtop .mk{font-family:var(--mincho);font-size:18px;font-weight:700;text-align:center}
  .mtop .mk.m1{color:var(--red)}.mtop .mk.m2{color:var(--blue)}
  .mtop>div{min-width:0}
  .mtop .hname{white-space:normal;font-size:14px}
  .mtop .pr{grid-column:4;text-align:right;white-space:nowrap}
  .runs{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;padding:4px 0 2px;margin-top:4px}
  .runs .run{flex:none;width:150px;border:1px solid var(--rule3);padding:3px 4px;scroll-snap-align:start;font-size:10.5px;line-height:1.3}
  .runs .run .l1{display:flex;justify-content:space-between}
  .runs .run .pos{font-family:var(--mincho);font-size:15px;font-weight:700}
  .runs .run .pos.p1{color:var(--red)}.runs .run .pos.p23{color:var(--blue)}
  .runs .run .rn{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:140px}
  .runs .run .s{color:var(--sub)}
  .runs .run.none{color:var(--faint);text-align:center;padding-top:28px}
  .wrap{padding:8px 8px 40px}
}
</style>
</head>

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const WAKU=[['#fff','#14100c'],['#ffffff','#14100c'],['#1b1b1b','#ffffff'],['#d0202f','#ffffff'],['#2f5fc0','#ffffff'],['#f2d33c','#14100c'],['#2e8b4f','#ffffff'],['#e8802a','#ffffff'],['#ef9bb8','#14100c']];
const MARKC={'◎':'m1','○':'m2'};
const pct=(v,d=1)=>v==null?'—':(v*100).toFixed(d)+'%';
const fmtD=d=>d?`${+d.slice(5,7)}/${+d.slice(8,10)}`:'';
/* 前走の日付：開催と年が違えば「24.9/7」のように年を付ける（データの期間より前の走りが混ざるため） */
const fmtPD=(d,base)=>d?(d.slice(0,4)===(base||'').slice(0,4)?fmtD(d):`${d.slice(2,4)}.${fmtD(d)}`):'';
const isMobile=()=>window.matchMedia('(max-width:900px)').matches;
const fmtT=t=>{if(t==null)return '';if(typeof t==='string')return t;const m=Math.floor(t/60),s=t-m*60;return (m?m+':':'')+s.toFixed(1).padStart(m?4:1,'0');};
const CLS=['','未勝利','1勝','2勝','3勝','OP','G3','G2','G1'];
const state={di:0,vi:0,ri:0};
function pick(){const q=new URLSearchParams(location.search);const days=NKJRA.days;if(!days.length)return;
  let di=Math.max(0,days.findIndex(d=>d.date===q.get('date')));const V=days[di].venues;let vi=Math.max(0,V.findIndex(v=>v.venue===q.get('venue')));
  let ri=q.get('r')?V[vi].races.findIndex(r=>r.r===+q.get('r')):Math.max(0,V[vi].races.length-2);if(ri<0)ri=0;Object.assign(state,{di,vi,ri});}
function load(di,vi,ri){Object.assign(state,{di,vi,ri});render();try{history.replaceState(null,'',`?date=${NKJRA.days[di].date}&venue=${NKJRA.days[di].venues[vi].venue}&r=${NKJRA.days[di].venues[vi].races[ri].r}`);}catch(e){}}
function runInner(p,base){const pc=p.pos===1?'p1':p.pos<=3?'p23':'';
  return `<div class="l1"><span><span class="pos ${pc}">${p.pos}</span>着 <span class="s">${fmtPD(p.date,base)} ${esc(p.venue||'')}</span></span><span class="s">${p.n||''}頭${p.no?' '+p.no+'番':''}</span></div>
    <div class="rn" title="${esc(p.name||'')}">${esc(p.name||'')}<span class="s"> ${CLS[p.cls]||''}</span></div>
    <div>${esc(p.surface||'')}${p.dist||''} ${fmtT(p.time)} <span class="s">${esc(p.baba||'')}</span>${p.pop?` <span class="s">${p.pop}人気</span>`:''}</div>
    <div class="s">${esc((p.jockey||'').replace(/\s/g,''))} ${p.kin||''}${p.bw?`　${p.bw}(${p.bwDiff>0?'+':''}${p.bwDiff??''})`:''}</div>
    <div class="s">${p.pass||''}${p.agari?`　上り${p.agari}`:''}${p.margin?`　${esc(p.winner||'')}${p.pos>1?'に'+esc(p.margin):''}`:''}</div>`;}
const runCell=(p,base)=>p?`<td class="run">${runInner(p,base)}</td>`:'<td class="run none">—</td>';
const runDiv=(p,base)=>p?`<div class="run">${runInner(p,base)}</div>`:'<div class="run none">—</div>';
function render(){const day=NKJRA.days[state.di];if(!day){$('rhead').innerHTML='出馬表のデータがありません';return;}
  const V=day.venues[state.vi],r=V.races[state.ri];
  $('dayTabs').innerHTML=NKJRA.days.map((d,i)=>`<button class="${i===state.di?'on':''}" data-i="${i}">${fmtD(d.date)}</button>`).join('');
  $('venueTabs').innerHTML=day.venues.map((v,i)=>`<button class="${i===state.vi?'on':''}" data-i="${i}">${esc(v.venue)}</button>`).join('');
  $('races').innerHTML=V.races.map((x,i)=>`<button class="rbtn ${i===state.ri?'on':''}" data-i="${i}">${x.r}R<small>${x.start||''} ${esc(x.surface)}${x.dist}</small></button>`).join('');
  document.querySelectorAll('#dayTabs button').forEach(b=>b.onclick=()=>load(+b.dataset.i,0,0));
  document.querySelectorAll('#venueTabs button').forEach(b=>b.onclick=()=>load(state.di,+b.dataset.i,0));
  document.querySelectorAll('#races .rbtn').forEach(b=>b.onclick=()=>load(state.di,state.vi,+b.dataset.i));
  $('rhead').innerHTML=`<span class="rno">${r.r}R</span><span class="rname">${esc(r.name)}${r.grade?`<span class="grade">${esc(r.grade)}</span>`:''}</span><span class="cond">${fmtD(day.date)} ${esc(V.venue)}　${esc(r.surface)}${r.turn?'・'+esc(r.turn):''}${r.inner?'・'+esc(r.inner):''} ${r.dist}m　${r.start?r.start+'発走　':''}${esc(r.cond||'')}　${r.n}頭${r.weather?`　天候${esc(r.weather)}`:''}${r.baba?`／馬場${esc(r.baba)}`:''}</span><span class="lvl ${r.level}">${r.level==='mix'?'人気と合成':'基礎モデル'}</span>${r.gates===false?'<span class="lvl" style="background:var(--red)">枠順確定前</span>':''}<span class="cond">自信度 ${(r.conf*100).toFixed(0)}</span>`;
  const hs=r.horses.slice().sort((a,b)=>a.no-b.no);
  const nameBlock=h=>`<div class="sire">${esc(h.sire||'')}</div><div class="hname">${esc(h.name)}</div><div class="hsub">${esc(h.sexAge||'')} ${esc(h.color||'')}　${h.kin||''}kg${h.bw?`　<b style="color:${h.bwGoodN>=2&&Math.abs(h.bw-h.bwGood)>=12?'var(--red)':'inherit'}">${h.bw}</b>(${h.bwDiff>0?'+':''}${h.bwDiff??''})`:''}${h.bwGoodN?`　<span title="3着内だったときの平均馬体重（${h.bwGoodN}走）">好走${h.bwGood}</span>`:(h.bwPast?`　<span title="近走の平均">普段${h.bwPast}</span>`:'')}</div><div class="dam">${esc(h.dam||'')}${h.damsire?`（${esc(h.damsire)}）`:''}</div><div class="jk"><span class="s" title="近走の脚質の内訳 ${esc(Object.entries(h.styleHist||{}).filter(([,v])=>v).map(([k,v])=>k+v).join(' '))}">${esc(h.style||'')}${h.styleHist?`<small style="color:var(--faint)">${Object.entries(h.styleHist).filter(([,v])=>v).map(([k,v])=>k[0]+v).join('')}</small>`:''}</span> <b>${esc((h.jockey||'').replace(/\s/g,''))}</b> <span class="hsub">${esc(h.stable||'')}${esc((h.trainer||'').replace(/\s/g,''))}</span></div>${h.owner?`<div class="hsub" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(h.owner)}">${esc(h.owner)}</div>`:''}`;
  const priceBlock=h=>`<div class="pw">${pct(h.p1,1)}</div><div class="p3">3着内 ${pct(h.top3,0)}</div>${h.odds?`<div class="od">${h.odds}倍 ${h.pop}人気</div>`:''}`;
  if(isMobile()){
    /* スマホ：1頭＝1セル（tr の直下に div は置けないので td の中に組む） */
    $('ubody').innerHTML=hs.map(h=>{const w=WAKU[h.waku]||WAKU[0];
      return `<tr class="h"><td class="mob" colspan="10"><div class="mtop"><div class="mk ${MARKC[h.mark]||''}">${h.mark||'　'}</div><div><span class="num" style="background:${w[0]};color:${w[1]}">${h.waku||''}</span><div style="text-align:center;font-weight:700">${h.no}</div></div><div>${nameBlock(h)}</div><div class="pr">${priceBlock(h)}</div></div><div class="runs">${[0,1,2,3,4].map(i=>runDiv(h.past[i],day.date)).join('')}</div></td></tr>`;}).join('');
  }else{
    $('ubody').innerHTML=hs.map(h=>{const w=WAKU[h.waku]||WAKU[0];
      return `<tr class="h"><td class="mk ${MARKC[h.mark]||''}">${h.mark}</td><td class="wk"><span class="num" style="background:${w[0]};color:${w[1]}">${h.waku||''}</span></td><td class="wk">${h.no}</td><td class="hn">${nameBlock(h)}</td><td class="pr">${priceBlock(h)}</td>${[0,1,2,3,4].map(i=>runCell(h.past[i],day.date)).join('')}</tr>`;}).join('');
  }
  const bt=NKJRA.meta.backtest,T=bt?.table||{};
  const ref=n=>{const t=T[n];return t?`<div class="s">検証 ${bt.races.toLocaleString()}R：的中 ${t.hit}%・回収 <b>${t.roi}%</b></div>`:'<div class="s">検証データなし</div>';};
  const chips=(list,n)=>list.length?list.slice(0,n).map(x=>`<span class="chip"><b>${x.k}</b><i>${pct(x.p,1)}</i></span>`).join(''):'<span class="s">枠順確定後に出す</span>';
  $('ai').innerHTML=`<div class="rec"><div>馬連 確率上位</div>${chips(r.umaren,5)}${ref('AI 馬連 上位3点').replace('検証','上位3点 検証')}</div>
    <div class="rec"><div>三連複 確率上位</div>${chips(r.sanpuku,5)}${ref('AI 三連複 上位3点').replace('検証','上位3点 検証')}</div>
    <div class="rec"><div>三連単 確率上位</div>${chips(r.santan,6)}${ref('AI 三連単 上位5点').replace('検証','上位5点 検証')}</div>
    <div class="rec"><div>馬単・ワイド</div>${chips(r.umatan,3)}<span class="s">｜ワイド</span> ${chips(r.wide,3)}</div>`;
  const top=r.horses.slice().sort((a,b)=>b.p1-a.p1);
  const g=r.gates!==false;
  $('box').innerHTML=`<div class="rec">◎ <b>${g?top[0].no+' ':''}${esc(top[0].name)}</b> 単勝${top[0].odds?` ${top[0].odds}倍`:''}${ref('◎単勝')}${ref('◎複勝').replace('検証','複勝 検証')}</div>
    <div class="rec">本命3頭BOX <b>${g?r.box3.join('-'):top.slice(0,3).map(h=>esc(h.name)).join('・')}</b>${ref('3頭BOX三連複').replace('検証','三連複 検証')}${ref('3頭BOX馬連').replace('検証','馬連 検証')}</div>
    <div class="rec">本命4頭BOX <b>${g?r.box4.join('-'):top.slice(0,4).map(h=>esc(h.name)).join('・')}</b>${ref('4頭BOX三連複').replace('検証','三連複 検証')}${ref('4頭BOX馬連').replace('検証','馬連 検証')}</div>
    <div class="rec">◎○ 馬連 <b>${g?[top[0].no,top[1].no].sort((a,b)=>a-b).join('-'):esc(top[0].name)+'・'+esc(top[1].name)}</b>${ref('◎○馬連')}</div>
    <div class="warn">${bt?`検証（${bt.from}〜${bt.to}）ではどの買い方も回収率100%に届いていない。1番人気の単勝は ${T['［基準］1番人気の単勝']?.roi??'—'}%。${bt.note||''}`:'検証データがまだ無い。'} 買う・見送るの機械的な根拠にはせず、金額の強弱の参考まで。</div>`;
  $('points').innerHTML=r.points.map(p=>`<li>${esc(p)}</li>`).join('');
  const G=NKJRA.meta.groups||[];
  $('memo').innerHTML=top.map(h=>`<div class="memo"><b>${h.mark||'　'} ${h.no} ${esc(h.name)}</b>（${pct(h.p1,1)}）　${h.note.map(esc).join('　')}<div style="margin-top:3px;max-width:520px">${G.map((g,i)=>[g,h.c[i]]).filter(([,v])=>Math.abs(v)>=0.03).map(([g,v])=>`<div class="cb"><span>${g}</span><div class="b2"><i class="${v<0?'neg':''}" style="left:${v<0?50-Math.min(50,Math.abs(v)/1.2*50):50}%;width:${Math.min(50,Math.abs(v)/1.2*50)}%"></i></div><span class="v">${v>=0?'+':''}${v.toFixed(2)}</span></div>`).join('')}</div></div>`).join('');
  const m=NKJRA.meta;
  $('src').textContent=`出馬表・結果・払戻は Yahoo!スポーツ競馬と netkeiba の公開ページ。指数は ${m.index?.from}〜${m.index?.to} の ${m.index?.races?.toLocaleString()}レース。モデルは条件付きロジット（学習 ${m.model?.train?.toLocaleString()}R／検証 ${m.model?.test?.toLocaleString()}R、1着的中 ${m.model?.base?pct(m.model.base.hit1,1):'—'}、上位3頭に勝ち馬 ${m.model?.base?pct(m.model.base.in3,1):'—'}${m.model?.popOnly?`。人気だけなら ${pct(m.model.popOnly.hit1,1)}／${pct(m.model.popOnly.in3,1)}`:''}）。生成 ${m.built?new Date(m.built).toLocaleString('ja-JP',{hour12:false}):''}`;
  document.title=`中央競馬 ${fmtD(day.date)} ${V.venue}${r.r}R ${r.name}`;
}
$('tag').textContent='Yahoo!スポーツ・netkeiba の公開ページから自動生成';
$('foot').innerHTML='予想は条件付きロジット（Plackett–Luce）。単勝オッズが取れているレースは人気と合成している。前5走は結果データから馬IDで組み立てているので、データの期間より前の走りは載らない。';
pick();render();
let mob=isMobile();window.addEventListener('resize',()=>{if(isMobile()!==mob){mob=isMobile();render();}});   /* 幅をまたいだら組み直す */
</script>
</body>
</html>
