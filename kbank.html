<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>競輪場ガイド</title>
<style>
:root{
  --paper:#fbf8f1; --paper2:#f1ebdc; --band:#1a1512;
  --ink:#14100c; --sub:#6a6055; --faint:#9a9083;
  --rule:#2a2420; --rule2:#cfc6b4; --rule3:#e6dfd0;
  --red:#c0102a; --blue:#1b4f9c; --gold:#f0c24a; --green:#1d6b3f;
  --mincho:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP",serif;
  --gothic:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--gothic);font-size:12.5px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%;overflow-x:hidden}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
.masthead{background:var(--band);color:#fdf9f0;padding:8px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.masthead .logo{font-family:var(--mincho);font-size:20px;font-weight:700;letter-spacing:.12em}
.masthead .logo em{font-style:normal;color:var(--gold)}
.masthead nav{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.masthead nav a{color:#fdf9f0;text-decoration:none;border:1px solid #4a423a;border-radius:2px;padding:3px 8px;font-size:11px;white-space:nowrap}
.lead{padding:10px 14px;border-bottom:1px solid var(--rule2);font-size:12px;line-height:1.7}
.bar{display:flex;gap:6px 14px;align-items:center;padding:7px 14px;border-bottom:2px solid var(--rule);flex-wrap:wrap;background:var(--paper2)}
.grp{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.grp .lab{color:var(--faint);font-size:11px;margin-right:2px}
.bar button{background:#fff;border:1px solid var(--rule2);border-radius:2px;padding:3px 9px;font-size:12px;color:var(--sub)}
.bar button.on{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:700}
.wrap{padding:10px 14px 40px}
h2{font-family:var(--mincho);font-size:15px;margin:14px 0 6px;border-left:5px solid var(--red);padding-left:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}
.card{border:1px solid var(--rule2);background:#fff;padding:9px 11px}
.card .hd{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--rule3);padding-bottom:4px;margin-bottom:6px}
.card .nm{font-family:var(--mincho);font-size:18px;font-weight:700}
.card .pf{color:var(--sub);font-size:11px}
.tag{display:inline-block;font-size:10.5px;padding:0 5px;border-radius:2px;color:#fff;background:#8b8578;white-space:nowrap}
.tag.dome{background:var(--green)}.tag.wind{background:var(--blue)}.tag.b333{background:#b0662a}.tag.b500{background:#5a4a8a}.tag.night{background:#2a2a4a}
.kv{display:grid;grid-template-columns:78px 1fr 64px;gap:2px 6px;align-items:center;font-size:11.5px}
.kv .k{color:var(--sub)}
.kv .v{text-align:right;white-space:nowrap}
.bar2{height:8px;background:var(--rule3);position:relative}
.bar2 i{position:absolute;left:0;top:0;bottom:0;background:var(--blue)}
.bar2 i.r{background:var(--red)}
.bar2 s{position:absolute;top:-2px;bottom:-2px;width:1px;background:var(--rule)}
.kim{display:flex;height:14px;margin:3px 0 1px;border:1px solid var(--rule3)}
.kim span{display:block;height:100%;font-size:9.5px;color:#fff;text-align:center;line-height:14px;overflow:hidden;white-space:nowrap}
.kim .k0{background:var(--red)}.kim .k1{background:#d99a2b}.kim .k2{background:var(--blue)}.kim .k3{background:#6a8fc4}
.sec{margin-top:6px;padding-top:5px;border-top:1px dotted var(--rule3)}
.sec b.t{font-size:11px;color:var(--sub);font-weight:600}
ul.sum{margin:4px 0 0;padding-left:16px;font-size:12px}
ul.sum li{margin:2px 0}
.feat{font-size:11px;color:var(--sub);margin-top:4px}
.feat q{quotes:"「" "」"}
table.mini{border-collapse:collapse;font-size:11px;background:#fff;width:100%}
table.mini th,table.mini td{border:1px solid var(--rule2);padding:2px 5px;text-align:right}
table.mini th{background:var(--paper2);font-weight:600;text-align:center}
table.mini td.l{text-align:left}
.go{margin-top:6px;font-size:11px}
.go a{color:var(--blue)}
.note{font-size:11px;color:var(--sub);line-height:1.7}
footer{border-top:2px solid var(--rule);background:var(--paper2);padding:10px 14px 30px;color:var(--sub);font-size:11px;line-height:1.7}
@media (max-width:640px){.grid{grid-template-columns:1fr}.wrap{padding:8px 8px 40px}.bar{padding:7px 8px}}
</style>
</head>

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pc=(v,d=0)=>v==null?'—':(v*100).toFixed(d)+'%';
const V=Object.values(NKKV.venues||{}),A=NKKV.all||{},RK=NKKV.ranks||{};
const SORTS=[['code','地域順'],['wind','風が強い順'],['straight','直線が長い順'],['cant','カントがきつい順'],['nige','逃げが多い順'],['sashi','差しが多い順'],['e3Med','荒れる順'],['home','地元が強い順']];
const BANKF=[['all','全部'],['333','333'],['400','400'],['500','500']];
let F={sort:'code',bank:'all'};
try{Object.assign(F,JSON.parse(localStorage.getItem('kbankF')||'{}'));}catch(e){}
const btns=(el,list,key)=>{$(el).innerHTML=list.map(([k,l])=>`<button data-k="${k}" class="${F[key]===k?'on':''}">${l}</button>`).join('');$(el).querySelectorAll('button').forEach(b=>b.onclick=()=>{F[key]=b.dataset.k;try{localStorage.setItem('kbankF',JSON.stringify(F));}catch(e){}render();});};
const mx=k=>Math.max(...V.map(o=>k(o)||0));
const MAXS=mx(o=>o.bank.straight),MINS=Math.min(...V.map(o=>o.bank.straight||99)),MAXC=mx(o=>o.bank.cant),MINC=Math.min(...V.map(o=>o.bank.cant||99)),MAXW=mx(o=>o.wind?.mean);
const bar=(v,lo,hi,red)=>v==null?'':`<div class="bar2"><i class="${red?'r':''}" style="width:${Math.max(3,Math.min(100,(v-lo)/(hi-lo)*100)).toFixed(0)}%"></i></div>`;
const rk=(o,k)=>o.rank&&o.rank[k]?`<span style="color:var(--faint);font-size:10px">${o.rank[k]}位</span>`:'';
function card(o){
  const b=o.bank,tags=[];
  if(o.indoor)tags.push('<span class="tag dome">屋内（ドーム）</span>');
  if(o.rank?.wind&&o.rank.wind<=6)tags.push('<span class="tag wind">風が強い</span>');
  if(b.cls===333)tags.push('<span class="tag b333">333バンク</span>');if(b.cls===500)tags.push('<span class="tag b500">500バンク</span>');
  if(o.night>=0.5)tags.push(`<span class="tag night">${o.midnight>=0.3?'ミッドナイト':'ナイター'}多め</span>`);
  const kim=o.kim&&o.kimN>=20?`<div class="kim">${o.kim.slice(0,3).map((v,i)=>`<span class="k${i}" style="width:${(v*100).toFixed(1)}%" title="${['逃','捲','差'][i]} ${pc(v)}">${v>=0.12?['逃','捲','差'][i]+' '+pc(v):''}</span>`).join('')}</div><div class="note">全体 逃${pc(A.kim?.[0])}・捲${pc(A.kim?.[1])}・差${pc(A.kim?.[2])}（${o.kimN}R）</div>`:'';
  return `<div class="card">
    <div class="hd"><span class="nm">${esc(o.name)}</span><span class="pf">${esc(o.pref)}・${esc(o.region||'')}</span>${tags.join(' ')}</div>
    <div class="kv">
      <span class="k">周長</span><span></span><span class="v"><b>${b.len??'—'}</b>m</span>
      <span class="k">見なし直線</span>${bar(b.straight,MINS-2,MAXS)}<span class="v">${b.straight??'—'}m ${rk(o,'straight')}</span>
      <span class="k">カント</span>${bar(b.cant,MINC-1,MAXC,true)}<span class="v">${b.cant??'—'}° ${rk(o,'cant')}</span>
      ${b.width?`<span class="k">幅員</span><span class="note">ホーム ${b.width.home??'—'}m・バック ${b.width.back??'—'}m</span><span></span>`:''}
      <span class="k">風（実測）</span>${o.indoor?'<span class="note">屋内のため発表なし</span><span></span>':o.wind?`${bar(o.wind.mean,0,MAXW)}<span class="v">平均${o.wind.mean.toFixed(2)}m ${rk(o,'wind')}</span>`:'<span class="note">—</span><span></span>'}
      ${o.wind&&!o.indoor?`<span class="k"></span><span class="note">最大 ${o.wind.max}m・3m以上 ${pc(o.wind.p3)}・雨 ${pc(o.rain)}</span><span></span>`:''}
    </div>
    ${o.races?`<div class="sec"><b class="t">決まり手（1着）</b>${kim}</div>
    <div class="sec"><table class="mini"><tr><th>ライン</th><th>先頭</th><th>番手</th><th>3番手〜</th><th>単騎</th></tr>
      <tr><td class="l">1着率</td>${o.slot.map(s=>`<td>${s.n>=20?pc(s.win,1):'—'}</td>`).join('')}</tr>
      <tr><td class="l" style="color:var(--faint)">全体</td>${(A.slot||[]).map(v=>`<td style="color:var(--faint)">${pc(v,1)}</td>`).join('')}</tr></table>
      <div class="note" style="margin-top:3px">ライン決着 ${pc(o.lineOneTwo)}（全体 ${pc(A.lineOneTwo)}）・人気1位の1着 ${pc(o.fav)}（全体 ${pc(A.fav)}）・3連単の中央値 ${o.e3Med?o.e3Med.toLocaleString()+'円':'—'}・万車券 ${pc(o.man)}${o.home?`・地元 ${o.home.mult}倍（${o.home.runs}走）`:''}</div></div>`:''}
    ${o.summary&&o.summary.length?`<div class="sec"><b class="t">このバンクの特徴（実測と形から）</b><ul class="sum">${o.summary.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div>`:''}
    ${o.feature&&o.feature.length?`<div class="feat">公式の紹介（Kドリームス）：<q>${o.feature.map(esc).join('／')}</q></div>`:''}
    <div class="note">${o.races?`実測 ${o.races.toLocaleString()}R（${o.days}日・${o.from?.slice(0,4)}/${+o.from?.slice(4,6)}〜${+o.to?.slice(4,6)}/${+o.to?.slice(6,8)}）`:''}</div>
    <div class="go"><a href="keirin.html?v=${esc(o.slug)}">${esc(o.name)}の出走表と予想 →</a></div></div>`;
}
function render(){
  btns('fSort',SORTS,'sort');btns('fBank',BANKF,'bank');
  const key={code:o=>o.code,wind:o=>o.indoor?-1:o.wind?.mean??-2,straight:o=>o.bank.straight??-1,cant:o=>o.bank.cant??-1,nige:o=>o.kimN>=20?o.kim[0]:-1,sashi:o=>o.kimN>=20?o.kim[2]+o.kim[3]:-1,e3Med:o=>o.e3Med??-1,home:o=>o.home?.mult??-1}[F.sort];
  let xs=V.filter(o=>F.bank==='all'||String(o.bank.cls)===F.bank);
  xs.sort(F.sort==='code'?(a,b)=>a.code.localeCompare(b.code):(a,b)=>key(b)-key(a));
  $('listTitle').textContent=`${F.bank==='all'?'全':F.bank+'バンクの '}${xs.length}場`;
  $('grid').innerHTML=xs.map(card).join('');
  const W=NKKV.windEffect||{};
  $('wind').innerHTML=Object.keys(W).length?`<table class="mini" style="max-width:640px"><tr><th>風速</th><th>R</th><th>逃</th><th>捲</th><th>差</th><th>ラインの先頭の1着率</th></tr>${Object.entries(W).map(([k,x])=>`<tr><td class="l">${esc(k)}</td><td>${x.races.toLocaleString()}</td>${x.kim.slice(0,3).map(v=>`<td>${pc(v)}</td>`).join('')}<td>${pc(x.head,1)}</td></tr>`).join('')}</table>
    <p class="note">発表された風速（屋内の前橋・小倉を除く）ごとの決まり手。風速は各レースの結果に出る値で、向きは発表されていない。3m以上のレースは数が少ないので、傾向の目安として見てほしい。</p>`:'';
}
$('lead').innerHTML=`全43場のバンクの形（周長・見なし直線・カント・幅員）と、結果の実測（風速・雨・決まり手・ラインの位置別の1着率・ライン決着・荒れ方・地元の強さ）を1枚にまとめた。
  <b>屋内（ドーム）</b>は「天候・風速の発表が1件も無い場」をデータから判定している。「風が強い」「直線が長い」などの一言は、全場の中での順位から自動で作っている（手書きではない）。`;
$('foot').innerHTML=`バンクの形と「公式の紹介」は楽天Kドリームスの場のページ。実測は ${NKKV.from?`${NKKV.from.slice(0,4)}/${+NKKV.from.slice(4,6)}/${+NKKV.from.slice(6,8)}〜${NKKV.to.slice(4,6)}/${+NKKV.to.slice(6,8)}`:''} の ${(NKKV.races||0).toLocaleString()}レース（取り込みを遡るにつれ増える）。データ時点 ${NKKV.built?new Date(NKKV.built).toLocaleString('ja-JP',{hour12:false}):''}`;
render();
