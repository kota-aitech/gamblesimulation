<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>全競技の段位と期待値</title>
<style>
:root{
  --paper:#fbf8f1; --paper2:#f1ebdc; --band:#1a1512;
  --ink:#14100c; --sub:#6a6055; --faint:#9a9083;
  --rule:#2a2420; --rule2:#cfc6b4; --rule3:#e6dfd0;
  --red:#c0102a; --blue:#1b4f9c; --gold:#f0c24a; --green:#1d6b3f;
  --mincho:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP",serif;
  --gothic:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--gothic);font-size:12.5px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%;overflow-x:hidden}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
.masthead{background:var(--band);color:#fdf9f0;padding:8px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.masthead .logo{font-family:var(--mincho);font-size:20px;font-weight:700;letter-spacing:.12em}
.masthead .logo em{font-style:normal;color:var(--gold)}
.masthead nav{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.masthead nav a{color:#fdf9f0;text-decoration:none;border:1px solid #4a423a;border-radius:2px;padding:3px 8px;font-size:11px;white-space:nowrap}
.lead{padding:10px 14px;border-bottom:1px solid var(--rule2);font-size:12px;line-height:1.7}
.warn{margin:6px 0 0;padding:6px 10px;background:#fff4f2;border-left:4px solid var(--red);font-size:11.5px;line-height:1.6}
.bar{display:flex;gap:6px 14px;align-items:center;padding:7px 14px;border-bottom:1px solid var(--rule2);flex-wrap:wrap;background:var(--paper2)}
.grp{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.grp .lab{color:var(--faint);font-size:11px;margin-right:2px}
.bar button{background:#fff;border:1px solid var(--rule2);border-radius:2px;padding:3px 9px;font-size:12px;color:var(--sub)}
.bar button.on{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:700}
.bar label{font-size:12px;color:var(--sub);display:flex;gap:4px;align-items:center}
.sum{display:flex;gap:8px;flex-wrap:wrap;padding:8px 14px}
.sbox{border:1px solid var(--rule2);background:#fff;padding:5px 9px;font-size:11.5px;min-width:150px}
.sbox b{font-family:var(--mincho);font-size:13.5px}
.sbox .g{display:inline-block;margin-right:6px}
.wrap{padding:6px 14px 40px}
table.list{border-collapse:collapse;width:100%;background:#fff;font-size:12px}
table.list th{background:var(--band);color:#efe7d8;font-weight:600;font-size:11px;padding:4px 6px;border:1px solid #000;white-space:nowrap;text-align:left}
table.list td{border:1px solid var(--rule2);padding:4px 6px;vertical-align:middle}
table.list tr.done td{background:#f4f1ea;color:var(--faint)}
.gd{display:inline-block;width:26px;height:26px;line-height:26px;text-align:center;font-family:var(--mincho);font-weight:700;font-size:15px;border:1px solid var(--rule);background:#fff}
.gd.S{background:var(--red);color:#fff;border-color:var(--red)}
.gd.A{background:#e8a33c;color:#fff;border-color:#c98a26}
.gd.B{background:#fff;color:var(--blue);border-color:var(--blue)}
.gd.C{color:var(--faint);border-color:var(--rule2)}
.gd.none{color:var(--faint);border-style:dashed;font-size:11px}
.sp{display:inline-block;font-size:10.5px;padding:1px 5px;border-radius:2px;color:#fff;white-space:nowrap}
.sp.nankan{background:#7a5a2b}.sp.jra{background:var(--green)}.sp.banei{background:#8a5a2b}.sp.boat{background:var(--blue)}.sp.keirin{background:var(--red)}
.vn{font-family:var(--mincho);font-weight:700;font-size:14px}
.cls{color:var(--sub);font-size:11px}
.tm{font-weight:700;white-space:nowrap}
.tm.soon{color:var(--red)}
.tm small{display:block;font-weight:400;font-size:10.5px;color:var(--sub)}
.tm.soon small{color:var(--red)}
.fav b{font-family:var(--mincho)}
.fav .p{color:var(--red);font-weight:700;margin-left:4px}
.ev b{font-family:var(--mincho);font-size:15px}
.ev .k{font-family:var(--mincho);font-weight:700}
.ev .s{color:var(--sub);font-size:10.5px}
.conf{min-width:70px}
.cbar{height:6px;background:var(--rule3);margin-top:2px;position:relative}
.cbar i{position:absolute;left:0;top:0;bottom:0;background:var(--red)}
.go a{display:inline-block;border:1px solid var(--rule2);padding:2px 8px;font-size:11px;text-decoration:none;color:var(--sub);background:#fff;white-space:nowrap}
.res{color:var(--blue);font-size:11px}
.notes{margin-top:14px;font-size:11.5px;color:var(--sub);line-height:1.8}
.notes h2{font-family:var(--mincho);font-size:14px;color:var(--ink);border-left:5px solid var(--red);padding-left:8px;margin:14px 0 6px}
table.mini{border-collapse:collapse;font-size:11px;background:#fff}
table.mini th,table.mini td{border:1px solid var(--rule2);padding:2px 6px;text-align:right}
table.mini th{background:var(--paper2);font-weight:600;text-align:center}
table.mini td.l{text-align:left}
.empty{padding:24px 0;color:var(--sub)}
footer{border-top:2px solid var(--rule);background:var(--paper2);padding:10px 14px 30px;color:var(--sub);font-size:11px;line-height:1.7}
@media (max-width:760px){
  table.list thead{display:none}
  table.list,table.list tbody,table.list tr,table.list td{display:block;width:100%}
  table.list tr{border:1px solid var(--rule2);margin-bottom:6px;background:#fff;display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:2px 8px;padding:6px}
  table.list td{border:0;padding:0}
  table.list td.c-gd{grid-row:1/span 3}
  table.list td.c-ev,table.list td.c-fav{grid-column:2/4}
  table.list td.c-conf{display:none}
  table.list td.c-go{grid-column:2/4}
  .wrap{padding:6px 8px 40px}
  .bar{padding:7px 8px}
}
</style>
</head>

  else if(F.sort==='conf')rs.sort((a,b)=>(b.conf??-1)-(a.conf??-1));
  else rs.sort((a,b)=>(a.close||'').localeCompare(b.close||''));
  if(!rs.length){$('list').innerHTML=`<div class="empty">条件に合うレースがありません。${F.grade!=='all'?'段位を「全部」にするか、':''}「締切済みも出す」を試してください。</div>`;}
  else $('list').innerHTML=`<table class="list"><thead><tr><th>段位</th><th>競技・場</th><th>締切</th><th>本命</th><th>期待値のいちばん高い買い目</th><th>自信度</th><th></th></tr></thead><tbody>${rs.map(r=>{
    const m=minsLeft(r),done=m!=null&&m<0,soon=m!=null&&m>=0&&m<=10;
    const b=r.best;
    return `<tr class="${done?'done':''}">
      <td class="c-gd"><span class="gd ${r.grade||'none'}">${r.grade||'—'}</span></td>
      <td class="c-vn"><span class="sp ${r.sport}">${SPN[r.sport]}</span> <span class="vn">${esc(r.venue)} ${r.r}R</span><div class="cls">${esc(r.cls||'')}${r.n?`・${r.n}${r.sport==='boat'?'艇':r.sport==='keirin'?'車':'頭'}`:''}</div></td>
      <td class="c-tm"><span class="tm ${soon?'soon':''}">${esc(r.close||'')}<small>${done?(r.res?'結果 '+r.res.join('-'):'締切済み'):m!=null?(m>=90?`あと${Math.floor(m/60)}時間${m%60}分`:`あと${m}分`):''}</small></span></td>
      <td class="c-fav fav">${r.fav?`<b>${r.fav.no} ${esc(r.fav.name)}</b><span class="p">${pct(r.fav.p,0)}</span>`:'—'}</td>
      <td class="c-ev ev">${b?`<b>${b.ev.toFixed(2)}</b>　${esc(b.kind)} <span class="k">${esc(b.k)}</span> <span class="s">確率${pct(b.p,1)}×${b.o}倍</span>`:`<span class="s">${r.market?'期待値を出せる組なし（確率1%以上・300倍以下の組が無い）':'オッズ前（段位なし）'}</span>`}${r.market?`<div class="s">${esc(r.market)}</div>`:''}</td>
      <td class="c-conf conf"><b>${r.conf!=null?Math.round(r.conf*100):'—'}</b><div class="cbar"><i style="width:${Math.min(100,(r.conf||0)*200).toFixed(0)}%"></i></div></td>
      <td class="c-go go"><a href="${esc(r.url)}">予想を見る →</a></td></tr>`;}).join('')}</tbody></table>`;
  /* 段位の決め方と実績 */
  const S=NKPICKS.sports;
  const btRow=(k,v)=>v?`<tr><td class="l">${esc(k)}</td><td>${v.races?.toLocaleString?.()??v.races??'—'}</td><td>${v.hit!=null?v.hit+'%':'—'}</td><td>${v.roi!=null?(v.roi>3?v.roi.toFixed(1):(v.roi*100).toFixed(1))+'%':'—'}</td></tr>`:'';
  /* 実戦の段位ごとの回収率（締切前後に記録した予想を払戻で精算。検証ではない） */
  const ACT=NKPICKS.actual||{};
  const actHtml=Object.keys(ACT).length?Object.entries(ACT).map(([sp,G])=>{const keys=[...new Set(Object.values(G).flatMap(x=>Object.keys(x.bets||{})))];
    const tot=Object.values(G).reduce((a,x)=>a+x.races,0);
    return `<h3 style="font-family:var(--mincho);font-size:13px;margin:10px 0 4px"><span class="sp ${sp}">${SPN[sp]||sp}</span> ${tot.toLocaleString()}R${G.S?.pre!=null||G.A?.pre!=null?`<small style="font-family:var(--gothic);font-weight:400;color:var(--sub)">（うち締切前オッズで予想 ${Object.values(G).reduce((a,x)=>a+(x.pre||0),0)}R）</small>`:''}</h3>
      <table class="mini"><tr><th>段位</th><th>R</th>${keys.map(k=>`<th>${esc(k)}<br><small>回収（的中）</small></th>`).join('')}</tr>${['S','A','B','C'].filter(g=>G[g]).map(g=>`<tr><td class="l"><span class="gd ${g}" style="width:20px;height:20px;line-height:20px;font-size:12px">${g}</span></td><td>${G[g].races}</td>${keys.map(k=>{const b=G[g].bets?.[k];return `<td style="${b&&b.roi>=1?'color:var(--red);font-weight:700':''}">${b&&b.bet?`${(b.roi*100).toFixed(0)}%（${pct(b.hit,0)}）`:'—'}</td>`;}).join('')}</tr>`).join('')}</table>`;}).join('')
    :'<p class="note">まだ精算できたレースがありません（段位の記録は 2026-09-28 から）。</p>';
  $('notes').innerHTML=`<h2>実戦の段位ごとの回収率</h2>
    <p class="note">締切前後に記録した予想（後から作り直さない）を、実際の払戻で精算したもの（1点100円）。<b>段位を信用してよいかは、下の「検証」よりこちらの数字で判断する</b>。南関は当時の入力（締切前オッズがある日はそれ）で予想を再現した日別成績から。レース数が少ないうちは1本の高配当で大きく動く。</p>
    ${actHtml}
    <h2>段位の決め方</h2>
    <table class="mini"><tr><th>競技</th><th>期待値の券種</th><th>段位の付け方</th><th>S の下限</th><th>A</th><th>B</th></tr>${Object.entries(S).map(([k,v])=>`<tr><td class="l"><span class="sp ${k}">${esc(v.label)}</span></td><td class="l">${k==='nankan'?'馬連・三連複':k==='boat'||k==='keirin'?'3連単':'単勝'}</td><td class="l">${esc(v.gradeBy)}</td><td>${Number.isFinite(v.thresholds?.S)?v.thresholds.S.toFixed(2):'—'}</td><td>${Number.isFinite(v.thresholds?.A)?v.thresholds.A.toFixed(2):'—'}</td><td>${Number.isFinite(v.thresholds?.B)?v.thresholds.B.toFixed(2):'—'}</td></tr>`).join('')}</table>
    <p>期待値＝モデルの確率×オッズ（1.00 で損得なし）。そのレースで期待値がいちばん高い買い目の値を使う。ただし確率1%未満（単勝は3%未満）とオッズ300倍超（単勝は100倍超）の組は、推定がぶれて期待値が膨らむので除いている。
    段位は<b>南関と同じ作り</b>で、各競技の<b>過去の期待値の分布で決めた閾値</b>（上位1割 S・1/4 A・半分 B）に今のオッズでの期待値を当てて付ける。その日の相対順位ではないので、S が1本も無い日もたくさんある日もある。
    <b>券種で期待値の水準がまるで違う</b>（3連単は2〜5、単勝は1前後）ので、閾値は競技ごとに持ち、競技をまたいでは比べない。ボートは過去のオッズが無いので、締切時に記録した期待値が直近14日で500R 貯まるまでは暫定の閾値。</p>
    ${Object.entries(S).filter(([,v])=>v.byGrade&&Object.keys(v.byGrade).length).map(([k,v])=>{const G=v.byGrade;const keys=[...new Set(Object.values(G).flatMap(x=>Object.keys(x.bets)))].slice(0,4);
      return `<h2>段位ごとの回収率（検証）<small style="font-family:var(--gothic);font-size:11px;color:var(--sub)"> ${esc(v.label)}</small></h2><table class="mini"><tr><th>段位</th><th>R</th>${keys.map(x=>`<th>${esc(x)}</th>`).join('')}</tr>${['S','A','B','C'].filter(g=>G[g]).map(g=>`<tr><td class="l"><span class="gd ${g}" style="width:20px;height:20px;line-height:20px;font-size:12px">${g}</span></td><td>${G[g].races}</td>${keys.map(x=>{const b=G[g].bets[x];return `<td>${b?(b.roi*100).toFixed(0)+'%':'—'}</td>`;}).join('')}</tr>`).join('')}</table>`;}).join('')}
    <h2>検証の実績（各競技の検証期間・1点100円）</h2>
    <table class="mini"><tr><th>競技・買い方</th><th>レース</th><th>的中</th><th>回収</th></tr>${Object.entries(S).flatMap(([k,v])=>v.bt&&k!=='nankan'?Object.entries(v.bt).map(([bk,bv])=>btRow(`${v.label}　${bk}`,bv)):[]).join('')}</table>
    <div class="warn"><b>段位は「買う・見送る」の機械的な根拠にしないこと。</b>期待値が高いレースは「モデルと市場の見立てが食い違っているレース」で、モデルが市場を上回っている証拠はまだ無い。南関の検証では期待値1.0超だけを買う方法は回収率が悪く（馬連で110Rの的中0本）、どの競技でも回収率100%を安定して超える買い方は見つかっていない。金額の強弱の参考まで。</div>`;
  $('lead').innerHTML=`南関東・中央・ばんえい・ボート・競輪の、これから締切のレースを1枚にまとめた。各レースに <b>期待値</b>（モデルの確率×拾った最新のオッズ）と <b>段位 S／A／B／C</b>（南関と同じく、過去の分布で決めた閾値による）と <b>自信度</b>（1着の確率の集まり具合。各競技のページと同じ定義で、1頭・1艇・1車に集まっているほど大きい）を付けている。本命の1着確率は「本命」の列に出している。オッズが出る前のレースは段位なし。`;
  $('foot').innerHTML=`各競技の予想ページの生成物から自動で作り直している（どの競技の反映でも更新）。データ時点 ${NKPICKS.built?new Date(NKPICKS.built).toLocaleString('ja-JP',{hour12:false}):''}。オッズは各競技の最新の取得時点のもので、締切前に動く。`;
}
$('fDone').onchange=e=>{F.done=e.target.checked;save();render();};
render();
setInterval(render,30000);
</script>
</body>
</html>
