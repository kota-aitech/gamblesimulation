<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>競輪 出走表と予想</title>
<style>
:root{
  --paper:#fbf8f1; --paper2:#f1ebdc; --band:#1a1512;
  --ink:#14100c; --sub:#6a6055; --faint:#9a9083;
  --rule:#2a2420; --rule2:#cfc6b4; --rule3:#e6dfd0;
  --red:#c0102a; --blue:#1b4f9c; --gold:#f0c24a; --green:#1d6b3f;
  --mincho:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP",serif;
  --gothic:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden;background:var(--paper);color:var(--ink);font-family:var(--gothic);font-size:12.5px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
.masthead{background:var(--band);color:#fdf9f0;padding:8px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.masthead .logo{font-family:var(--mincho);font-size:20px;font-weight:700;letter-spacing:.12em}
.masthead .logo em{font-style:normal;color:var(--gold)}
.masthead .tag{font-size:11px;color:#c8bfae}
.masthead nav{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.masthead nav a{color:#fdf9f0;text-decoration:none;border:1px solid #4a423a;border-radius:2px;padding:3px 10px;font-size:11px;white-space:nowrap}
.bar{display:flex;gap:6px;align-items:center;padding:6px 14px;border-bottom:1px solid var(--rule2);flex-wrap:wrap;background:var(--paper2)}
.bar button{background:#fff;border:1px solid var(--rule2);border-radius:2px;padding:4px 10px;font-size:12px;color:var(--sub)}
.bar button.on{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:700}
.bar .lab{color:var(--faint);font-size:11px;margin-right:2px}
#venues{display:flex;gap:4px;flex-wrap:wrap;padding:6px 14px;border-bottom:1px solid var(--rule2)}
.vbtn{border:1px solid var(--rule2);background:#fff;border-radius:2px;padding:3px 8px;font-size:12px;line-height:1.25;text-align:left;min-width:92px}
.vbtn b{font-family:var(--mincho);font-size:13.5px}
.vbtn small{display:block;color:var(--faint);font-size:10px}
.vbtn .gr{display:inline-block;font-size:9.5px;padding:0 4px;margin-left:4px;background:#8b8578;color:#fff;vertical-align:1px}
.vbtn .gr.G{background:var(--red)}
.vbtn.on{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.vbtn.on small{color:#c8bfae}
.vbtn .soon{color:var(--red);font-weight:700}
#races{display:flex;gap:4px;flex-wrap:wrap;padding:6px 14px;border-bottom:2px solid var(--rule)}
.rbtn{border:1px solid var(--rule2);background:#fff;border-radius:2px;padding:3px 7px;font-size:11.5px;line-height:1.2;text-align:center;min-width:52px}
.rbtn small{display:block;color:var(--faint);font-size:10px}
.rbtn.on{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.rbtn.on small{color:#c8bfae}
.rbtn.done small{color:var(--blue)}
.wrap{padding:10px 14px 40px}
.rhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;overflow-wrap:anywhere;border-bottom:2px solid var(--rule);padding-bottom:6px;margin-bottom:8px}
.rhead .rno{font-family:var(--mincho);font-size:22px;font-weight:700}
.rhead .rname{font-family:var(--mincho);font-size:18px;font-weight:700}
.rhead .grade{display:inline-block;background:var(--red);color:#fff;font-size:11px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.rhead .cond{color:var(--sub);font-size:12px}
.rhead .lvl{display:inline-block;padding:0 6px;font-size:10px;font-weight:700;color:#fff;background:#8b8578}
.rhead .lvl.joint{background:var(--green)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:14px;align-items:start}
.cols>div{min-width:0}
.sec{font-family:var(--mincho);font-size:14px;margin:14px 0 6px;border-left:5px solid var(--red);padding-left:8px}
.sec:first-child{margin-top:0}
/* 並び予想 */
.narabi{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;background:#fff;border:1px solid var(--rule2);padding:8px 10px}
.narabi .arrow{font-family:var(--mincho);font-size:20px;color:var(--sub);align-self:center}
.narabi .ln{display:flex;gap:2px;border-bottom:3px solid var(--rule);padding-bottom:3px}
.narabi .ln.single{border-bottom-style:dotted;border-bottom-color:var(--faint)}
.narabi .car{width:52px;text-align:center}
.narabi .car .no{display:block;font-family:var(--mincho);font-size:20px;font-weight:700;border:1px solid var(--rule);line-height:30px}
.narabi .car .nm{display:block;font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.narabi .car .rl{display:block;font-size:9.5px;color:var(--sub)}
.narabi .car .sc{display:block;font-size:10px;color:var(--sub)}
.narabi .car .pw{display:block;font-family:var(--mincho);font-size:12.5px;font-weight:700;color:var(--red)}
.home{display:inline-block;font-size:9.5px;padding:0 3px;background:var(--red);color:#fff;border-radius:2px;margin-left:2px;vertical-align:1px}
.home.reg{background:#d98a92}
.tag2{display:inline-block;font-size:9.5px;padding:0 3px;border:1px solid var(--green);color:var(--green);border-radius:2px;margin-left:2px;vertical-align:1px;white-space:nowrap}
.tag2.init{border-color:var(--red);color:var(--red);font-weight:700}
.tag2.bad{border-color:var(--faint);color:var(--sub)}
.board{overflow-x:auto}
table.uma{border-collapse:collapse;width:100%;min-width:1000px;font-size:11.5px}
table.uma th{background:var(--band);color:#efe7d8;font-weight:600;font-size:10.5px;padding:3px 4px;border:1px solid #000;white-space:nowrap}
table.uma td{border:1px solid var(--rule2);padding:3px 4px;vertical-align:top}
table.uma tr.h{background:#fff}
table.uma tr.h:nth-child(even){background:#fdfbf6}
td.mk{font-family:var(--mincho);font-size:18px;font-weight:700;text-align:center;width:28px}
.m1{color:var(--red)}.m2{color:var(--blue)}
td.wk{text-align:center;width:40px}
.num{display:inline-block;min-width:26px;padding:1px 4px;text-align:center;font-weight:700;font-family:var(--mincho);font-size:15px;border:1px solid var(--rule)}
td.hn{min-width:170px}
.hname{font-family:var(--mincho);font-size:15px;font-weight:700;white-space:nowrap}
.hsub{font-size:10.5px;color:var(--sub)}
.tipm{font-size:10px;color:var(--sub)}
td.sc{width:78px;text-align:right;white-space:nowrap}
td.sc b{font-family:var(--mincho);font-size:15px}
td.sc .s{color:var(--sub);font-size:10.5px}
td.ln{width:74px;font-size:11px;white-space:nowrap}
td.ln b{font-family:var(--mincho)}
td.st{width:150px;font-size:10.5px;line-height:1.35;white-space:nowrap}
td.st .s{color:var(--sub)}
td.pr{width:84px;text-align:right;white-space:nowrap}
.pwin{font-family:var(--mincho);font-size:15px;font-weight:700;color:var(--red)}
.p3{font-size:11px;color:var(--sub)}
.od{font-size:10.5px;color:var(--faint)}
td.meet{min-width:190px;font-size:11px;line-height:1.5}
.mrow{white-space:nowrap}
.mrow .v{display:inline-block;min-width:56px;font-weight:700;font-family:var(--mincho)}
.mrow .g{display:inline-block;min-width:22px;color:var(--sub);font-size:10px}
.mrow .k{color:var(--sub);font-size:10px;margin-left:4px}
.mrow.cur .v{color:var(--red)}
.ps{display:inline-block;min-width:13px;text-align:center;font-family:var(--mincho);font-weight:700}
.ps.p1{color:var(--red)}.ps.p23{color:var(--blue)}.ps.px{color:var(--faint)}
.side .sec:first-child{margin-top:0}
.rec{border:1px solid var(--rule2);background:#fff;padding:7px 10px;margin:4px 0;font-size:12px}
.rec b{font-family:var(--mincho);font-size:13.5px}
.rec .s{color:var(--sub);font-size:11px}
.chip{display:inline-block;border:1px solid var(--rule2);background:#fff;padding:1px 6px;margin:2px 3px 2px 0;font-size:11.5px}
.chip b{font-family:var(--mincho)}
.chip i{font-style:normal;color:var(--sub);margin-left:4px;font-size:10.5px}
.chip.ev{border-color:var(--green)}
.warn{margin:6px 0;padding:6px 10px;background:#fff4f2;border-left:4px solid var(--red);font-size:11px;line-height:1.6}
.resbox{margin:0 0 10px;padding:7px 10px;background:#fff;border:2px solid var(--blue);font-size:12.5px}
.resbox b{font-family:var(--mincho);font-size:15px}
ul.points{margin:4px 0 0;padding-left:18px;font-size:12px}
ul.points li{margin:3px 0}
.memo{padding:5px 0;border-bottom:1px dotted var(--rule3);font-size:11px;color:var(--sub)}
.memo b{color:var(--ink);font-family:var(--mincho)}
.cb{display:grid;grid-template-columns:40px 1fr 40px;gap:6px;align-items:center;font-size:10.5px;margin:1px 0}
.cb .b2{height:7px;background:var(--rule3);position:relative;overflow:hidden}
.cb .b2 i{position:absolute;top:0;bottom:0;background:var(--red)}
.cb .b2 i.neg{background:var(--blue)}
.cb .v{text-align:right;color:var(--sub)}
.src{color:var(--faint);font-size:10.5px;margin-top:10px;line-height:1.6}
table.mini{border-collapse:collapse;font-size:11px;width:100%;background:#fff}
table.mini th,table.mini td{border:1px solid var(--rule2);padding:2px 5px;text-align:right}
table.mini th{background:var(--paper2);font-weight:600;text-align:center}
table.mini td.l{text-align:left}
table.mini tr.on td{background:#fff4d6}
.mnote{font-size:10.5px;color:var(--sub);margin-top:3px}
footer{border-top:2px solid var(--rule);background:var(--paper2);padding:10px 14px 30px;color:var(--sub);font-size:11px;line-height:1.7}
.empty{padding:30px 14px;color:var(--sub)}
@media (max-width:900px){
  .cols{grid-template-columns:1fr}
  .masthead .tag{display:none}
  table.uma{min-width:0;width:100%;table-layout:fixed}
  table.uma thead{display:none}
  td.mob{padding:5px 6px}
  .mtop{display:grid;grid-template-columns:24px 34px minmax(0,1fr) 76px;gap:4px 6px;align-items:start}
  .mtop .mk{font-family:var(--mincho);font-size:18px;font-weight:700;text-align:center}
  .mtop>div{min-width:0}
  .mtop .hname{white-space:normal;font-size:14.5px}
  .mtop .pr{text-align:right;white-space:nowrap}
  .mstat{font-size:10.5px;color:var(--sub);margin-top:3px;line-height:1.4;overflow-wrap:anywhere}
  .mmeet{margin-top:4px;padding-top:3px;border-top:1px dotted var(--rule3);font-size:10.5px}
  .mrow{white-space:normal}
  .mstat b{color:var(--ink)}
  .mmeets{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;padding:4px 0 2px;margin-top:3px}
  .mmeets .mt{flex:none;width:140px;border:1px solid var(--rule3);padding:3px 4px;scroll-snap-align:start;font-size:10.5px;line-height:1.3}
  .wrap{padding:8px 8px 40px}
  .narabi{gap:6px;padding:6px;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .narabi .ln{flex:none}
  .narabi .car{width:40px}
  .narabi .car .no{font-size:17px;line-height:26px}
  .masthead nav a{padding:3px 7px}
  #venues,#races{padding:6px 8px}
}
.rk{display:inline-block;min-width:20px;padding:0 4px;text-align:center;font-family:var(--mincho);font-weight:700;color:#fff;background:#8b8578;border-radius:2px;margin-right:3px}
.rk.gS{background:var(--red)}.rk.gA{background:#d99a2b}.rk.gB{background:var(--blue)}.rk.gC{background:#8b8578}
.rk.big{font-size:17px;min-width:30px;padding:2px 6px;vertical-align:2px}
table.rkt{border-collapse:collapse;font-size:11px;width:100%;background:#fff;margin-top:4px}
table.rkt th,table.rkt td{border:1px solid var(--rule2);padding:2px 5px;text-align:right}
table.rkt th{background:var(--paper2);font-weight:600;text-align:center}
table.rkt td.l{text-align:left}table.rkt tr.on td{background:#fff4d6}
</style>
</head>

</div>

  $('races').innerHTML=v.races.map((x,i)=>`<button class="rbtn ${i===state.ri?'on':''} ${x.result?'done':''}" data-i="${i}">${rkBadge(x.grade)}${x.r}R<small>${x.result?x.result.order.map(o=>o[1]).join('-'):esc(x.post||'')}</small></button>`).join('');
  document.querySelectorAll('#dayTabs button').forEach(b=>b.onclick=()=>load(+b.dataset.i,0,0));
  document.querySelectorAll('#venues .vbtn').forEach(b=>b.onclick=()=>{const vv=day.venues[+b.dataset.i];const nx=isToday?nextRace(vv):null;load(state.di,+b.dataset.i,nx?vv.races.indexOf(nx):0);});
  document.querySelectorAll('#races .rbtn').forEach(b=>b.onclick=()=>load(state.di,state.vi,+b.dataset.i));
  $('rhead').innerHTML=`${rkBadge(r.grade,true)}<span class="rno">${esc(v.venue)} ${r.r}R</span><span class="rname">${esc(r.kind||'')}${v.grade?`<span class="grade">${esc(v.grade)}</span>`:''}</span><span class="cond">${fmtDW(day.date)}　${esc(v.meetName||'')} ${v.day}日目　${r.bank||v.bank||'?'}バンク${r.bankInfo?`（直線${r.bankInfo.straight}m・カント${r.bankInfo.cant}°）`:''}　${r.post?`発走 ${r.post}`:''}${r.close?`（締切 ${r.close}）`:''}　${r.n}車${r.title?`　「${esc(r.title)}」`:''}</span><span class="lvl ${r.level}">${r.level==='joint'?'市場＋特徴量':'基礎モデル'}</span>${r.cond?`<span class="cond" style="width:100%">勝ち上がり：${esc(r.cond)}</span>`:''}`;
  $('resbox').innerHTML=r.result?`<div class="resbox">結果 <b>${r.result.order.map(o=>o[1]).join(' - ')}</b>${r.result.order[0]?.[2]?`（${esc(r.result.order[0][2])}）`:''}${r.result.e3?`　3連単 ${r.result.e3.y.toLocaleString()}円（${r.result.e3.pop}番人気）`:''}${r.result.q3?`　3連複 ${r.result.q3.y.toLocaleString()}円`:''}${r.result.e2?`　2車単 ${r.result.e2.y.toLocaleString()}円`:''}${r.result.wind!=null?`　<span class="s">${esc(r.result.weather||'')} 風速${r.result.wind}m</span>`:''}</div>`:'';
  const byNo=Object.fromEntries(r.riders.map(h=>[h.no,h]));
  /* 並び予想 */
  const lines=r.lines&&r.lines.length?r.lines:[];
  $('narabi').innerHTML=lines.length?`<span class="arrow">←</span>`+lines.map((l,li)=>`<div class="ln ${l.length===1?'single':''}">${l.map((no,pi)=>{const h=byNo[no]||{};const role=(r.lineRole[li]||[])[pi]||'';return `<div class="car"><span class="no" style="${carStyle(no)}">${no}</span><span class="nm">${esc((h.name||'').split(' ')[0])}${homeTag(h)}</span><span class="rl">${esc(role)}${h.init===1?'<b style="color:var(--red)">・主</b>':''}</span><span class="sc">${h.score??''}</span><span class="pw">${pct(h.p1,0)}</span></div>`;}).join('')}</div>`).join(''):`<span class="s" style="color:var(--sub)">${r.girls?'ガールズ（ラインなし・全員単騎）':'並び予想なし'}</span>`;
  const rs=r.riders.slice().sort((a,b)=>a.no-b.no);
  const sRank=h=>rs.filter(x=>(x.score||0)>(h.score||0)).length+1;
  const statBlock=h=>`<div>勝率 <b>${h.winRate??'—'}</b> 2連 ${h.q2??'—'} 3連 ${h.q3??'—'}</div><div class="s">${(h.w||[]).map(x=>x??0).join('-')}　S${h.S??0} B${h.B??0}</div><div class="s">逃${h.nige??0} 捲${h.makuri??0} 差${h.sashi??0} マ${h.mark??0}</div>`;
  const priceBlock=h=>`<div class="pwin">${pct(h.p1,1)}</div><div class="p3">3着内 ${pct(h.top3,0)}</div>${h.mkt!=null?`<div class="od" title="3連単オッズから逆算した1着確率">人気 ${pct(h.mkt,1)}</div>`:''}`;
  const nameBlock=h=>`<div class="hname">${esc(h.name)}${homeTag(h)}${traitTags(h,bankOf(r))}</div><div class="hsub">${esc(h.pref||'')}/${h.age??''}歳/${h.term??''}期　<b>${esc(h.cls||'')}</b>　${esc(h.style||'')}　ギヤ${h.gear??'—'}</div>${h.tip||h.comment?`<div class="tipm">${h.tip?`記者${esc(h.tip)} `:''}${h.comment?`「${esc(h.comment)}」`:''}</div>`:''}`;
  const lineBlock=h=>h.line?`<b>${esc(h.line.slot)}</b>${h.init===1?'<span class="tag2 init" title="B・逃げの比率から主導権を取りそうな先頭">主導権</span>':''}<div class="s" style="color:var(--sub)">${(lines[h.line.li]||[]).join('-')}</div>`:'<span style="color:var(--faint)">—</span>';
  if(isMobile()){
    $('ubody').innerHTML=rs.map(h=>`<tr class="h"><td class="mob" colspan="8"><div class="mtop"><div class="mk ${MARKC[h.markAI]||''}">${h.markAI||'　'}</div><div><span class="num" style="${carStyle(h.no)}">${h.no}</span></div><div>${nameBlock(h)}<div class="mstat">得点 <b>${h.score??'—'}</b>（${sRank(h)}位）${h.line?`　ライン <b>${esc(h.line.slot)}</b>`:''}　勝率 ${h.winRate??'—'}・3連 ${h.q3??'—'}　逃${h.nige??0}捲${h.makuri??0}差${h.sashi??0}マ${h.mark??0}</div></div><div class="pr">${priceBlock(h)}</div></div><div class="mmeet">${meetRows(h)}</div></td></tr>`).join('');
  }else{
    $('ubody').innerHTML=rs.map(h=>`<tr class="h"><td class="mk ${MARKC[h.markAI]||''}">${h.markAI}</td><td class="wk"><span class="num" style="${carStyle(h.no)}">${h.no}</span></td><td class="hn">${nameBlock(h)}</td><td class="sc"><b>${h.score??'—'}</b><div class="s">${sRank(h)}位</div></td><td class="ln">${lineBlock(h)}</td><td class="st">${statBlock(h)}</td><td class="pr">${priceBlock(h)}</td><td class="meet">${meetRows(h)}</td></tr>`).join('');
  }
  const bt=NKKEIRIN.meta.backtest,T=bt?.table||{};
  const ref=(n,lab='検証')=>{const t=T[n];return t?`<div class="s">${lab} ${bt.races.toLocaleString()}R：的中 ${t.hit}%${t.roi!=null?`・回収 <b>${t.roi}%</b>`:''}</div>`:'<div class="s">検証データなし</div>';};
  const chips=(list,n,withO)=>list&&list.length?list.slice(0,n).map(x=>`<span class="chip"><b>${x.k}</b><i>${pct(x.p,1)}${withO&&x.o?`・${x.o}倍`:''}</i></span>`).join(''):'<span class="s">—</span>';
  $('ai').innerHTML=`<div class="rec"><div>3連単 確率上位</div>${chips(r.e3,8,true)}${ref('AI 3連単 上位5点','上位5点 検証')}</div>
    <div class="rec"><div>3連複 確率上位</div>${chips(r.q3,5,true)}${ref('AI 3連複 上位3点','上位3点 検証')}</div>
    <div class="rec"><div>2車単・2車複</div>${chips(r.e2,4,true)}<span class="s">｜複</span> ${chips(r.q2,3,true)}${ref('AI 2車単 上位3点','2車単上位3点 検証')}</div>
    <div class="rec"><div>ワイド</div>${chips(r.wide,3)}</div>
    ${r.lineBet?`<div class="rec"><div>ライン決着（本命ラインの表裏）</div>${r.lineBet.e2.map(k=>`<span class="chip"><b>${k}</b></span>`).join('')}${ref('ライン 2車単 表裏2点')}</div>`:''}
    ${r.ev&&r.ev.length?`<div class="rec"><div>期待値 1.0 超の3連単（モデル確率×オッズ）</div>${r.ev.map(x=>`<span class="chip ev"><b>${x.k}</b><i>${x.o}倍・${x.ev}</i></span>`).join('')}${ref('期待値1.0超 3連単')}<div class="s">オッズ ${esc(r.oddsAt||'')}${r.oddsConfirmed?'（確定）':'時点'}</div></div>`:''}`;
  const top=r.riders.slice().sort((a,b)=>b.p1-a.p1);
  $('rank').innerHTML=rankBox(r);
  $('box').innerHTML=`<div class="rec">◎ <b>${top[0].no} ${esc(top[0].name)}</b>（1着 ${pct(top[0].p1,1)}）${ref('◎1着','◎の1着率 検証')}</div>
    <div class="rec">◎-○ 2車複 <b>${[top[0].no,top[1].no].sort((a,b)=>a-b).join('-')}</b>${ref('◎-○ 2車複')}</div>
    <div class="rec">本命3車BOX 3連複 <b>${r.box3.join('-')}</b>${ref('3車BOX 3連複')}</div>
    <div class="rec">本命4車BOX 3連複 <b>${r.box4.join('-')}</b>${ref('4車BOX 3連複')}</div>
    <div class="warn">${bt?`検証（${bt.from}〜${bt.to}）の実測。人気上位3車の3連複は ${T['［基準］人気上位3車 3連複']?.roi??'—'}%、人気1位の3連単は ${T['［基準］人気1位の3連単1点']?.roi??'—'}%。${esc(bt.note||'')}`:'検証データがまだ無い。'} 買う・見送るの機械的な根拠にはせず、金額の強弱の参考まで。</div>`;
  $('points').innerHTML=r.points.map(p=>`<li>${esc(p)}</li>`).join('');
  const G=NKKEIRIN.meta.groups||[];
  $('memo').innerHTML=top.map(h=>`<div class="memo"><b>${h.markAI||'　'} ${h.no} ${esc(h.name)}</b>（${pct(h.p1,1)}）　${h.note.map(esc).join('　')}<div style="margin-top:3px;max-width:520px">${G.map((g,i)=>[g,h.c[i]]).filter(([,x])=>Math.abs(x)>=0.03).map(([g,x])=>`<div class="cb"><span>${g}</span><div class="b2"><i class="${x<0?'neg':''}" style="left:${x<0?50-Math.min(50,Math.abs(x)/1.2*50):50}%;width:${Math.min(50,Math.abs(x)/1.2*50)}%"></i></div><span class="v">${x>=0?'+':''}${x.toFixed(2)}</span></div>`).join('')}</div></div>`).join('');
  const m=NKKEIRIN.meta,ix=m.index||{};
  const H=ix.home||{},VS=(ix.venues||{})[v.venue];
  const hrow=(lab,x)=>x&&x.runs?`<tr><td class="l">${lab}</td><td>${x.runs.toLocaleString()}</td><td>${pct(x.win,1)}</td><td>${pct(x.expWin,1)}</td><td><b>${x.winMult!=null?x.winMult.toFixed(2)+'倍':'—'}</b></td><td>${x.top3Mult!=null?x.top3Mult.toFixed(2)+'倍':'—'}</td></tr>`:'';
  $('stats').innerHTML=`<table class="mini"><tr><th>地元選手</th><th>走</th><th>1着率</th><th>同順位の他</th><th>1着</th><th>3着内</th></tr>${hrow('全体',H.all)}${hrow('予選',H['stage:pre'])}${hrow('準決勝',H['stage:semi'])}${hrow('決勝',H['stage:final'])}${hrow('F2',H['grade:F2'])}${hrow('F1',H['grade:F1'])}${hrow('G3',H['grade:G3'])}${hrow('ガールズ',H.girls)}</table>
    <div class="mnote">「同順位の他」＝同じレースで競走得点の順位が同じ、地元以外の選手の1着率。倍率＝地元の実際÷その期待（「地元3割増し」なら 1.30倍）。</div>
    ${ix.slots?`<table class="mini" style="margin-top:6px"><tr><th>ラインの位置</th>${ix.slots.map(s=>`<th>${s.name}</th>`).join('')}</tr><tr><td class="l">1着率</td>${ix.slots.map(s=>`<td>${pct(s.win,1)}</td>`).join('')}</tr><tr><td class="l">2連対率</td>${ix.slots.map(s=>`<td>${pct(s.q2,1)}</td>`).join('')}</tr><tr><td class="l">3着内率</td>${ix.slots.map(s=>`<td>${pct(s.top3,1)}</td>`).join('')}</tr>${VS?`<tr class="on"><td class="l">${esc(v.venue)} 1着率</td>${VS.slot.map(s=>`<td>${pct(s.win,1)}</td>`).join('')}</tr>`:''}</table>
    <div class="mnote">ライン決着（1・2着が同じライン）は全体 ${pct(ix.lineOneTwo,1)}${VS?`、${esc(v.venue)} ${pct(VS.lineOneTwo,1)}`:''}。${VS?`${esc(v.venue)}の決まり手：${Object.entries(VS.kim||{}).map(([k,x])=>`${esc(k)} ${pct(x,0)}`).join('・')}（${VS.races.toLocaleString()}R、人気1位の1着率 ${pct(VS.fav,0)}、3連単の中央値 ${VS.e3Med?VS.e3Med.toLocaleString()+'円':'—'}・万車券 ${pct(VS.man,0)}）`:''}</div>`:''}`;
  $('src').textContent=`出走表・並び予想・オッズ・結果・払戻は楽天Kドリームスの公開ページ。モデルは条件付きロジット（学習 ${m.model?.train?.toLocaleString()??'—'}R／検証 ${m.model?.test?.toLocaleString()??'—'}R、1着的中 ${m.model?.base?pct(m.model.base.hit1,1):'—'}${m.model?.mktOnly?`、人気だけなら ${pct(m.model.mktOnly.hit1,1)}`:''}${m.model?.joint?`、市場込み ${pct(m.model.joint.hit1,1)}`:''}）。${ix.races?`実測は ${ix.from}〜${ix.to} の ${ix.races.toLocaleString()}レース。`:''}生成 ${m.built?new Date(m.built).toLocaleString('ja-JP',{hour12:false}):''}`;
  document.title=`競輪 ${v.venue} ${r.r}R ${r.kind||''}`;
}
$('tag').textContent='楽天Kドリームスの公開ページから自動生成';
$('foot').innerHTML='予想は条件付きロジット（Plackett–Luce、温度較正つき）＋2着・3着の段階モデル（1着とのライン関係で2着の分布を変える）。競走得点・ライン（並び予想の位置・先頭の自力・他ラインとの先行争い）・地元（登録府県＝開催場）・近況・当所と同走路の成績・当日のバンク傾向を特徴量にしている。3連単オッズが出ているレースは市場（3連単から逆算した1着確率）も特徴量に入れた joint モデル。推定の確率は実測（競走得点・成績）と区別して表示している。';
pick();render();
setInterval(()=>{if(NKKEIRIN.days[state.di]?.date===todayYmd())render();},30000);
let mob=isMobile();window.addEventListener('resize',()=>{if(isMobile()!==mob){mob=isMobile();render();}});
</script>
</body>
</html>
